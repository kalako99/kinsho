<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/static/api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ theme_css | safe }}
  <title>Reader — KINSHO</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ── TOP BAR (visual/interaction conventions copied from chapter_reader.html) ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: color-mix(in srgb, var(--color-secondary, #1a1a1a) 70%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .topbar.visible { opacity: 1; pointer-events: all; }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }

    .topbar-title {
      flex: 1;
      font-family: 'Segoe UI', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── EPUB PAGE (fixed A4-like proportions, independent of window/container
       shape -- responsive via CSS min()/aspect-ratio, not stretched full-bleed) ── */
    #epubViewport {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #epubPageBox {
      position: relative;
      aspect-ratio: 1 / 1.4142; /* A4 portrait */
      width: min(90vw, 900px, 63.6vh);
      max-height: 90vh;
      background: #fff;
      box-shadow: 0 8px 44px rgba(0,0,0,0.55);
      overflow: hidden;
    }
    #epubFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* Tap zones (same 30/40/30 split + interaction model as chapter_reader.html's
       single-page mode): left/right flip pages, center toggles the chrome. These
       live permanently in the parent document -- never inside the iframe -- so a
       tap always reaches them regardless of chrome visibility; text inside the
       iframe is not meant to be selectable in this reader (see .sp-zone below),
       so there's no competing interaction to preserve. */
    .sp-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 30%;
      z-index: 10;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .sp-zone-left   { left: 0; }
    .sp-zone-right  { right: 0; }
    .sp-zone-center { left: 30%; width: 40%; cursor: default; }

    /* ── BOTTOM CONTAINER / BAR (copied conventions from chapter_reader.html) ── */
    #bottom-container {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100vw - 48px);
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      width: 100%;
    }
    .bottombar.visible { opacity: 1; pointer-events: all; }
    .bb-row { display: flex; align-items: center; justify-content: center; gap: 16px; }

    .bb-chapbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .bb-chapbtn:hover { background: rgba(255,255,255,0.1); }
    .bb-chapbtn:disabled { opacity: 0.25; cursor: not-allowed; }

    .bb-chap-dropdown { position: relative; }
    .bb-chap-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 5px 10px;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .bb-chap-btn:hover,
    .bb-chap-btn.open { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); }
    .bb-chap-btn svg { flex-shrink: 0; opacity: 0.6; }

    .bb-chap-menu {
      position: absolute;
      bottom: calc(100% + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      min-width: 260px;
      max-width: 340px;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
      z-index: 300;
      padding: 4px 0;
      display: none;
    }
    .bb-chap-menu.open { display: block; }

    .bb-chap-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      gap: 10px;
    }
    .bb-chap-menu-item:hover { background: rgba(255,255,255,0.07); }
    .bb-chap-menu-item.active {
      color: var(--theme-primary, #e94560);
      background: rgba(255,255,255,0.04);
    }
    .bb-chap-menu-item .bb-chap-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .bb-chap-menu-item .bb-chap-num { font-size: 0.68rem; color: #555; flex-shrink: 0; }
    .bb-chap-menu-item.active .bb-chap-num { color: var(--theme-primary, #e94560); opacity: 0.7; }

    .bb-iconbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      color: #aaa;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .bb-iconbtn:hover { background: rgba(255,255,255,0.1); color: #f0f0f0; }
    .bb-iconbtn.active { color: var(--theme-primary, #e94560); }

    /* ── SETTINGS PANEL (font size only, per v1 scope) ── */
    .settings-panel {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px 18px;
      min-width: 240px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .settings-panel.open { display: flex; }
    .settings-section-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
    }
    .settings-fontsize-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .settings-fontsize-range {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      cursor: pointer;
    }
    .settings-fontsize-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      cursor: pointer;
    }
    .settings-fontsize-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      border: none;
      cursor: pointer;
    }
    .settings-fontsize-value {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: #888;
      min-width: 34px;
      text-align: right;
    }

    @media (max-width: 540px) {
      #bottom-container { bottom: 12px; }
      .bb-chap-btn { max-width: 150px; }
    }
  </style>
</head>
<body class="cursor-hidden"><!-- UI starts hidden, matching chapter_reader.html's convention -->

<div class="topbar" id="topbar">
  <button class="back-btn" id="backBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
  <span class="topbar-title" id="topbarTitle">Loading…</span>
</div>

<div id="epubViewport">
  <div id="epubPageBox">
    <iframe id="epubFrame" sandbox="allow-same-origin"></iframe>
  </div>
  <div class="sp-zone sp-zone-left" id="spZoneLeft"></div>
  <div class="sp-zone sp-zone-center" id="spZoneCenter"></div>
  <div class="sp-zone sp-zone-right" id="spZoneRight"></div>
</div>

<div id="bottom-container">
  <div class="bottombar" id="bottombar">
    <div class="bb-row">
      <button type="button" class="bb-chapbtn" id="bbPrevVol" aria-label="Previous volume" title="Previous volume">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="bb-chap-dropdown" id="bbChapDropdown">
        <button type="button" class="bb-chap-btn" id="bbChapBtn" aria-haspopup="listbox" aria-expanded="false">
          <span id="bbChapLabel">Loading…</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="bb-chap-menu" id="bbChapMenu" role="listbox"></div>
      </div>
      <button type="button" class="bb-chapbtn" id="bbNextVol" aria-label="Next volume" title="Next volume">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="bb-iconbtn" id="bbSettingsBtn" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-section-title">Font size</div>
  <div class="settings-fontsize-row">
    <input class="settings-fontsize-range" type="range" min="70" max="200" step="5" value="100" id="fontSizeRange">
    <span class="settings-fontsize-value" id="fontSizeValue">100%</span>
  </div>
</div>

<script>
  const backBtn       = document.getElementById('backBtn');
  const topbar        = document.getElementById('topbar');
  const topbarTitle    = document.getElementById('topbarTitle');
  const bottombar     = document.getElementById('bottombar');
  const epubPageBox   = document.getElementById('epubPageBox');
  const epubFrame     = document.getElementById('epubFrame');
  const spZoneLeft    = document.getElementById('spZoneLeft');
  const spZoneCenter  = document.getElementById('spZoneCenter');
  const spZoneRight   = document.getElementById('spZoneRight');
  const bbPrevVol     = document.getElementById('bbPrevVol');
  const bbNextVol     = document.getElementById('bbNextVol');
  const bbChapBtn     = document.getElementById('bbChapBtn');
  const bbChapLabel   = document.getElementById('bbChapLabel');
  const bbChapMenu    = document.getElementById('bbChapMenu');
  const bbSettingsBtn = document.getElementById('bbSettingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const fontSizeRange = document.getElementById('fontSizeRange');
  const fontSizeValue = document.getElementById('fontSizeValue');

  // ── URL PARAMS (same convention as chapter_reader.html) ──
  const parts      = window.location.pathname.split('/');
  const libraryId  = parts[2];
  const mangaId    = parts[3];
  const volumeId   = parts[5];
  const startIndex = parseInt(new URLSearchParams(window.location.search).get('page') || '0', 10);

  const ASSET_PREFIX = `/api/manga/${libraryId}/${mangaId}/volume/${volumeId}/epub/asset/`;

  let spineCount    = 0;
  let currentIndex  = Math.max(0, startIndex);
  let volumesList   = [];
  let lastHtml      = '';
  let lastCss       = '';
  let pageW         = 0;
  let pageH         = 0;
  let textPageIdx   = 0;
  let totalTextPages = 1;
  let pageBreaks    = [0];

  function exitFullscreen() {
    if      (document.exitFullscreen)       document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
  }
  backBtn.addEventListener('click', () => {
    exitFullscreen();
    window.location.href = `/manga/${libraryId}/${mangaId}`;
  });

  // ── TOP/BOTTOM BAR VISIBILITY ──
  // Mirrors chapter_reader.html's showAll()/hideAll() (tap-anywhere-to-toggle,
  // auto-hide after 3s of no chrome interaction). Unlike the first version of
  // this reader, the tap target is the permanent #spZoneCenter div living in
  // the parent document (see below) -- not a toggled overlay reaching into the
  // iframe -- so this works regardless of the iframe's own state.
  let barVisible = false;
  let barTimer   = null;

  function showAll() {
    topbar.classList.add('visible');
    bottombar.classList.add('visible');
    barVisible = true;
    document.body.classList.remove('cursor-hidden');
    clearTimeout(barTimer);
    barTimer = setTimeout(() => {
      if (topbar.matches(':hover') || bottombar.matches(':hover') || settingsPanel.matches(':hover')) return;
      hideAll();
    }, 3000);
  }

  function hideAll() {
    topbar.classList.remove('visible');
    bottombar.classList.remove('visible');
    settingsPanel.classList.remove('open');
    barVisible = false;
    document.body.classList.add('cursor-hidden');
  }

  // ── FETCH HELPERS ──
  async function apiFetch(path) {
    const r = await fetch(apiUrl(path));
    return r.json();
  }

  function fontSizePctValue() {
    return parseInt(localStorage.getItem('kinshoEpubFontSize') || '100', 10);
  }

  // Text is deliberately non-selectable in this reader (tap zones double as
  // page-flip controls, same as chapter_reader.html's single-page mode) --
  // applied via the iframe's own stylesheet since user-select can't be forced
  // from outside a same-origin-but-separate document.
  //
  // Pagination is a fixed-height "picture frame" (#pg-outer, padded, clipped)
  // around a naturally-tall, single-column flow of the chapter's content
  // (#pg-inner, the book's own <div> -- retagged server-side from <body> so
  // it can be nested -- at its normal width). A "page" is a vertical slice of
  // that flow, shown by translateY-ing #pg-inner so the slice's own top lines
  // up with the frame's top. This -- not CSS multi-column pagination, tried
  // first -- is the reliable approach: multi-column overflow was found (via
  // direct testing) to not be clippable by any combination of overflow/clip/
  // contain in this rendering engine, visibly bleeding a sliver of the next
  // column past the intended page edge even inside a same-sized iframe.
  // Plain block-flow overflow clipping, used here, has none of that history.
  function buildSrcdoc(html, css, w, h) {
    const rewrittenHtml = html.split(ASSET_PREFIX).join(apiUrl(ASSET_PREFIX));
    const rewrittenCss  = css.split(ASSET_PREFIX).join(apiUrl(ASSET_PREFIX));
    // Single narrow, deliberate override -- not a general !important
    // free-for-all -- so em/rem/%-based sizing in the book's own CSS scales
    // proportionally. Absolute-pixel sizing in decorative front matter won't
    // reflow; an acceptable known v1 limitation.
    const fontSizeCss = `html { font-size: ${fontSizePctValue()}% !important; }`;
    const layoutCss = `
      html, body { margin: 0 !important; padding: 0 !important; overflow: hidden !important; }
      #pg-outer {
        width: ${w}px; height: ${h}px;
        padding: 34px 30px;
        box-sizing: border-box;
        overflow: hidden;
        background: #fff;
      }
      #pg-inner { width: 100%; transition: transform 0.22s ease; user-select: none; }
      #pg-inner * { -webkit-user-select: none; user-select: none; }
    `;
    return `<!doctype html><html><head><meta charset="utf-8">` +
      `<style>${rewrittenCss}</style><style>${fontSizeCss}</style><style>${layoutCss}</style>` +
      `</head><body><div id="pg-outer"><div id="pg-inner">${rewrittenHtml}</div></div></body></html>`;
  }

  function measurePageBox() {
    const rect = epubPageBox.getBoundingClientRect();
    return { w: Math.max(1, Math.round(rect.width)), h: Math.max(1, Math.round(rect.height)) };
  }

  function waitForFrameReady() {
    return new Promise((resolve) => {
      epubFrame.addEventListener('load', function onLoad() {
        epubFrame.removeEventListener('load', onLoad);
        const doc = epubFrame.contentDocument;
        const imgs = doc ? Array.from(doc.images || []) : [];
        if (imgs.length === 0) { resolve(); return; }
        let remaining = imgs.length;
        const done = () => { remaining -= 1; if (remaining <= 0) resolve(); };
        imgs.forEach((img) => {
          if (img.complete) done();
          else { img.addEventListener('load', done, { once: true }); img.addEventListener('error', done, { once: true }); }
        });
      }, { once: true });
    });
  }

  // Page-break Y-offsets that never fall inside a line of text: walks every
  // text node's line boxes (via Range.getClientRects(), one rect per
  // wrapped line) plus every image's own top/bottom, so a candidate break is
  // always between two lines (or a line and an image), never through one.
  // Greedily takes the furthest candidate that still fits within one frame
  // height from the current break, same idea as real reflow-based paginators.
  function computePageBreaks(doc, inner, availH) {
    const originTop = inner.getBoundingClientRect().top;
    const breakYs = new Set([0]);
    const walker = doc.createTreeWalker(inner, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (!node.textContent.trim()) continue;
      const range = doc.createRange();
      range.selectNodeContents(node);
      for (const r of range.getClientRects()) {
        const y = Math.round(r.top - originTop);
        if (y > 0) breakYs.add(y);
      }
    }
    inner.querySelectorAll('img, hr, figure').forEach((el) => {
      const r = el.getBoundingClientRect();
      breakYs.add(Math.max(0, Math.round(r.top - originTop)));
      breakYs.add(Math.round(r.bottom - originTop));
    });
    const sorted = Array.from(breakYs).sort((a, b) => a - b);
    const maxY = inner.scrollHeight;
    const pageStarts = [0];
    let current = 0;
    while (current < maxY - 2) {
      const target = current + availH;
      let next = null;
      for (const y of sorted) {
        if (y > current && y <= target) next = y;
        if (y > target) break;
      }
      if (next === null) next = current + availH; // no clean boundary found -- rare, hard cut
      pageStarts.push(next);
      current = next;
    }
    return pageStarts;
  }

  function showTextPage(idx, animate = true) {
    textPageIdx = Math.min(Math.max(0, idx), totalTextPages - 1);
    const inner = epubFrame.contentDocument.getElementById('pg-inner');
    if (!animate) inner.style.transition = 'none';
    inner.style.transform = `translateY(-${pageBreaks[textPageIdx]}px)`;
    if (!animate) {
      void inner.offsetHeight; // force reflow before re-enabling the transition
      inner.style.transition = '';
    }
  }

  // land: 'start' | 'end' | 'clamp' -- where to position within the newly
  // rendered content (chapter start, chapter end for a backward chapter
  // crossing, or the same text-page index as before for a resize/font-size
  // change, clamped to the new page count).
  async function renderChapterContent(html, css, { land = 'start' } = {}) {
    lastHtml = html;
    lastCss  = css;
    const box = measurePageBox();
    pageW = box.w;
    pageH = box.h;
    epubFrame.srcdoc = buildSrcdoc(html, css, pageW, pageH);
    await waitForFrameReady();
    const doc   = epubFrame.contentDocument;
    const outer = doc.getElementById('pg-outer');
    const inner = doc.getElementById('pg-inner');
    const availH = outer.clientHeight; // content-box height, padding already excluded
    pageBreaks = computePageBreaks(doc, inner, availH);
    totalTextPages = pageBreaks.length;
    let idx = 0;
    if (land === 'end') idx = totalTextPages - 1;
    else if (land === 'clamp') idx = textPageIdx;
    showTextPage(idx, false);
  }

  async function loadSpineChapter(index, { land = 'start', saveProgress = true } = {}) {
    const data = await apiFetch(`/api/manga/${libraryId}/${mangaId}/volume/${volumeId}/epub/chapter/${index}`);
    if (data.error) return;
    currentIndex = data.spine_index;
    spineCount   = data.spine_count;
    await renderChapterContent(data.html, data.css, { land });
    if (saveProgress) saveReadingProgress(currentIndex >= spineCount - 1 ? volumeId : null);
  }

  async function flipNext() {
    if (textPageIdx < totalTextPages - 1) {
      showTextPage(textPageIdx + 1);
    } else if (currentIndex < spineCount - 1) {
      await loadSpineChapter(currentIndex + 1, { land: 'start' });
    }
  }
  async function flipPrev() {
    if (textPageIdx > 0) {
      showTextPage(textPageIdx - 1);
    } else if (currentIndex > 0) {
      await loadSpineChapter(currentIndex - 1, { land: 'end' });
    }
  }

  spZoneCenter.addEventListener('click', () => { barVisible ? hideAll() : showAll(); });
  spZoneLeft.addEventListener('click', () => flipPrev());
  spZoneRight.addEventListener('click', () => flipNext());

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); flipNext(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); flipPrev(); }
  });

  async function saveReadingProgress(completedVolumeId) {
    await fetch(apiUrl('/api/reading/progress'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        library_id:           libraryId,
        manga_id:             mangaId,
        chapter_id:           volumeId,
        page:                 currentIndex,
        completed_chapter_id: completedVolumeId,
      }),
    });
  }

  // ── VOLUME DROPDOWN (matches chapter_reader.html: the bottombar navigates
  // between volumes of this manga, not between pages/chapters within one
  // epub -- in-book navigation is the tap zones + page flip above only) ──
  function buildVolumeMenu() {
    bbChapMenu.innerHTML = '';
    volumesList.forEach((vol, i) => {
      const item = document.createElement('div');
      item.className = 'bb-chap-menu-item' + (vol.id === volumeId ? ' active' : '');
      item.setAttribute('role', 'option');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'bb-chap-name';
      nameSpan.textContent = vol.name;
      const numSpan = document.createElement('span');
      numSpan.className = 'bb-chap-num';
      numSpan.textContent = `${i + 1} / ${volumesList.length}`;
      item.appendChild(nameSpan);
      item.appendChild(numSpan);

      item.addEventListener('click', (e) => {
        e.stopPropagation();
        closeBbMenu();
        if (vol.id !== volumeId) goToVolume(`/manga/${libraryId}/${mangaId}/volume/${vol.id}`);
      });
      bbChapMenu.appendChild(item);
    });

    const current = volumesList.find((v) => v.id === volumeId);
    bbChapLabel.textContent = current ? current.name : 'Volume';
    const idx = volumesList.findIndex((v) => v.id === volumeId);
    bbPrevVol.disabled = idx <= 0;
    bbNextVol.disabled = idx < 0 || idx >= volumesList.length - 1;
  }

  function goToVolume(url) {
    exitFullscreen();
    window.location.replace(url);
  }

  bbPrevVol.addEventListener('click', () => {
    const idx = volumesList.findIndex((v) => v.id === volumeId);
    if (idx > 0) goToVolume(`/manga/${libraryId}/${mangaId}/volume/${volumesList[idx - 1].id}`);
  });
  bbNextVol.addEventListener('click', () => {
    const idx = volumesList.findIndex((v) => v.id === volumeId);
    if (idx >= 0 && idx < volumesList.length - 1) goToVolume(`/manga/${libraryId}/${mangaId}/volume/${volumesList[idx + 1].id}`);
  });

  function openBbMenu() {
    bbChapMenu.classList.add('open');
    bbChapBtn.classList.add('open');
    bbChapBtn.setAttribute('aria-expanded', 'true');
    const activeItem = bbChapMenu.querySelector('.bb-chap-menu-item.active');
    if (activeItem) requestAnimationFrame(() => activeItem.scrollIntoView({ block: 'nearest' }));
  }
  function closeBbMenu() {
    bbChapMenu.classList.remove('open');
    bbChapBtn.classList.remove('open');
    bbChapBtn.setAttribute('aria-expanded', 'false');
  }
  bbChapMenu.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });
  bbChapBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    bbChapMenu.classList.contains('open') ? closeBbMenu() : openBbMenu();
  });
  document.addEventListener('click', () => closeBbMenu());

  // ── SETTINGS PANEL (font size) ──
  fontSizeRange.value = fontSizePctValue();
  fontSizeValue.textContent = fontSizeRange.value + '%';
  fontSizeRange.addEventListener('input', () => {
    fontSizeValue.textContent = fontSizeRange.value + '%';
    localStorage.setItem('kinshoEpubFontSize', fontSizeRange.value);
    if (lastHtml) renderChapterContent(lastHtml, lastCss, { land: 'clamp' });
  });

  bbSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle('open');
  });
  settingsPanel.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => settingsPanel.classList.remove('open'));

  // ── RESIZE (page box's rendered pixel size can change responsively even
  // though its aspect ratio doesn't -- rebuild pagination for the new size) ──
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (lastHtml) renderChapterContent(lastHtml, lastCss, { land: 'clamp' });
    }, 250);
  });

  // ── INIT ──
  (async () => {
    const [mangaData, volumesData] = await Promise.all([
      apiFetch(`/api/manga/${libraryId}/${mangaId}`),
      apiFetch(`/api/manga/${libraryId}/${mangaId}/volumes`),
    ]);
    topbarTitle.textContent = mangaData.name || 'KINSHO';
    volumesList = volumesData.volumes || [];
    buildVolumeMenu();
    await loadSpineChapter(Math.max(0, startIndex), { land: 'start', saveProgress: false });
  })();
</script>
</body>
</html>
