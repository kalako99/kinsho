<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/static/api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ theme_css | safe }}
  <title>Reader — KINSHO</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: color-mix(in srgb, var(--color-secondary, #1a1a1a) 70%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .topbar.visible { opacity: 1; pointer-events: all; }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }

    .topbar-title {
      flex: 1;
      font-family: 'Segoe UI', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── KINSHO BLE SCROLLER (Android app only) ── */
    .topbar-iconbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      transition: background 0.2s;
    }
    .topbar-iconbtn:hover { background: rgba(255,255,255,0.1); }

    .scroller-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      border: 1.5px solid rgba(0,0,0,0.4);
    }
    .scroller-dot.scanning  { background: #e0a030; }
    .scroller-dot.connected { background: #4caf50; }
    .scroller-dot.error     { background: #e94560; }

    .scroller-panel {
      position: fixed;
      top: 64px;
      right: 20px;
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
    }
    .scroller-panel.open { display: flex; }
    .scroller-panel-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 0.03em;
      padding: 0 4px;
    }
    .scroller-status {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      color: #999;
      padding: 0 4px;
    }
    .scroller-status.scanning  { color: #e0a030; }
    .scroller-status.connected { color: #4caf50; }
    .scroller-status.error     { color: #e94560; }

    /*
     * ── READER (CONVEYOR BELT) ──
     * Native scroll on a bounded window of materialized pages.
     * #reader scrolls normally; page slots are real flowed elements with
     * heights from dims.json. The window of materialized slots is frozen
     * during scroll and recentered (via DOM swap + scrollTop correction)
     * only when scrolling stops.
     */
    #reader {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: #000;
      /* Without this, the browser's own default scroll-anchoring can apply
         a second, independent scrollTop correction on top of the conveyor's
         manual one whenever slots are added/removed above the fold --
         two uncoordinated corrections for the same DOM mutation is what
         produced the "position resets to top of image" / progress-bar
         flash bugs during ordinary mouse-wheel scrolling. */
      overflow-anchor: none;
    }
    #reader::-webkit-scrollbar { display: none; }

    #reader-inner {
      /* Zoom (applyStripWidth) resizes THIS element, not #reader -- #reader
         itself stays permanently full-bleed so the black letterbox area at
         zoomed-out widths is still part of #reader's own scrollable/
         draggable bounds, not empty space outside it (the bug 6 fix). */
      width: 100%;
      margin: 0 auto;
    }

    .reader-spacer {
      width: 100%;
      /* height set in JS by _syncSpacers(); flanks the materialized slot
         pool so #reader's real scrollHeight always equals the true
         full-manifest height (cursorY), never just the materialized
         window's own content height. */
    }

    .page-slot {
      width: 100%;
      background: #000;
      /* height set per-entry in JS from dims.json; normal block flow */
      /* 1px LESS than the logical gap -- see PAGE_OVERLAP_PX in the script
         below for why this deliberate overlap exists and how the geometry
         math (_syncSpacers) compensates for it. */
      margin-bottom: calc(var(--page-gap, 0px) - 1px);
      /* Isolates this slot's own layout/paint from its siblings -- without
         this, inserting/removing a DIFFERENT slot (every conveyor shift,
         which fires repeatedly during any sustained scroll) can force the
         browser to reflow/repaint this one too, even though nothing about
         it actually changed. For a frame or two the browser can show this
         element's own background underneath before recompositing the
         already-loaded image back on top -- a real black flash confirmed
         live (2026-08-08) over an already-correctly-loaded page, whose
         size scaled with scroll speed (more shifts per second = more
         churn = more visible flicker), not a loading-latency gap.
         `contain` alone gives layout/paint containment but doesn't
         guarantee this element gets promoted to its own independent
         compositor layer -- confirmed live (2026-08-09) that contain
         alone did NOT fully fix a related black-flash report. will-change
         is the stronger, more direct lever: it forces GPU layer promotion,
         so a sibling's DOM churn -- or this slot's own region simply not
         having been rasterized recently after sitting off-screen -- can't
         force a synchronous repaint of this slot into the shared page
         surface the instant it scrolls back into view. NOT applied here
         unconditionally -- see .page-slot-near below (2026-08-10/11). */
      contain: layout paint;
    }

    /* Scoped subset of .page-slot's own materialized window (up to
       SLOT_COUNT=80 wide) that's within TIER1_RADIUS of the CURRENT
       reading position right now -- kept in sync continuously via
       updateNearSlots(), not just at window shift/rebuild boundaries,
       since the black-flash report this targets happens on ordinary small
       flicks during real reading, not big fast scrolls (those move
       position by roughly a page at most, never far enough to even
       approach the conveyor window's own edges). will-change here, not on
       plain .page-slot, deliberately: promoting all 80 materialized slots
       to their own GPU compositor layer at once has a real memory cost on
       mobile, so this is scoped to only the handful of slots actually
       near where the user is reading (2026-08-11). */
    .page-slot-near {
      will-change: transform;
    }

    .page-slot img {
      display: block;
      width: 100%;
      height: 100%;
      /* object-fit: fill keeps the image at exactly the precomputed ratio */
      object-fit: fill;
      /* <img> is natively draggable by default -- nothing here previously
         stopped the browser's own long-press-and-drag-image gesture
         (the same one used to drag an image into another app), which a
         scroll gesture that starts or lingers on an image can be
         misread as. That native drag path pulls the image into a
         separate drag-preview compositing flow, a plausible source of
         exactly the kind of transient boundary artifact seen during
         scroll (2026-08-08). -webkit-user-drag disables it directly;
         user-select stops a long-press from starting a text/image
         selection instead, the same class of native gesture hijack. */
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ── PROGRESS BAR ── */
    .frag-progress {
      position: fixed;
      top: 0;
      height: 100vh;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      width: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, width 0.2s ease;
      box-sizing: border-box;
      background: rgba(0,0,0,0.45);
      border-radius: 3px;
    }
    .frag-progress.left  { left: 0; }
    .frag-progress.right { right: 0; }
    .frag-progress.visible {
      opacity: 1;
      pointer-events: all;
    }
    .frag-progress.visible:hover {
      width: 18px;
      opacity: 1 !important;
    }

    .frag-seg {
      width: 100%;
      border-radius: 2px;
      background: rgba(255,255,255,0.35);
      transition: background 0.2s;
      flex-shrink: 0;
      flex-grow: 1;
      cursor: pointer;
      position: relative;
    }
    .frag-seg.active {
      background: var(--theme-primary, #e94560);
    }
    .frag-seg:hover {
      background: var(--theme-primary, #e94560);
      filter: brightness(1.3);
    }

    .frag-tooltip {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9px;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 200;
    }
    .frag-tooltip.pinned {
      opacity: 1;
    }

    /* ── BOTTOM BAR ── */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      width: 100%;
    }
    .bottombar.visible { opacity: 1; pointer-events: all; }
    /* ── BOTTOM CONTAINER (slider + bar grouped) ── */
    #bottom-container {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100vw - 48px);
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }

    /* row helper — always defined */
    .bb-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .bb-row-nav     { justify-content: center; }
    .bb-row-actions { justify-content: center; }

    /* ── BOTTOM BAR: 2-ROW LAYOUT ON MOBILE ── */
    @media (max-width: 540px) {
      #bottom-container {
        bottom: 12px;
      }
      .bottombar {
        flex-direction: column;
        gap: 6px;
        padding: 10px 14px;
        align-items: stretch;
      }
      .bb-divider    { display: none; }
      .bb-chap-btn   { max-width: 150px; }
      .bb-zoom-range { width: 100px; }

      .settings-panel {
        bottom: 115px;
      }
    }

    /* prev / next chapter buttons */
    .bb-chapbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .bb-chapbtn:hover { background: rgba(255,255,255,0.1); }
    .bb-chapbtn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* chapter dropdown */
    .bb-chap-dropdown {
      position: relative;
    }
    .bb-chap-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 5px 10px;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .bb-chap-btn:hover,
    .bb-chap-btn.open { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); }
    .bb-chap-btn svg { flex-shrink: 0; opacity: 0.6; }

    .bb-chap-menu {
      position: absolute;
      bottom: calc(100% + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      min-width: 260px;
      max-width: 340px;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
      z-index: 300;
      padding: 4px 0;
      display: none;
    }
    .bb-chap-menu.open { display: block; }

    .bb-chap-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      gap: 10px;
    }
    .bb-chap-menu-item:hover { background: rgba(255,255,255,0.07); }
    .bb-chap-menu-item.active {
      color: var(--theme-primary, #e94560);
      background: rgba(255,255,255,0.04);
    }
    .bb-chap-menu-item .bb-chap-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bb-chap-menu-item .bb-chap-num {
      font-size: 0.68rem;
      color: #555;
      flex-shrink: 0;
    }
    .bb-chap-menu-item.active .bb-chap-num { color: var(--theme-primary, #e94560); opacity: 0.7; }

    /* divider between chapter nav and action controls */
    .bb-divider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    /* icon buttons (stretch, settings) */
    .bb-iconbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      color: #aaa;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .bb-iconbtn:hover { background: rgba(255,255,255,0.1); color: #f0f0f0; }

    /* zoom / range slider */
    .bb-zoom {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .bb-zoom-range {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      cursor: pointer;
    }
    .bb-zoom-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      cursor: pointer;
    }
    .bb-zoom-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      border: none;
      cursor: pointer;
    }
    .bb-zoom-value {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #888;
      min-width: 36px;
      text-align: right;
    }

    /* active state for stretch / iconbtn toggles */
    .bb-iconbtn.active {
      color: var(--theme-primary, #e94560);
    }

    /* ── SETTINGS PANEL ── */
    .settings-panel {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px 18px;
      min-width: 260px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .settings-panel.open { display: flex; }

    .settings-section-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 4px;
    }

    /* reading mode selector */
    .settings-mode-btns {
      display: flex;
      gap: 8px;
    }
    .settings-mode-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 8px 10px;
      color: #aaa;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .settings-mode-btn:hover { background: rgba(255,255,255,0.09); }
    .settings-mode-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--theme-primary, #e94560);
      color: #f0f0f0;
    }
    .settings-mode-btn svg { opacity: 0.7; }
    .settings-mode-btn.active svg { opacity: 1; }

    /* toggle row (padding switch) */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .settings-row-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      color: #ccc;
    }
    .settings-toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .settings-toggle input { opacity: 0; width: 0; height: 0; }
    .settings-toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .settings-toggle-slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f0f0f0;
      transition: transform 0.2s;
    }
    .settings-toggle input:checked + .settings-toggle-slider {
      background: var(--theme-primary, #e94560);
    }
    .settings-toggle input:checked + .settings-toggle-slider::before {
      transform: translateX(16px);
    }

    /* direction buttons for single page */
    .settings-dir-btns {
      display: flex;
      gap: 8px;
    }
    .settings-dir-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 7px 10px;
      color: #aaa;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .settings-dir-btn:hover { background: rgba(255,255,255,0.09); }
    .settings-dir-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--theme-primary, #e94560);
      color: #f0f0f0;
    }

    /* ── SINGLE PAGE MODE ── */
    #singlePageView {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1;
      overflow: hidden;
    }
    #singlePageView.active { display: block; }

    /*
     * #spStrip is single-page mode's own horizontal conveyor -- same
     * pattern as #reader's vertical one (spacer-flanked sliding window of
     * materialized slots, native scroll drives all physics), deliberately
     * a separate/parallel implementation rather than a generalized version
     * of #reader's, so a change here can't regress long-strip mode's own
     * already-hardened scroll code. scroll-snap-stop:always is what
     * actually delivers "one flick = one page" -- scroll-snap-type alone
     * lets a fast flick sail past multiple snap points. overflow-anchor
     * carries over from #reader for the same reason it's needed there:
     * without it, native scroll-anchoring can apply its own extra
     * correction on top of the spacer-based one whenever slots are
     * added/removed, fighting the deliberately-no-manual-scrollTop-writes
     * design of _spShiftWindow.
     */
    #spStrip {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      overflow-anchor: none;
      scrollbar-width: none;
    }
    #spStrip::-webkit-scrollbar { display: none; }

    .sp-spacer { flex: 0 0 auto; height: 100%; /* width set in JS */ }

    .sp-slot {
      flex: 0 0 auto;
      width: var(--sp-slot-w);
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      /* Gap between "pages" is inner padding, not space between slot boxes
         -- keeps every slot (materialized or virtual/spacer) exactly
         viewport-width, so slot r's x-offset is just r * slot width with
         no fencepost adjustment for gaps. */
      padding: 0 calc(var(--sp-gap) / 2);
      background: #000;
    }
    .sp-slot img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ── BOOKMARK PANEL ── */
    .bookmark-panel {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 200px;
    }
    .bookmark-panel.open { display: flex; }

    .bm-panel-btn {
      background: none;
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      color: #ccc;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .bm-panel-btn:hover { background: rgba(255,255,255,0.08); color: #f0f0f0; }

    /* ── BOOKMARK MODAL ── */
    .bm-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bm-modal {
      background: rgba(18,18,18,0.98);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      min-width: 320px;
      max-width: 480px;
      width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bm-modal-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 0.04em;
    }
    .bm-modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .bm-modal-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 9px 12px;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .bm-modal-input:focus { border-color: var(--theme-primary, #e94560); }
    .bm-modal-hint {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: #666;
    }
    .bm-modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .bm-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .bm-btn-primary {
      background: var(--theme-primary, #e94560);
      color: #fff;
    }
    .bm-btn-primary:hover { filter: brightness(1.15); }
    .bm-btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #ccc;
    }
    .bm-btn-secondary:hover { background: rgba(255,255,255,0.14); color: #f0f0f0; }
    .bm-btn-danger {
      background: rgba(220,50,50,0.15);
      color: #e06060;
    }
    .bm-btn-danger:hover { background: rgba(220,50,50,0.28); }

    /* Bookmark list rows */
    .bm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .bm-row:hover { background: rgba(255,255,255,0.09); }
    .bm-row-info { flex: 1; min-width: 0; }
    .bm-row-name {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.83rem;
      font-weight: 600;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bm-row-detail {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      color: #666;
      margin-top: 2px;
    }
    .bm-row-tag {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .bm-tag-closed {
      background: rgba(74,222,128,0.15);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.25);
    }
    .bm-tag-open {
      background: rgba(255,255,255,0.06);
      color: #888;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .bm-row-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .bm-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #777;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .bm-icon-btn:hover { background: rgba(255,255,255,0.1); color: #f0f0f0; }
    .bm-icon-btn.danger:hover { background: rgba(220,50,50,0.2); color: #e06060; }

    /* end-to-end toggle row */
    .bm-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 4px;
    }
    .bm-toggle-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      color: #aaa;
    }

    /* message toast */
    .bm-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: rgba(18,18,18,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      color: #f0f0f0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .bm-toast.show { opacity: 1; }

    /* ── LAST PAGE POPUP ── */
    .last-page-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 600;
      background: rgba(18,18,18,0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px 28px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: #f0f0f0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    .last-page-popup.show { opacity: 1; }

    /* ── READING-MODE CURSOR HIDING ──
       While the UI chrome is hidden, the whole screen hides the mouse
       cursor — pure CSS on the body, no overlay elements. (The previous
       .sidebar-zone overlays needed pointer-events:all for cursor:none to
       apply, which also made them swallow wheel events — scrolling was
       dead inside them.) Left-clicking anywhere shows the UI again via
       the existing document click handler, which drops this class and
       restores the cursor. */
    body.cursor-hidden, body.cursor-hidden * { cursor: none !important; }

    /* ── PRELOAD RADIUS SLIDER ── */
    .settings-preload {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .settings-preload-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      color: #ccc;
      white-space: nowrap;
    }
    .settings-preload-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-preload-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      cursor: pointer;
    }
    .settings-preload-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      cursor: pointer;
    }
    .settings-preload-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      border: none;
      cursor: pointer;
    }
    .settings-preload-value {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #888;
      min-width: 42px;
      text-align: right;
    }

    /* ── PAGE SLIDER + THUMB STRIP ── */
    .page-slider-wrap {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 6px 12px;
      width: 100%;
    }
    .page-slider-wrap.visible {
      opacity: 1;
      pointer-events: all;
    }
    /* Thumb strip */
    .thumb-strip {
      display: none;
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 174px; /* 150px thumb + 4px gap + label + 8px padding */
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    .thumb-strip.active { display: block; }
    .thumb-strip:active  { cursor: grabbing; }

    /* inner track that slides */
    .thumb-track {
      position: absolute;
      top: 8px;
      left: 0;
      height: 162px;
      will-change: transform;
    }
    .thumb-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
      width: 100px;
    }
    .thumb-cell-img-wrap {
      width: 100px;
      height: 150px;
      background: rgba(0,0,0,0.55);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-cell-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .thumb-cell-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.62rem;
      color: #aaa;
      text-align: center;
    }
    /* Slider row */
    .page-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .page-slider-input {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.45);
      outline: none;
      cursor: pointer;
    }
    .page-slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--theme-primary, #e94560);
      box-shadow: 0 0 0 2px #000, 0 0 6px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .page-slider-input::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--theme-primary, #e94560);
      box-shadow: 0 0 0 2px #000, 0 0 6px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .page-slider-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #888;
      min-width: 56px;
      text-align: right;
      white-space: nowrap;
    }

    /* ── PDF QUALITY SLIDER ── */
    .settings-pdf-quality {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-pdf-quality-track {
      position: relative;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      margin: 8px 10px 0;
    }
    .settings-pdf-quality-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 2px;
      background: var(--theme-primary, #e94560);
      transition: width 0.15s;
    }
    .settings-pdf-quality-input {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: transparent;
      outline: none;
      cursor: pointer;
      margin: 0;
    }
    .settings-pdf-quality-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--theme-primary, #e94560);
      box-shadow: 0 0 0 2px #000, 0 0 6px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .settings-pdf-quality-input::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--theme-primary, #e94560);
      box-shadow: 0 0 0 2px #000, 0 0 6px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .settings-pdf-quality-labels {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }
    .settings-pdf-quality-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #666;
      cursor: pointer;
      transition: color 0.15s;
      user-select: none;
    }
    .settings-pdf-quality-label.active {
      color: var(--theme-primary, #e94560);
      font-weight: 700;
    }

  </style>
</head>

    Add Bookmark
  </button>
  <button class="bm-panel-btn" id="bmCloseBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:8px"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg>

  <button class="bm-panel-btn" id="bmListBtn">

<!-- Bookmark modal (shared overlay) -->

  <div class="bm-modal" id="bmModal">
    <div class="bm-modal-title" id="bmModalTitle">Bookmarks</div>
    <div class="bm-modal-body" id="bmModalBody"></div>
    <div class="bm-modal-actions" id="bmModalActions"></div>
  </div>
</div>

<!-- Bookmark toast -->
<div class="bm-toast" id="bmToast"></div>

<div class="last-page-popup" id="lastPagePopup">This is the last page</div>

<!-- Single page view -->
<div id="singlePageView">
  <div id="spStrip"></div>
</div>

<script>
window.__IS_ONESHOT__ = {{ is_oneshot | default(false) | tojson }};
(async () => {

  // Replace the current history entry so chapter-to-chapter navigation
  // doesn't stack: pressing back always returns to the manga detail page.
  history.replaceState(null, '', window.location.href);

  // The manga list page remembers its scroll position AND its fully
  // rendered content (see static/app.js's MANGA_LIST_SCROLL_KEY and
  // kinsho_tab_cache_* / tabCacheStorageKey) across a normal "click into a
  // manga, hit back" round trip -- but only until a chapter is actually
  // opened. Once real reading has started, a snapshot from before isn't
  // meaningful to instantly resume into anymore, even after navigating
  // all the way back through browser history later. Same literal key
  // strings as app.js -- this is a separate page load/script context,
  // nothing to import from. Walks all of sessionStorage rather than one
  // fixed key since the tab cache is one entry per library, and the
  // manga being read could belong to any of them.
  try {
    sessionStorage.removeItem('kinsho_manga_list_scroll');
    for (let i = sessionStorage.length - 1; i >= 0; i--) {
      const k = sessionStorage.key(i);
      if (k && k.startsWith('kinsho_tab_cache_')) sessionStorage.removeItem(k);
    }
  } catch (e) {}

  // ── URL PARAMS ──
  const parts     = window.location.pathname.split('/');
  const libraryId = parts[2];
  const mangaId   = parts[3];
  const isVolume  = parts[4] === 'volume';
  const chapterId = parts[5];
  const startPage = parseInt(new URLSearchParams(window.location.search).get('page') || '0', 10);

  const reader      = document.getElementById('reader');
  // Content lives in here, not directly in #reader -- #reader itself is the
  // one scroll-mechanics element (scrollTop/scrollHeight/clientHeight, all
  // scroll/scrollend/touch listeners) and stays permanently full-bleed;
  // readerInner is what applyStripWidth's zoom resizes (see bug 6 fix).
  const readerInner = document.getElementById('reader-inner');
  const topbar  = document.getElementById('topbar');
  const titleEl = document.getElementById('topbarTitle');
  const backBtn = document.getElementById('backBtn');

  // ── CONVEYOR BELT CONFIG ──
  // Number of manga pages materialized as real DOM slots at any time.
  // This is the buffer the user can natively scroll within before a
  // recenter is needed — keep generous so a single flick can't outrun it.
  const SLOT_COUNT = 80;

  // ── FULLSCREEN ──
  function enterFullscreen() {
    const el = document.documentElement;
    if      (el.requestFullscreen)       el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
  }
  function exitFullscreen() {
    if      (document.exitFullscreen)       document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
  }

  // ── TOP BAR ──
  let barTimer = null;
  function showBar() { showAll(); } // kept for compat

  // Any popup that can be sitting open independently of the topbar/bottombar
  // themselves -- if one of these is open when the auto-hide timer would
  // otherwise fire, hiding the cursor along with everything else leaves the
  // user unable to see their own pointer while still looking at an open
  // bookmark panel/modal, settings panel, or scroller panel (2026-08-11).
  function isAnyPopupOpen() {
    const sp  = document.getElementById('settingsPanel');
    const scp = document.getElementById('scrollerPanel');
    const bp  = document.getElementById('bookmarkPanel');
    const bmo = document.getElementById('bmModalOverlay');
    return (sp  && sp.classList.contains('open')) ||
           (scp && scp.classList.contains('open')) ||
           (bp  && bp.classList.contains('open')) ||
           (bmo && bmo.style.display === 'flex');
  }

  function hideAll() {
    // Don't hide anything (bars, cursor) while a popup is still open --
    // keep re-checking on the same cadence instead, so it hides normally
    // the moment the popup actually closes without needing a fresh
    // interaction to re-arm the timer.
    if (isAnyPopupOpen()) { scheduleAutoHide(); return; }
    topbar.classList.remove('visible');
    fragProgress.classList.remove('visible');
    document.getElementById('bottombar').classList.remove('visible');
    leftTooltip.classList.remove('pinned');
    leftHoveredIdx = null;
    barVisible = false;
    const sp = document.getElementById('settingsPanel');
    if (sp) {
      sp.classList.remove('open');
      const btn = document.getElementById('bbSettingsBtn');
      if (btn) btn.classList.remove('active');
    }
    if (typeof syncSliderVisibility === 'function') syncSliderVisibility();
    document.body.classList.add('cursor-hidden');
  }

  // Schedules (or reschedules) the 3s auto-hide -- shared by showAll() and
  // by any later interaction with the reader's own UI chrome (see
  // isInReaderChrome below), so opening Settings/Bookmarks etc. keeps
  // pushing the deadline out instead of the original showAll() timer
  // silently ticking down in the background regardless of what the user
  // does next (2026-08-11).
  function scheduleAutoHide() {
    clearTimeout(barTimer);
    barTimer = setTimeout(() => {
      if (stripVisible) return; // don't hide while thumb strip is active
      if (topbar.matches(':hover') || fragProgress.matches(':hover') || document.getElementById('bottombar').matches(':hover')) return;
      hideAll();
    }, 3000);
  }

  // Every overlay/popup that lives on top of the reader (not #reader's own
  // scrollable content) -- interacting with any of these should never
  // count as "tap the page to hide the bars", and should keep the bars on
  // screen rather than letting a stale timer yank them away mid-interaction.
  function isInReaderChrome(target) {
    return topbar.contains(target) ||
      fragProgress.contains(target) ||
      document.getElementById('bottombar').contains(target) ||
      document.getElementById('settingsPanel').contains(target) ||
      document.getElementById('scrollerPanel').contains(target) ||
      document.getElementById('bookmarkPanel').contains(target) ||
      document.getElementById('bmModalOverlay').contains(target);
  }

  function showAll() {
    topbar.classList.add('visible');
    fragProgress.classList.add('visible');
    document.getElementById('bottombar').classList.add('visible');
    barVisible = true;
    document.body.classList.remove('cursor-hidden');
    if (typeof syncSliderVisibility === 'function') syncSliderVisibility();
    scheduleAutoHide();
    // updateProgressBar() was skipped while barVisible was false (see its
    // own comment) — barVisible is now true above, so this call rebuilds
    // whatever went stale (frag segments, chapter label, page slider) and
    // internally calls updatePinnedTooltips() itself once it's done.
    if (typeof updateProgressBar === 'function') updateProgressBar();
  }

  let barVisible     = false;
  let leftHoveredIdx = null;
  let pendingShowTimer = null;

  // Capture phase so this fires even for a popup's own click handler that
  // calls stopPropagation() in the bubble phase (settingsPanel/scrollerPanel/
  // bookmarkPanel all do, further down) -- a bubble-phase-only listener would
  // never see those clicks at all once stopped. Resets (not just clears) the
  // auto-hide timer on every interaction with the reader's own chrome, so
  // choosing a setting or working with a bookmark never gets cut short by a
  // deadline that started counting down before the user even opened the
  // panel (2026-08-11).
  document.addEventListener('click', e => {
    if (!barVisible) return;
    if (isInReaderChrome(e.target)) scheduleAutoHide();
  }, { capture: true });

  document.addEventListener('click', e => {
    if (touchMoved) { touchMoved = false; return; } // was a drag, not a tap
    if (isInReaderChrome(e.target)) return;
    if (barVisible) {
      clearTimeout(barTimer);
      hideAll();
    } else {
      // A fast, short flick can stay under TOUCH_TAP_THRESHOLD in net
      // displacement (so touchMoved never flips true) yet still hand off
      // real momentum scrolling to the browser once released -- that read
      // as a tap here and flashed the bars mid-scroll. Wait briefly and
      // bail if #reader actually starts scrolling before committing to
      // showing them.
      clearTimeout(pendingShowTimer);
      let scrolledDuringGrace = false;
      const onGraceScroll = () => { scrolledDuringGrace = true; };
      reader.addEventListener('scroll', onGraceScroll, { passive: true });
      pendingShowTimer = setTimeout(() => {
        reader.removeEventListener('scroll', onGraceScroll);
        if (!scrolledDuringGrace) showAll();
      }, 200);
    }
  });

  backBtn.addEventListener('click', () => {
    exitFullscreen();
    // A oneshot has no manga_detail/volume_detail page of its own -- that
    // URL just redirects straight back into this exact chapter (see
    // manga_detail()), which read as "back reloads the oneshot" instead of
    // actually going anywhere. Go straight to the manga list instead --
    // only matters as kinshoGoBack's fallback now (real history usually
    // takes over instead, landing wherever the oneshot was actually opened
    // from, since the redirect above never created its own back-stack entry).
    window.kinshoGoBack(window.__IS_ONESHOT__ ? '/' : `/manga/${libraryId}/${mangaId}`);
  });

  // ── FETCH HELPERS ──
  async function apiFetch(path) {
    const r = await fetch(path);
    return r.json();
  }

  // Navigate to a chapter by replacing history so back always returns to the manga detail page.
  function goToChapter(url) {
    window.location.replace(url);
  }

  // ── BOOT: fetch everything needed for geometry in one round-trip burst ──
  enterFullscreen();

  const [manga, dims, chapterList, adminData] = await Promise.all([
    apiFetch(`/api/manga/${libraryId}/${mangaId}`),
    apiFetch(`/api/manga/${libraryId}/${mangaId}/dims`),
    apiFetch(`/api/manga/${libraryId}/${mangaId}/${isVolume ? 'volumes' : 'chapters'}`).then(d => isVolume ? (d.volumes || []) : (d.chapters || [])),
    apiFetch(`/api/admin/status`),
  ]);

  titleEl.textContent = manga.name || manga.title || 'Manga';

  // ── READING SESSION TRACKING ──
  const _readingMangaName = manga.name || manga.title || 'Unknown';
  fetch(apiUrl('/api/reading/session/start'), {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ manga_name: _readingMangaName, library_id: String(libraryId) }),
  }).catch(() => {});

  // A tick only counts toward reading time if there was real activity
  // (scroll/tap/key) at some point in that minute -- previously this fired
  // on a blind 60s timer regardless of whether anyone was actually reading,
  // so a locked screen or an abandoned-but-still-open tab kept accumulating
  // "reading time" for as long as the JS timer itself survived. Listeners
  // are on `document` in the CAPTURE phase specifically so an inner
  // handler's stopPropagation() (several exist in this reader, e.g. the
  // bottombar menus) can't hide activity from this before it's recorded.
  let _lastActivityTs = Date.now();
  const _markActivity = () => { _lastActivityTs = Date.now(); };
  ['scroll', 'touchstart', 'touchmove', 'mousedown', 'keydown', 'wheel'].forEach(evt =>
    document.addEventListener(evt, _markActivity, { passive: true, capture: true })
  );
  const ACTIVITY_TIMEOUT_MS = 90000; // a bit over the 60s tick interval, so a slow
  // read of one dense page (no scrolling needed for a while) doesn't itself
  // look idle -- only a genuine pause (locked screen, walked away) does.

  let _tickSent = false;
  const _tickInterval = setInterval(() => {
    if (Date.now() - _lastActivityTs > ACTIVITY_TIMEOUT_MS) return; // paused -- don't count this minute
    fetch(apiUrl('/api/reading/session/tick'), { method: 'POST' }).catch(() => {});
  }, 60000);

  // keepalive fetch, not sendBeacon -- sendBeacon can't carry the apiUrl()
  // server base (this call was a bare relative path before, which only
  // ever worked in browser-served mode; on the native app, whose WebView
  // runs on its own separate local origin, it silently went nowhere) and
  // can't carry whatever auth the native app relies on either. keepalive
  // fetch behaves like a normal authenticated request but is guaranteed to
  // survive the page unloading -- same fix already used for
  // saveReadingProgress()'s own true-last-chapter completion save.
  function _sendFinalTick() {
    if (_tickSent) return;
    _tickSent = true;
    clearInterval(_tickInterval);
    if (Date.now() - _lastActivityTs > ACTIVITY_TIMEOUT_MS) return; // already idle when leaving -- nothing to credit
    fetch(apiUrl('/api/reading/session/tick'), { method: 'POST', keepalive: true }).catch(() => {});
  }
  // A courtesy tick for merely being BACKGROUNDED (screen lock, switching
  // apps briefly), as opposed to _sendFinalTick's "actually leaving for
  // good" -- deliberately does NOT clear _tickInterval or set _tickSent.
  // visibilitychange -> 'hidden' also fires on a plain screen lock, not
  // just on really leaving; wiring it to _sendFinalTick (as this used to)
  // permanently killed the 60s tick loop the FIRST time the screen was
  // ever locked during a reading session, silently freezing both the
  // manga's and the overall reading-time totals for the rest of that page
  // load even though the user came right back and kept reading for many
  // more minutes -- confirmed live (2026-08-11): 13+ minutes of real
  // reading, including crossing two chapters, credited zero additional
  // minutes after the first lock. Still worth sending a real tick here
  // (not just skipping it) -- on mobile, backgrounding can end in the OS
  // killing the process outright with no clean beforeunload ever firing,
  // which would otherwise lose up to a minute of genuine reading credited
  // to nothing.
  function _sendHiddenTick() {
    if (Date.now() - _lastActivityTs > ACTIVITY_TIMEOUT_MS) return; // already idle -- nothing to credit
    fetch(apiUrl('/api/reading/session/tick'), { method: 'POST', keepalive: true }).catch(() => {});
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') _sendHiddenTick();
  });
  window.addEventListener('beforeunload', _sendFinalTick);

  // ── BUILD MANIFEST ──
  // manifest[i] = {
  //   chapterId, localIdx,   — identity
  //   globalY, scaledH,      — geometry (pixels, at current viewport width)
  //   url: null,             — populated lazily when chapter URLs are fetched
  //   el: null,              — <img> element reference
  // }
  //
  // chapterStart[chapterId] = first manifest index for that chapter
  //
  // All geometry is derived from dims.json which the server already has —
  // zero extra network requests needed to position anything.

  const viewW        = window.innerWidth;
  const manifest     = [];
  const chapterStart = {};
  let   cursorY      = 0;

  // Gap in px between pages when padding is enabled (applied during rebuild)
  const PAGE_GAP = 16;

  // Deliberate 1px overlap between adjacent .page-slot elements (2026-08-12),
  // real, confirmed on real devices/videos: a thin horizontal line, showing
  // the slot's own black background, intermittently appears exactly at the
  // boundary between two adjacent images during scroll -- worse right at a
  // seam between two pieces of a single source image that was manually
  // sliced into multiple files (tall webtoon pages split by an external
  // tool), confirmed by a full slot-pool rebuild (toggling the padding
  // setting) reliably making it disappear. Root cause: .page-slot has
  // `contain: layout paint` (and nearby slots also get `will-change:
  // transform`), which promotes each slot to its own independently
  // GPU-rasterized layer -- two adjacent layers only look seamless if their
  // shared edge lands on the same physical device pixel, and the reader's
  // scrollTop is essentially never a whole multiple of the device pixel
  // grid, so each layer's independent rasterizer can round that shared edge
  // in different directions depending on the exact scroll position, leaving
  // a real (if tiny) unpainted gap that exposes the black background behind
  // it. This is a well-known class of browser rendering bug for adjacent
  // independently-composited elements; the standard fix -- used here -- is
  // a small deliberate overlap so a rounding gap has real image content
  // behind it instead of bare background, regardless of which way the
  // rounding goes. Applied via CSS (.page-slot's margin-bottom, see its own
  // comment) rather than by shrinking each slot's own height, so contain:
  // paint (which would otherwise clip an overflowing child) never comes
  // into play -- the NEXT slot's own box simply starts 1px earlier and
  // paints its own real content there, covering whatever the previous
  // slot's own rasterizer did or didn't manage to paint in that shared row.
  // _syncSpacers() compensates bottomSpacer's height by this same amount
  // per boundary in the current materialized window, so the reader's real
  // scrollable height stays correct -- globalY/cursorY themselves are left
  // completely untouched (still assume zero/PAGE_GAP spacing exactly as
  // before), since the overlap is a purely visual, bounded-and-self-
  // resetting adjustment (at most SLOT_COUNT-1 px of slack within whatever
  // window is currently materialized, corrected fresh on every rebuild/
  // shift) that has no business leaking into the precise logical scroll
  // position bookmarks/progress/chapter-completion all rely on.
  const PAGE_OVERLAP_PX = 1;

  // Drives the actual visible gap between .page-slot elements (see its CSS
  // rule: margin-bottom: var(--page-gap, 0px)). PAGE_GAP alone only ever
  // fed into globalY/cursorY -- the virtual scroll-position math -- with
  // nothing anywhere setting a matching real margin on the rendered slots,
  // so toggling "Padding between images" recomputed geometry/scroll extent
  // but never changed what was actually on screen. Present in the initial
  // commit; not a regression from any later change.
  function applyPageGapVar(usePadding) {
    readerInner.style.setProperty('--page-gap', (usePadding ? PAGE_GAP : 0) + 'px');
  }

  function buildManifest(usePadding, effectiveW) {
    const w = effectiveW ?? viewW;
    manifest.length = 0;
    Object.keys(chapterStart).forEach(k => delete chapterStart[k]);
    cursorY = 0;
    for (const ch of chapterList) {
      const cid    = ch.id;
      const chDims = isVolume ? dims.volumes?.[cid] : dims.chapters?.[cid];
      if (!chDims || !chDims.pages?.length) continue;
      chapterStart[cid] = manifest.length;
      for (let i = 0; i < chDims.pages.length; i++) {
        const { w: iw, h: ih } = chDims.pages[i];
        const scaledH = Math.round((w / iw) * ih);
        manifest.push({
          chapterId: cid,
          localIdx:  i,
          globalY:   cursorY,
          scaledH,
          url:    null,
          el:     null,
          loaded: false,
        });
        cursorY += scaledH + (usePadding ? PAGE_GAP : 0);
      }
    }
  }

  // Update globalY positions and scaledH in the existing manifest entries (preserves el refs and loaded state)
  function recomputeGeometry(usePadding, effectiveW) {
    const w = effectiveW ?? viewW;
    let y = 0;
    Object.keys(chapterStart).forEach(k => delete chapterStart[k]);
    for (let i = 0; i < manifest.length; i++) {
      const entry = manifest[i];
      if (i === 0 || manifest[i - 1].chapterId !== entry.chapterId) {
        chapterStart[entry.chapterId] = i;
      }
      const chDims = isVolume ? dims.volumes?.[entry.chapterId] : dims.chapters?.[entry.chapterId];
      if (chDims?.pages?.[entry.localIdx]) {
        const { w: iw, h: ih } = chDims.pages[entry.localIdx];
        entry.scaledH = Math.round((w / iw) * ih);
      }
      entry.globalY = y;
      y += entry.scaledH + (usePadding ? PAGE_GAP : 0);
    }
    cursorY = y;
  }

  // ── READER SETTINGS (loaded from admin, keyed by library tab) ──
  const readerSettings = Object.assign(
    { mode: 'long-strip', padding: false, direction: 'ltr', stripWidth: 100, pdfScale: 1 },
    (adminData.reader_settings_by_tab || {})[libraryId] || {}
  );

  async function saveReaderSettings() {
    await fetch(apiUrl('/api/settings/reader'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...readerSettings, library_id: libraryId }),
    });
  }

  function applyPreloadRadius(r) {
    readerSettings.preloadRadius = r;
    TIER1_RADIUS = r;
    TIER2_RADIUS = r * 2;
    document.getElementById('settingsPreloadValue').textContent = `±${r}`;
    document.getElementById('settingsPreloadRange').value = r;
  }

  // Build manifest with current padding setting
  buildManifest(readerSettings.padding);
  applyPageGapVar(readerSettings.padding);

  // ── CONVEYOR WINDOW STATE ──
  // slotPool[k] corresponds to manifest[windowLo + k] and is always a DOM
  // child of #reader positioned between topSpacer and bottomSpacer (NOT
  // necessarily the (k+1)-th child overall -- the two spacers are permanent
  // fixtures that never get cleared by a rebuild). The window is
  // materialized/shifted by _rebuildConveyorWindow / _shiftConveyorWindow
  // below.
  const slotPool = [];
  let windowLo = 0;
  let windowHi = -1;

  // Map from manifest index → slot pool index (-1 = not materialized)
  const assignedSlot = new Int32Array(manifest.length).fill(-1);

  // ── FULL-HEIGHT SPACERS ──
  // #reader's native scrollHeight must always equal the TRUE full-manifest
  // height (cursorY), never just the sum of the ~SLOT_COUNT materialized
  // slots -- otherwise a long continuous scroll can hit a genuine native
  // scrollTop ceiling well before the real end of the chapter (the "scroll
  // stops after ~40 pages" bug). topSpacer/bottomSpacer are permanent
  // fixtures flanking the slot pool that make up the difference.
  //
  // COORDINATE REBASING (2026-08-08): cursorY/globalY for a long enough
  // series (confirmed live: a 104-chapter webtoon with tall pages) can
  // reach tens of millions of px -- plain JS numbers handle that fine, but
  // the browser's own scrollable-element height does not. Bisected against
  // the real device: this WebView silently caps a scrollable element's
  // rendered height at ~19.17M px, past which scrollTop can no longer
  // advance at all -- a hard, invisible wall partway through the manifest,
  // confirmed live at chapter 99/104. (The same ever-growing-coordinate
  // territory is also the leading suspect for the still-open "visible
  // seams deep into a long scroll" bug -- rebasing may improve that too,
  // though it hasn't been confirmed as the same root cause.)
  //
  // Fixed by decoupling the TRUE logical position (virtualY/cursorY/
  // globalY -- unbounded, never rebased, everything outside this section
  // keeps using these exactly as before: progress bar, chapter-completion,
  // bookmarks, the page slider) from the PHYSICAL DOM coordinates the
  // browser actually has to lay out (reader.scrollTop, spacer heights).
  // coordOffset is the logical position that maps to physical 0; every
  // physical quantity is (logical value - coordOffset), always kept within
  // SAFE_PHYSICAL_HEIGHT (well under half the measured ceiling). Whenever the
  // current position gets within margin of either edge of that safe window,
  // recenterConveyor rebases coordOffset -- via the cheap _rebaseCoordinates
  // path (just resizes spacers + adjusts scrollTop, no slot teardown) unless
  // the materialized window itself also needs to move far enough to force a
  // full _rebuildConveyorWindow anyway.
  //
  // Two margins, not one (2026-08-09): a rebase writes reader.scrollTop,
  // which competes with the browser's own compositor-driven touch/stylus
  // fling for the same frame if it fires mid-gesture -- a real, if small,
  // source of the accel/decel jank this margin split exists to avoid.
  // COORD_REBASE_MARGIN (a full quarter of the safe window) is used once
  // scrolling has actually settled (scrollend / the settle-poll fallback),
  // where a scrollTop write can't interfere with anything -- generous on
  // purpose, so a rebase happens opportunistically on nearly every natural
  // pause rather than being saved up. COORD_REBASE_EMERGENCY_MARGIN is the
  // real safety floor, checked mid-gesture too: even the fastest realistic
  // sustained scroll (BLE-scroller "hold to scroll" included) needs minutes
  // of perfectly continuous, zero-pause movement to close a 2,000,000px
  // margin, let alone this much smaller one, so in practice this branch
  // should almost never fire -- it exists purely so a pathological
  // long-held scroll still can't reach the real coordinate ceiling (the
  // "wall" bug this whole mechanism was built to fix) just because it
  // never happened to settle.
  const SAFE_PHYSICAL_HEIGHT          = 8_000_000;
  const COORD_REBASE_MARGIN           = SAFE_PHYSICAL_HEIGHT / 4;
  const COORD_REBASE_EMERGENCY_MARGIN = SAFE_PHYSICAL_HEIGHT / 16;
  let coordOffset = 0;

  const topSpacer = document.createElement('div');
  const bottomSpacer = document.createElement('div');
  topSpacer.className = bottomSpacer.className = 'reader-spacer';
  readerInner.appendChild(topSpacer);
  readerInner.appendChild(bottomSpacer);

  function _syncSpacers() {
    if (manifest.length === 0) {
      topSpacer.style.height = '0px';
      bottomSpacer.style.height = '0px';
      return;
    }
    topSpacer.style.height = (manifest[windowLo].globalY - coordOffset) + 'px';
    const windowEndY = manifest[windowHi].globalY + manifest[windowHi].scaledH;
    // Bottom spacer reaches to the nearer of the true end of the manifest
    // or the edge of the current safe coordinate window -- never the full
    // true remaining distance, which is exactly what let this grow past
    // the browser's real limit before.
    const safeWindowEndY = Math.min(cursorY, coordOffset + SAFE_PHYSICAL_HEIGHT);
    // +overlapSlack: the materialized slots between the spacers render
    // PAGE_OVERLAP_PX shorter than windowEndY assumes at every one of their
    // (windowHi - windowLo) shared boundaries (see PAGE_OVERLAP_PX above) --
    // make up the difference here so the reader's real scrollable height
    // still matches the logical model exactly, without needing to touch
    // globalY/cursorY themselves at all.
    const overlapSlack = (windowHi - windowLo) * PAGE_OVERLAP_PX;
    bottomSpacer.style.height = Math.max(0, safeWindowEndY - windowEndY + overlapSlack) + 'px';
  }

  // ── VIRTUAL SCROLL STATE ──
  // virtualY is the only source of truth for TRUE logical scroll position
  // (unbounded -- see coordOffset above for how this maps to the browser's
  // own physical reader.scrollTop). No window.scrollY, no window.scrollTo,
  // no browser scroll events.
  let virtualY = 0;
  const viewH  = window.innerHeight;

  // ── URL CACHE ──
  // Fetch chapter page URL lists on demand; cache the Promise so concurrent
  // calls for the same chapter share one network request.
  const urlCache = {}; // chapterId -> Promise<string[]>

  function sourceIsPdf() {
    const firstCh = chapterList[0];
    if (!firstCh) return false;
    const chDims = isVolume ? dims.volumes?.[firstCh.id] : dims.chapters?.[firstCh.id];
    return chDims?.source === 'pdf';
  }
  const isPdf = sourceIsPdf();

  const PDF_SCALES = [1.0, 1.5, 2.0];
  function pdfScaleParam() {
    return `?scale=${PDF_SCALES[readerSettings.pdfScale ?? 1]}`;
  }

  function ensureChapterUrls(cid) {
    if (urlCache[cid]) return urlCache[cid];

    const chDims = isVolume ? dims.volumes?.[cid] : dims.chapters?.[cid];
    const source = chDims?.source;
    const base   = `/api/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${cid}/page`;

    // Archive / PDF / EPUB: URLs are sequential integers, build without network fetch.
    if (source === 'archive' || source === 'pdf' || source === 'epub') {
      const count  = chDims.page_count ?? chDims.pages?.length;
      if (count != null) {
        const suffix = source === 'pdf' ? pdfScaleParam() : '';
        const urls   = Array.from({ length: count }, (_, i) => `${base}/${i}${suffix}`);
        urlCache[cid] = Promise.resolve(urls);
        return urlCache[cid];
      }
    }

    // Loose: filenames stored in dims, build without network fetch.
    if (source === 'loose' && Array.isArray(chDims?.filenames)) {
      const urls = chDims.filenames.map(fname => `${base}/${fname}`);
      urlCache[cid] = Promise.resolve(urls);
      return urlCache[cid];
    }

    // Fallback: old dims.json without page_count/filenames — fetch from server.
    const suffix = isPdf ? pdfScaleParam() : '';
    urlCache[cid] = apiFetch(
      `/api/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${cid}/pages${suffix}`
    ).then(d => d.pages || []);
    return urlCache[cid];
  }

  // Prime the opening chapter URL fetch immediately so it's in-flight (or done)
  // by the time the jump block's .then() fires — eliminates the blank-first-page delay.
  ensureChapterUrls(chapterId);

  // ── THREE-TIER LOADER ──
  let TIER1_RADIUS = readerSettings.preloadRadius ?? 7;
  let TIER2_RADIUS = TIER1_RADIUS * 2;

  // Registry of detached prefetch Image() objects still in flight, keyed by
  // the manifest global index they were requested for. loadEntryTier1/
  // prefetchEntryTier2 each create a plain `new Image()` with no reference
  // kept anywhere else -- without this registry, once the conveyor window
  // moves on (continued scrolling), those old requests are simply abandoned
  // in the background: nothing ever cancels them, so they keep occupying one
  // of the browser's handful of per-origin HTTP connections indefinitely.
  // Confirmed live (not guessed at): after enough continuous scrolling, real
  // requests for the CURRENTLY VISIBLE page were observed stuck pending for
  // 10+ seconds, never completing or failing, while only a handful of old
  // abandoned requests from far-scrolled-past pages were still "in flight"
  // from the browser's own perspective -- a textbook connection-pool
  // exhaustion, and the actual root cause of the long-standing "every ~15
  // pages, low-res buffer zone" bug. cancelStalePrefetches (called from
  // prefetchAroundIndex on every conveyor shift/rebuild) is what frees these
  // up once a page falls outside even the widest (tier2) prefetch range.
  const inFlightPrefetchImages = new Map();

  // Cancels one entry's in-flight detached predecode (if any) by its exact
  // manifest index -- used both by cancelStalePrefetches' radius sweep below
  // and, directly, by every conveyor slot-vacate site (_clearSlotPool,
  // _shiftConveyorWindow) for the entry whose slot is being torn down right
  // now. The vacate sites already know the exact index leaving the window,
  // so there's no need to wait for a later radius-based sweep to catch it.
  function cancelInFlightPredecode(idx) {
    const img = inFlightPrefetchImages.get(idx);
    if (!img) return;
    img._cancelled = true;
    img.src = '';
    inFlightPrefetchImages.delete(idx);
  }

  function cancelStalePrefetches(keepLo, keepHi) {
    // Never cancel a fetch for a slot that's still actually materialized
    // (within [windowLo, windowHi]) -- this radius-based sweep is meant
    // only for genuine lookahead-only prefetches (tier1/tier2 dispatches
    // for indices not yet materialized at all), not for a materialized
    // slot's own real-image fetch. Without this guard, every conveyor
    // rebuild/shift immediately cancelled its OWN just-dispatched fetch for
    // any materialized slot outside the much narrower tier2 radius
    // (keepLo/keepHi is only +-TIER2_RADIUS, while the materialized window
    // is +-SLOT_COUNT/2) -- _rebuildConveyorWindow/_shiftConveyorWindow call
    // loadEntry() for the whole ~80-wide window and then call
    // prefetchAroundIndex(), which calls this, in the very same synchronous
    // pass. Diagnosed 2026-08-09 (code review, not yet live-verified): this
    // makes roughly half of every freshly materialized window fall back to
    // a thumbnail immediately regardless of scroll speed -- "the buffer
    // loses its center" -- most
    // visible during fast/sustained scrolling since the eye reaches those
    // thumbnail'd slots before a later shift's prefetch cycle happens to
    // bring them back within the tier2 radius. A slot actually LEAVING the
    // materialized window is still cancelled correctly elsewhere, at the
    // exact moment it's vacated (_clearSlotPool, both branches of
    // _shiftConveyorWindow) -- this sweep only needs to catch lookahead
    // prefetches now.
    for (const idx of inFlightPrefetchImages.keys()) {
      if (idx >= windowLo && idx <= windowHi) continue;
      if (idx < keepLo || idx > keepHi) cancelInFlightPredecode(idx);
    }
  }

  // Declared here (not down with the rest of the single-page-mode _sp* state)
  // because loadEntryTier1 below reads it synchronously the moment it's first
  // called -- which happens during the initial tier-1 preload, long before
  // script execution reaches the single-page-mode section further down. Left
  // declared there too as the TDZ meant every tier-1 load threw a
  // ReferenceError, which in turn aborted the rest of the top-level script
  // (including the tap-to-toggle-UI listener's own state setup further down),
  // breaking the show/hide-UI tap in every reading mode.
  let _spAnimFrame = 0;

  function sourceIsCompressed() {
    const firstCh = chapterList[0];
    if (!firstCh) return false;
    const chDims = isVolume ? dims.volumes?.[firstCh.id] : dims.chapters?.[firstCh.id];
    if (!chDims) return false;
    const src = chDims.source;
    return src === 'archive' || src === 'pdf' || src === 'epub';
  }
  const isCompressed = sourceIsCompressed();

  function thumbUrl(entry) {
    return `/api/manga/${libraryId}/${mangaId}/thumb/${entry.chapterId}/${entry.localIdx}`;
  }

  function pdfScaleParam() {
    const scales = [1.0, 1.5, 2.0];
    return `?scale=${scales[readerSettings.pdfScale ?? 1]}`;
  }

  // Assign a URL to a manifest entry (populates entry.url, sets img src via slot if assigned)
  function loadEntry(entry, retriesLeft = 2) {
    if (entry.loaded) return;
    if (entry.url) {
      _applyUrlToSlot(entry, retriesLeft);
      return;
    }
    ensureChapterUrls(entry.chapterId).then(urls => {
      entry.url = urls[entry.localIdx] || '';
      _applyUrlToSlot(entry, retriesLeft);
    });
  }

  // entry.loaded is only set once the browser confirms the image actually
  // finished loading (decode(), see below), not the moment .src is assigned
  // -- previously set unconditionally right there, so a stalled/dropped
  // request (more likely during fast scrolling, which fires many concurrent
  // slot loads at once and can exceed the browser's per-origin connection
  // cap) left that page permanently stuck at whatever partial state it
  // reached: every loader early-returns on entry.loaded, so nothing ever
  // retried it. The only "fix" was the accidental side effect of a manual
  // page jump's _rebuildConveyorWindow resetting loaded=false for the whole
  // window. Retries a couple of times (short flat delay, not exponential --
  // default retriesLeft=2 already bounds this to 3 attempts total) before
  // giving up; if retries are exhausted, entry.loaded simply stays false so
  // a later pass (scrolling back over it, a fresh conveyor rebuild) can
  // still pick it up naturally instead of being marked done-but-broken.
  //
  // Predecodes off-DOM (a detached Image() + .decode()) before ever touching
  // the real slot's <img> -- this is the function EVERY slot in the conveyor
  // actually goes through the moment it's materialized (called directly from
  // _rebuildConveyorWindow/_shiftConveyorWindow, independently of the
  // tier1/tier2/tier3 prefetch system below), so it was the real source of a
  // black-flash-during-fast-scroll bug live-confirmed on real hardware
  // (2026-08-07/08): the 2026-07-28 predecode fix only ever touched
  // loadEntryTier1, which this function's own synchronous dispatch always
  // wins the race against for any freshly-materializing slot -- assigning
  // straight to the real, already-visible <img> forces the browser to decode
  // on the critical rendering path, showing the slot's plain black
  // background underneath for a moment, exactly like the loose-image case
  // loadEntryTier1 was already fixed for. Confirmed on real hardware that
  // this isn't about network latency (a page can flash black with no
  // request anywhere near that moment in the server log -- an
  // already-cached image still has to be decoded before it can paint,
  // decode() just moves that off the critical rendering path). Tracked in
  // inFlightPrefetchImages exactly like loadEntryTier1's own detached
  // Image() -- see that map's comment -- since a slot torn down mid-decode
  // (fast scroll shifting the window again before this resolves) would
  // otherwise leak its connection indefinitely; every vacate site
  // (_clearSlotPool, both branches of _shiftConveyorWindow) cancels this by
  // exact index.
  function _applyUrlToSlot(entry, retriesLeft = 2) {
    if (!entry.url) return;
    const globalIdx = manifest.indexOf(entry);
    if (assignedSlot[globalIdx] === -1) return;
    // Marks this entry as having a real (non-thumbnail) fetch in flight or
    // complete for its currently-assigned slot -- loadEntryTier3 checks
    // this before overwriting the slot with a thumbnail, so it doesn't
    // abort a real fetch that's simply still loading. Cleared once retries
    // are exhausted so a genuinely failed fetch still gets a thumbnail
    // fallback instead of a permanently broken image.
    //
    // (loadEntryTier1 doesn't check this flag to skip its own predecode --
    // it's also used by single-page mode's _upgradeSpSlot for the same
    // manifest entries, so deferring to _realDispatched here could leave a
    // single-page slot waiting on an upgrade that only ever assigns into
    // the long-strip conveyor's own slotPool. The two tiers can end up
    // predecoding the same URL independently at the boundary between them
    // -- a little redundant work, not a correctness issue.)
    entry._realDispatched = true;
    const img = new Image();
    inFlightPrefetchImages.set(globalIdx, img);
    img.src = entry.url;
    img.decode().then(() => {
      inFlightPrefetchImages.delete(globalIdx);
      // Re-resolve the slot at paint time, not the assignedSlot value read
      // above -- the conveyor can shift while this decode is in flight,
      // moving (or removing) this entry's slot in the meantime.
      const curSi = assignedSlot[manifest.indexOf(entry)];
      if (curSi === -1) return;
      slotPool[curSi].img.src = entry.url;
      entry.loaded = true;
    }).catch(() => {
      inFlightPrefetchImages.delete(globalIdx);
      // A deliberate cancelInFlightPredecode() (this slot was vacated while
      // still decoding) also rejects this same decode() promise -- retrying
      // here would immediately re-dispatch a fresh request for a page we
      // just freed a connection slot for, defeating the whole point of
      // cancelling it. Same guard, same reasoning, as loadEntryTier1 below.
      //
      // _realDispatched must still be cleared here even though we're not
      // retrying -- confirmed live (2026-08-08): a materialization wide
      // enough to dispatch real fetches beyond prefetchAroundIndex's own
      // (much narrower) tier2 radius has those fetches cancelled by that
      // same call's cancelStalePrefetches sweep almost immediately, often
      // before decode() resolves either way. Leaving the flag set left
      // loadEntryTier3 permanently refusing to backfill even a thumbnail
      // for that slot (its own guard is exactly "skip if a real fetch is
      // pending or already succeeded") -- a real fetch that was cancelled
      // is neither, so the slot was stuck fully blank forever, not just
      // stuck at low-res.
      entry._realDispatched = false;
      if (img._cancelled) {
        // Cancelled, not a genuine failure -- retrying immediately would
        // just re-request a page we deliberately freed a connection for.
        // But clearing the flag alone isn't enough either: nothing else is
        // guaranteed to ever revisit this exact slot again (the tier3
        // sweep that would normally backfill it only runs as part of a
        // FUTURE prefetchAroundIndex call, which never comes if the user
        // just stays put reading right here) -- confirmed live, this is
        // what actually left slots blank forever even after the flag-clear
        // fix above. Attempt the thumbnail fallback right now instead of
        // hoping something else notices later.
        loadEntryTier3(entry);
        return;
      }
      if (retriesLeft > 0) {
        setTimeout(() => _applyUrlToSlot(entry, retriesLeft - 1), 500);
      } else {
        // Genuine failure, out of retries -- same reasoning as above, fall
        // through to a thumbnail now rather than leaving the slot blank.
        loadEntryTier3(entry);
      }
    });
  }

  // Tier 1: full-res + forced decode, then paint into slot
  function loadEntryTier1(entry, signal, retriesLeft = 2) {
    if (entry.loaded) return;
    // Captured now (synchronously, when this load is scheduled) rather than
    // read fresh inside _upgradeSpSlot below -- a slow tier1 prefetch
    // (queued during a fast-reading burst, or just a slower link) can
    // resolve well after the user has since flipped past it again in
    // single-page mode. Cancelling a *pending* prefetch
    // (_spSchedulePrefetch's own AbortController) only stops requests not
    // yet dispatched, never one already in flight, so
    // spManifest[spCurrentIdx] === entry alone wasn't enough to guard
    // against this -- it only checks WHICH page is current, not WHETHER a
    // newer flip has happened since this specific load was scheduled, so a
    // stale load could still win the moment the user's own reading pace
    // organically caught back up to that same page index (needing several
    // back-and-forth flips to "fix" -- each one only cancels the *next*
    // pending prefetch, not whatever earlier ones are already in flight).
    const scheduledSpFrame = _spAnimFrame;
    const apply = (url) => {
      if (!url || signal?.aborted) return;
      entry.url = url;
      const _upgradeSpSlot = () => {
        // spAssignedSlot/spSlotPool are single-page mode's own slot pool,
        // read fresh at call time (not at definition time) since which
        // slot holds spCurrentIdx can change between when this load was
        // scheduled and when it resolves.
