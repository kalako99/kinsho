        if (readerSettings.mode === 'single-page'
            && spManifest[spCurrentIdx] === entry
            && _spAnimFrame === scheduledSpFrame) {
          const spSi = spAssignedSlot[rOf(spCurrentIdx)];
          if (spSi !== -1) spSlotPool[spSi].img.src = url;
        }
      };
      // entry.loaded is only set once success is confirmed -- see
      // _applyUrlToSlot's comment above for the full reasoning (same
      // underlying bug, same fix shape). onFail retries a couple of times
      // before giving up and leaving entry.loaded false for a later pass.
      const globalIdx = manifest.indexOf(entry);
      const onSuccess = () => {
        if (signal?.aborted) return;
        entry.loaded = true;
        _upgradeSpSlot();
      };
      const onFail = () => {
        if (signal?.aborted || retriesLeft <= 0) return;
        setTimeout(() => loadEntryTier1(entry, signal, retriesLeft - 1), 500);
      };
      // Always predecode off-DOM before painting into a slot -- not just for
      // compressed sources (the old split here). Fetching bytes alone (the
      // previous loose-image path) only warms the browser's HTTP cache; the
      // slot's own <img> element -- a different element than whatever fetched
      // the bytes -- still has to synchronously decode a multi-megapixel page
      // the moment it's assigned that src, and a fast swipe/scroll can outrun
      // that decode, showing the slot's plain black background underneath
      // for a moment. img.decode() warms the browser's decoded-pixel cache,
      // which is keyed by URL, not by element, so the later
      // `slotPool[curSi].img.src = url` reuses that decode and paints
      // immediately regardless of source type.
      // Tracked in inFlightPrefetchImages (keyed by this entry's global
      // index) so a later prefetchAroundIndex call -- once the conveyor has
      // moved on and this page is no longer within even the widest prefetch
      // range -- can actively cancel it. Without this, this detached Image()
      // is referenced only by this closure's own pending decode()/catch, so
      // nothing else can ever reach it to stop it: its underlying network
      // request keeps running in the background indefinitely even after the
      // user has scrolled far past this page, permanently occupying one of
      // the browser's handful of per-origin connections. See
      // cancelStalePrefetches's own comment for the full reasoning -- this
      // was confirmed live (not guessed at): after enough continuous
      // scrolling, real page requests for the CURRENT visible position were
      // observed stuck pending for 10+ seconds, never completing or failing,
      // while only a handful of these old abandoned requests were still
      // "in flight" from the browser's perspective.
      const img = new Image();
      inFlightPrefetchImages.set(globalIdx, img);
      img.src = url;
      img.decode().then(() => {
        inFlightPrefetchImages.delete(globalIdx);
        // Re-resolve the slot fresh here, not a value captured before this
        // decode started -- the conveyor can shift (or fully rebuild
        // slotPool from scratch) while this decode is in flight, which
        // would otherwise paint this entry's image into whatever now
        // occupies a stale slot position (found 2026-08-09 via code review,
        // not yet live-verified: the exact stale-slot race _applyUrlToSlot's
        // own comment already warns about, just missed here -- matches the
        // reported "wrong image in the wrong container" bug). globalIdx
        // itself stays valid across shifts
        // (manifest order is static); only which slot it currently occupies
        // can change.
        const curSi = assignedSlot[globalIdx];
        if (curSi !== -1) slotPool[curSi].img.src = url;
        onSuccess();
      }).catch(() => {
        inFlightPrefetchImages.delete(globalIdx);
        // A deliberate cancelStalePrefetches() (src cleared because this
        // page fell outside even the tier2 range) also rejects this same
        // decode() promise -- retrying here would immediately re-dispatch a
        // fresh request for a page we just freed a connection slot for,
        // defeating the whole point of cancelling it. img._cancelled is set
        // by cancelStalePrefetches right before it clears src, so a real
        // network/decode failure (never cancelled) is the only case that
        // still retries.
        if (img._cancelled) return;
        onFail();
      });
    };
    if (entry.url) { apply(entry.url); return; }
    ensureChapterUrls(entry.chapterId).then(urls => apply(urls[entry.localIdx] || ''));
  }

  // Tier 2: full-res prefetch only — no slot assignment
  function prefetchEntryTier2(entry, signal) {
    if (entry.loaded || entry.url) return;
    ensureChapterUrls(entry.chapterId).then(urls => {
      if (signal?.aborted) return;
      const url = urls[entry.localIdx] || '';
      if (!url) return;
      entry.url = url;
      // Same stale-prefetch tracking/cancellation as loadEntryTier1 above --
      // see that function's comment and cancelStalePrefetches for why.
      //
      // Also calls decode(), not just src (previously relied on onload/
      // onerror alone, which only warms the HTTP byte cache) -- confirmed
      // live (2026-08-08) that a page which only ever reached tier2 sat
      // with its bytes cached but never decoded, so materializing it later
      // (loadEntryTier1/_applyUrlToSlot, each of which decodes a
      // *different*, throwaway Image() for the same URL) paid the real
      // decode cost right there on the critical path instead -- visible as
      // a brief black flash on an ordinary flick even though nothing
      // needed fetching over the network. decode() here warms the same
      // shared decoded-pixel cache (keyed by URL, see _applyUrlToSlot's
      // comment) well ahead of when the page is actually needed.
      const img = new Image();
      const idx = manifest.indexOf(entry);
      inFlightPrefetchImages.set(idx, img);
      img.src = url;
      img.decode().then(() => {
        inFlightPrefetchImages.delete(idx);
      }).catch(() => {
        inFlightPrefetchImages.delete(idx);
        // A cancelled prefetch (page fell back out of even tier2 range)
        // also rejects here via cancelInFlightPredecode's img.src = '' --
        // nothing further to do either way; tier2 never retries a failure,
        // a later pass will naturally re-attempt if the page is still
        // needed once it's back in range.
      });
    });
  }

  // Tier 3: thumbnail into slot (full-res will overwrite when promoted)
  function loadEntryTier3(entry) {
    if (entry.loaded) return;
    const globalIdx = manifest.indexOf(entry);
    const si = assignedSlot[globalIdx];
    if (si === -1) return;
    const img = slotPool[si].img;
    // loadEntry() (called for every slot in the window on rebuild/shift,
    // independently of this tier system) may have already dispatched the
    // real full-res fetch to this exact slot -- confirmed live: under
    // realistic network conditions (a real fetch takes real time), that
    // fetch is often still in flight by the time a later shift's
    // prefetchAroundIndex reaches this entry's tier3 range. Overwriting it
    // here would abort the real request, and once the thumbnail's own load
    // fires, the onload handler _applyUrlToSlot bound for the REAL image
    // incorrectly marks entry.loaded true -- permanently blocking any
    // future upgrade to full-res for this page (every loader early-returns
    // on entry.loaded) until the slot is vacated and reused from scratch.
    // Skip the stomp whenever the real fetch is still pending or already
    // succeeded (entry._realDispatched, set by _applyUrlToSlot -- comparing
    // img.src against entry.url directly doesn't work here, since reading
    // back img.src always yields a browser-normalized absolute URL while
    // entry.url is stored as the original relative path, so the two can
    // never be string-equal). _applyUrlToSlot clears the flag once retries
    // are exhausted, so a permanently-failed fetch still falls through to
    // the thumbnail below instead of being left broken forever.
    if (entry._realDispatched) return;
    if (!img.dataset.thumbSet) {
      img.dataset.thumbSet = '1';
      img.src = thumbUrl(entry);
    }
  }

  function prefetchAroundIndex(centerGlobalIdx, signal, direction = 0) {
    // In single-page mode with a known direction, use asymmetric radii:
    // forward gets the full velocity-scaled radius, backward gets a small fixed buffer.
    // In long-strip mode or direction=0, stay symmetric (original behaviour).
    const SP_BACK_RADIUS_T1 = 2;  // tier-1 pages to keep behind in SP mode
    const SP_BACK_RADIUS_T2 = 4;  // tier-2 pages to keep behind in SP mode

    let fwdT1, backT1, fwdT2, backT2;
    if (direction !== 0) {
      const fwd  = direction > 0 ? 1 : -1;
      fwdT1  = fwd > 0 ? TIER1_RADIUS : SP_BACK_RADIUS_T1;
      backT1 = fwd > 0 ? SP_BACK_RADIUS_T1 : TIER1_RADIUS;
      fwdT2  = fwd > 0 ? TIER2_RADIUS : SP_BACK_RADIUS_T2;
      backT2 = fwd > 0 ? SP_BACK_RADIUS_T2 : TIER2_RADIUS;
    } else {
      fwdT1 = backT1 = TIER1_RADIUS;
      fwdT2 = backT2 = TIER2_RADIUS;
    }

    const lo1 = Math.max(0, centerGlobalIdx - backT1);
    const hi1 = Math.min(manifest.length - 1, centerGlobalIdx + fwdT1);
    const lo2 = Math.max(0, centerGlobalIdx - backT2);
    const hi2 = Math.min(manifest.length - 1, centerGlobalIdx + fwdT2);

    // Free up any previously-dispatched full-res prefetch that's now outside
    // even the widest (tier2) range -- see cancelStalePrefetches's own
    // definition for why this matters.
    cancelStalePrefetches(lo2, hi2);

    for (let i = lo1; i <= hi1; i++) { if (signal?.aborted) return; loadEntryTier1(manifest[i], signal); }
    for (let i = lo2; i < lo1;  i++) { if (signal?.aborted) return; prefetchEntryTier2(manifest[i], signal); }
    for (let i = hi1 + 1; i <= hi2; i++) { if (signal?.aborted) return; prefetchEntryTier2(manifest[i], signal); }
    for (let i = Math.max(0, lo2 - 18); i < lo2; i++) { if (signal?.aborted) return; loadEntryTier3(manifest[i]); }
    for (let i = hi2 + 1; i <= Math.min(manifest.length - 1, hi2 + 18); i++) { if (signal?.aborted) return; loadEntryTier3(manifest[i]); }
  }

  // ── BINARY SEARCH: first manifest index whose bottom edge > y ──
  function firstIndexAfter(y) {
    let lo = 0, hi = manifest.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      const m   = manifest[mid];
      if (m.globalY + m.scaledH <= y) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  // ── CURRENT-POSITION TRACKING Y ──
  // Long-strip "current page"/"current chapter" tracking uses the viewport
  // MIDPOINT (virtualY + half a viewport), not the bottom edge -- correct
  // everywhere except at the true end of the manifest: virtualY is clamped
  // there (see setVirtualY/momentumLoop), so the midpoint can never reach
  // past cursorY - viewH/2, permanently short of the true last page/chapter
  // by up to half a viewport. Any trailing page shorter than that half-
  // viewport gap can never be marked "current" no matter how far the user
  // scrolls, once scrolling further is physically impossible -- the
  // segmented-progress-bar undercount bug. Clamping to the true cursorY
  // only at the true max scroll (not switching every call site to
  // bottom-edge tracking everywhere) fixes exactly that one case without
  // changing "current page" semantics anywhere else -- a bottom-edge switch
  // would flip pages earlier throughout and make chapter-boundary detection
  // MORE sensitive to any transient bad scrollTop, risking the progress-bar
  // flash/teleport bug rather than helping it.
  function currentTrackingY() {
    return (virtualY >= cursorY - viewH - 1) ? cursorY : (virtualY + viewH * 0.5);
  }

  // ── BUILD A SLOT ──
  function _makeSlotEl() {
    const el  = document.createElement('div');
    el.className = 'page-slot';
    const img = document.createElement('img');
    img.style.display   = 'block';
    img.style.width     = '100%';
    img.style.height    = '100%';
    img.style.objectFit = 'fill';
    img.draggable = false; // see .page-slot img's -webkit-user-drag comment
    el.appendChild(img);
    return { el, img };
  }

  // ── FULL REBUILD: clears the conveyor and materializes a new window of
  // up to SLOT_COUNT entries centered on newWindowLo, then sets scrollTop
  // so targetGlobalY lands at the same point in the viewport. ──
  // Removes only the materialized slot-pool children, leaving topSpacer/
  // bottomSpacer in place as permanent fixtures -- reader.replaceChildren()
  // would also wipe the spacers, which must never happen.
  function _clearSlotPool() {
    // Clearing src before removal aborts any still-in-flight fetch on the
    // slot's own <img> element -- but since _applyUrlToSlot now predecodes
    // via a separate, detached Image() before ever touching the real slot
    // (see its own comment), the actual in-flight fetch for a still-loading
    // entry usually lives there instead, out of this element's reach
    // entirely. cancelInFlightPredecode closes that gap by exact index, same
    // as both branches of _shiftConveyorWindow below -- without it, every
    // slot torn down mid-load would leak its detached predecode's connection
    // indefinitely, the exact "abandoned request" bug class
    // cancelStalePrefetches was built to prevent for tier1/tier2, just at
    // the much larger scale of the whole conveyor window instead of a
    // narrow prefetch radius.
    for (let k = 0; k < slotPool.length; k++) {
      const { el, img } = slotPool[k];
      img.src = '';
      el.remove();
      cancelInFlightPredecode(windowLo + k);
    }
    slotPool.length = 0;
  }

  // Shared by _rebuildConveyorWindow and _rebaseCoordinates below -- centers
  // a fresh coordOffset on targetGlobalY, clamped to the manifest's own
  // bounds (same "center a window, clamp to [0, length-count]" shape as
  // windowLo elsewhere in this file).
  function _computeCoordOffset(targetGlobalY) {
    return Math.max(0, Math.min(
      targetGlobalY - SAFE_PHYSICAL_HEIGHT / 2,
      Math.max(0, cursorY - SAFE_PHYSICAL_HEIGHT)
    ));
  }

  // Rebase coordOffset WITHOUT touching the materialized slot pool at all --
  // for when only the coordinate ceiling needs addressing, not which pages
  // are on screen. A full _rebuildConveyorWindow tears down and reloads
  // every one of the ~SLOT_COUNT slots, which is real, visible work: pages
  // that were already correctly loaded flash back to their placeholder
  // background for a frame while they redecode, confirmed live (2026-08-08)
  // on every rebase. Since slot elements are positioned by plain block flow
  // (no absolute coordinates baked into them), moving the coordinate origin
  // only requires resizing the spacers and shifting scrollTop to match --
  // the slots themselves don't need to change at all, so their already-
  // loaded images stay exactly as they are.
  function _rebaseCoordinates(targetGlobalY) {
    const newCoordOffset = _computeCoordOffset(targetGlobalY);
    if (newCoordOffset === coordOffset) return;
    // physical = logical - coordOffset -- keep the SAME visual/physical
    // position while coordOffset (and therefore what physical position
    // that logical position maps to) changes underneath it.
    const delta = coordOffset - newCoordOffset;
    coordOffset = newCoordOffset;
    _syncSpacers();
    reader.scrollTop += delta;
  }

  // ── WILL-CHANGE LAYER PROMOTION, SCOPED TO ±TIER1_RADIUS ──
  // Applies .page-slot-near (see its own CSS comment) to only the slots
  // within TIER1_RADIUS of centerIdx, removing it from everything else --
  // deliberately NOT all SLOT_COUNT (80) materialized slots, since GPU
  // layer promotion has a real memory cost per element. Called from every
  // window rebuild/shift AND on every syncScrollPosition tick (not just
  // shift boundaries) -- the black-flash report this targets happens on
  // ordinary small flicks during real reading, which move the true
  // position continuously and never get anywhere near a window-shift
  // boundary, so this has to track centerIdx directly, not piggyback on
  // the rarer shift/rebuild events the way fetchPriority does (2026-08-11).
  let _nearSlotIndices = new Set();
  function updateNearSlots(centerIdx) {
    const lo = Math.max(windowLo, centerIdx - TIER1_RADIUS);
    const hi = Math.min(windowHi, centerIdx + TIER1_RADIUS);
    const next = new Set();
    for (let i = lo; i <= hi; i++) {
      if (assignedSlot[i] !== -1) next.add(i);
    }
    for (const i of _nearSlotIndices) {
      if (!next.has(i)) {
        const si = assignedSlot[i];
        if (si !== -1) slotPool[si].el.classList.remove('page-slot-near');
      }
    }
    for (const i of next) {
      if (!_nearSlotIndices.has(i)) {
        const si = assignedSlot[i];
        if (si !== -1) slotPool[si].el.classList.add('page-slot-near');
      }
    }
    _nearSlotIndices = next;
  }

  function _rebuildConveyorWindow(newWindowLo, targetGlobalY) {
    for (let i = windowLo; i <= windowHi; i++) {
      manifest[i].loaded = false;
      assignedSlot[i] = -1;
    }
    _clearSlotPool();

    if (manifest.length === 0) { windowLo = 0; windowHi = -1; _syncSpacers(); return; }

    const count = Math.min(SLOT_COUNT, manifest.length);
    windowLo = Math.max(0, Math.min(newWindowLo, manifest.length - count));
    windowHi = windowLo + count - 1;

    // Every full rebuild re-centers coordOffset on where we're actually
    // landing (targetGlobalY) -- keeps a freshly-rebuilt window comfortably
    // far from the coordinate ceiling regardless of why this rebuild was
    // triggered (chapter jump, bookmark, or a big enough slot-window jump
    // that a rebuild was needed anyway). See _rebaseCoordinates above for
    // the much cheaper path used when only the coordinate offset -- not
    // which pages are materialized -- actually needs to change.
    coordOffset = _computeCoordOffset(targetGlobalY);
    const frag = document.createDocumentFragment();
    for (let i = windowLo; i <= windowHi; i++) {
      const { el, img } = _makeSlotEl();
      el.style.height = manifest[i].scaledH + 'px';
      frag.appendChild(el);
      slotPool.push({ el, img });
      assignedSlot[i] = i - windowLo;
    }
    readerInner.insertBefore(frag, bottomSpacer);

    // topSpacer must be sized BEFORE reader.scrollTop is set below, since
    // its height is what makes targetGlobalY and scrollTop consistent
    // (physical = logical - coordOffset, see FULL-HEIGHT SPACERS above).
    _syncSpacers();
    reader.scrollTop = targetGlobalY - coordOffset;

    // Load the slot images CENTER-OUT from the page actually at the
    // viewport top — not in windowLo→windowHi DOM order. All ~SLOT_COUNT
    // images share the browser's handful of connections per origin, so
    // request order effectively IS priority order: DOM-order loading
    // queued the visible page behind up to half the window of off-screen
    // full-res pages, which is exactly the blank-first-page-until-you-
    // scroll symptom on a cold server. fetchPriority nudges supporting
    // browsers the same way (harmless no-op elsewhere).
    const centerIdx = Math.max(windowLo, Math.min(windowHi, firstIndexAfter(targetGlobalY)));

    // How many pages ahead/behind center get 'high' fetchPriority, in
    // viewport-relative terms rather than a tiny fixed count. A fixed ±2
    // (the old value) is far too narrow relative to SLOT_COUNT=80: every
    // other page in the ~80-slot window competes on equal 'low' footing
    // with no ordering guarantee between them, so a page just outside that
    // ±2 band -- still well within the first screenful or two the user
    // will actually read within seconds of opening the chapter -- could
    // finish loading well after a page much further away, purely by
    // network race. This only shows up on the very first materialization
    // (all ~80 requests fire at once); ordinary scrolling only ever adds a
    // couple of new pages per shift, so this never mattered there -- a real
    // reported bug, confirmed to appear only right after opening a chapter.
    // Biased forward (more pages ahead than behind) since long-strip
    // reading is essentially always downward, even before any actual scroll
    // has happened to establish a direction.
    const avgPageH = manifest[centerIdx]?.scaledH || viewH;
    // Floors of 12/4 are deliberately generous rather than purely
    // viewport-derived -- long-strip "cuts" vary wildly in height across
    // different manga/webtoons, and the reported bug specifically involved
    // pages several past the visible screenful (up to ~9) still racing on
    // equal footing with the rest of the window; a floor directly sized to
    // comfortably cover that, with the viewport-based term as a secondary
    // boost for unusually short pages, is more robust than trusting the
    // page-height assumption alone.
    const HIGH_PRI_AHEAD  = Math.max(12, Math.ceil((viewH * 3) / avgPageH));
    const HIGH_PRI_BEHIND = Math.max(4, Math.ceil(viewH / avgPageH));

    for (let d = 0; d <= windowHi - windowLo; d++) {
      for (const i of (d === 0 ? [centerIdx] : [centerIdx + d, centerIdx - d])) {
        if (i < windowLo || i > windowHi) continue;
        const si = assignedSlot[i];
        if (si !== -1) {
          const rel = i - centerIdx;
          slotPool[si].img.fetchPriority = (rel >= -HIGH_PRI_BEHIND && rel <= HIGH_PRI_AHEAD) ? 'high' : 'low';
        }
        loadEntry(manifest[i]);
      }
    }
    prefetchAroundIndex(centerIdx);
    updateNearSlots(centerIdx);
  }

  // ── INCREMENTAL SHIFT: moves the window by `delta` entries by dropping
  // slots off one end and adding them on the other. Never touches
  // reader.scrollTop directly -- _syncSpacers() at the end keeps the
  // spacers' heights consistent with the new window, which is what keeps
  // the visible content from moving (see FULL-HEIGHT SPACERS above). ──
  function _shiftConveyorWindow(delta) {
    if (delta > 0) {
      const frag = document.createDocumentFragment();
      for (let k = 0; k < delta; k++) {
        const oldIdx = windowLo + k;
        manifest[oldIdx].loaded = false;
        assignedSlot[oldIdx] = -1;
        // Abort any still-in-flight fetch on this vacated slot -- see
        // _clearSlotPool's comment for why this matters.
        slotPool[k].img.src = '';
        slotPool[k].el.remove();
        cancelInFlightPredecode(oldIdx);

        const newIdx = windowHi + 1 + k;
        const { el } = _makeSlotEl();
        el.style.height = manifest[newIdx].scaledH + 'px';
        frag.appendChild(el);
        loadEntry(manifest[newIdx]);
      }
      readerInner.insertBefore(frag, bottomSpacer);
      windowLo += delta;
      windowHi += delta;
    } else {
      const n = -delta;
      const frag = document.createDocumentFragment();
      for (let k = n - 1; k >= 0; k--) {
        const newIdx = windowLo - 1 - k;
        const { el } = _makeSlotEl();
        el.style.height = manifest[newIdx].scaledH + 'px';
        frag.appendChild(el);
        loadEntry(manifest[newIdx]);
      }
      readerInner.insertBefore(frag, topSpacer.nextSibling);
      for (let k = 0; k < n; k++) {
        const oldIdx = windowHi - k;
        manifest[oldIdx].loaded = false;
        assignedSlot[oldIdx] = -1;
        slotPool[slotPool.length - 1 - k].img.src = '';
        slotPool[slotPool.length - 1 - k].el.remove();
        cancelInFlightPredecode(oldIdx);
      }
      windowLo -= n;
      windowHi -= n;
    }

    // Rebuild slotPool by walking the DOM strictly between the two spacers
    // -- robust regardless of how many slots were added/removed above,
    // and never mistakes a spacer for a slot the way indexing
    // reader.children directly would now that spacers are permanent
    // siblings of the slot pool.
    slotPool.length = 0;
    let node = topSpacer.nextSibling;
    let k = 0;
    while (node && node !== bottomSpacer) {
      slotPool.push({ el: node, img: node.querySelector('img') });
      assignedSlot[windowLo + k] = k;
      node = node.nextSibling;
      k++;
    }
    _syncSpacers();
    const shiftCenterIdx = Math.floor((windowLo + windowHi) / 2);
    prefetchAroundIndex(shiftCenterIdx);
    updateNearSlots(shiftCenterIdx);
  }

  // ── RECENTER: called on every conveyor-window edge crossing (mid-gesture)
  // and again on scroll-stop. Re-centers the materialized window on the
  // entry at the top of the viewport, as close as edges allow. ──
  // isSettled distinguishes the two call contexts for the coordinate-rebase
  // margin only (see COORD_REBASE_MARGIN/COORD_REBASE_EMERGENCY_MARGIN above)
  // -- conveyor window shifting itself is unaffected either way.
  function recenterConveyor(isSettled = false) {
    if (manifest.length === 0) return;
    const currentIdx = Math.min(manifest.length - 1, firstIndexAfter(virtualY));
    const count  = Math.min(SLOT_COUNT, manifest.length);
    const target = Math.max(0, Math.min(currentIdx - Math.floor(count / 2), manifest.length - count));
    const delta  = target - windowLo;
    // Getting close to either edge of the current safe coordinate window
    // (see COORDINATE REBASING above) -- independent of whether the slot
    // window itself needs to move at all (they're different quantities,
    // one in manifest entries, one in raw px), so checked unconditionally
    // rather than folded into the delta-based branches below.
    const rebaseMargin = isSettled ? COORD_REBASE_MARGIN : COORD_REBASE_EMERGENCY_MARGIN;
    const needsRebase =
      virtualY - coordOffset < rebaseMargin ||
      (coordOffset + SAFE_PHYSICAL_HEIGHT) - virtualY < rebaseMargin;
    if (delta === 0 && !needsRebase) return;
    if (Math.abs(delta) >= count) {
      // Materialized content itself needs to change wholesale regardless
      // of needsRebase -- already a full rebuild, which picks a fresh
      // coordOffset as part of it, so there's nothing extra to do here.
      _rebuildConveyorWindow(target, virtualY);
    } else {
      // Slot window either doesn't need to move or only needs a cheap
      // shift -- a full rebuild would needlessly tear down and reload
      // pages that are already correctly on screen just to move the
      // coordinate origin (confirmed live: a visible flash on every
      // rebase, 2026-08-08). Rebase first (a no-op if !needsRebase, since
      // _rebaseCoordinates itself no-ops when the offset wouldn't change),
      // then shift if the window also needs to move.
      if (needsRebase) _rebaseCoordinates(virtualY);
      if (delta !== 0) _shiftConveyorWindow(delta);
    }
  }

  // updateProgressBar()/scheduleProgressSave() each do several full-manifest
  // linear scans (getCurrentGlobalPageIdx, checkChapterCompletion, the
  // active-chapter/active-page lookups inside updateProgressBar itself) plus
  // DOM queries — the UI they drive (progress bar, chapter label, page
  // slider) doesn't need per-frame precision, but syncScrollPosition used to
  // run them on every single native 'scroll' event unthrottled. Continuous
  // BLE-scroller-driven scrolling writes reader.scrollTop every rAF frame
  // (~60Hz), and that cost was enough to occasionally blow the frame budget
  // — the resulting dropped/delayed frames read as scroll choppiness that
  // got WORSE the faster the scroller was going (a bigger catch-up jump per
  // dropped frame at higher px/sec), which is why it looked like an
  // acceleration-curve problem but wasn't one (2026-07-08). Throttled to
  // ~12Hz with a trailing call so the final position after scrolling stops
  // is never more than one throttle window stale.
  const SCROLL_BOOKKEEPING_THROTTLE_MS = 80;
  let _scrollBookkeepingLastRun = 0;
  let _scrollBookkeepingTimer   = null;
  function runScrollBookkeeping() {
    _scrollBookkeepingLastRun = performance.now();
    _scrollBookkeepingTimer = null;
    updateProgressBar();
    scheduleProgressSave();
  }
  function throttledScrollBookkeeping() {
    const elapsed = performance.now() - _scrollBookkeepingLastRun;
    if (elapsed >= SCROLL_BOOKKEEPING_THROTTLE_MS) {
      runScrollBookkeeping();
    } else if (!_scrollBookkeepingTimer) {
      _scrollBookkeepingTimer = setTimeout(runScrollBookkeeping, SCROLL_BOOKKEEPING_THROTTLE_MS - elapsed);
    }
  }

  // ── SYNC: lightweight, called on every native scroll event. ──
  // How close (in manifest entries) the current position may get to either
  // edge of the materialized window before syncScrollPosition proactively
  // recenters mid-gesture, rather than waiting for scrollend/settle. Keeps
  // a long continuous scroll (fast flick, held wheel, BLE scroller) from
  // ever outrunning the window and hitting #reader's real DOM edge -- the
  // "scroll stops after ~40 pages" bug. Safe to call recenterConveyor here
  // now that _shiftConveyorWindow never writes reader.scrollTop directly
  // (see its own comment) -- it can no longer fight native scroll momentum
  // the way the old scrollTop-compensating version could.
  const EDGE_MARGIN = Math.floor(SLOT_COUNT / 4);

  function syncScrollPosition() {
    if (manifest.length === 0) return;
    // physical -> logical (see COORDINATE REBASING above): reader.scrollTop
    // is only ever the TRUE position minus coordOffset now, not the TRUE
    // position itself.
    virtualY = reader.scrollTop + coordOffset;
    throttledScrollBookkeeping();
    // True end-of-manifest bound (matches momentumLoop's own check below) --
    // NOT reader.scrollHeight, which is now always the full cursorY thanks
    // to the spacers and would make this fire at the wrong position anyway.
    // isOnLastChapter() (not currentChapIdx, which is frozen to the entry
    // chapter) -- see its own comment for why.
    if (isOnLastChapter() && virtualY >= cursorY - viewH - 1) {
      showLastPagePopup();
      // checkChapterCompletion() only ever fires on a chapter-boundary crossing
      // (visibleChapterId changing), which never happens for the manga's last
      // chapter — there's no next chapter to scroll into, so it would otherwise
      // never get marked completed. This is that missing case: reaching the true
      // end of the whole manifest completes the last chapter directly. Guarded
      // so it only posts once per page load, not on every scroll tick spent
      // sitting at the bottom.
      if (!finalChapterCompletionSaved) {
        finalChapterCompletionSaved = true;
        saveReadingProgress(chapterList[chapterList.length - 1].id);
      }
    }
    const idxAtTop = firstIndexAfter(virtualY);
    updateNearSlots(idxAtTop);
    if (idxAtTop - windowLo < EDGE_MARGIN || windowHi - idxAtTop < EDGE_MARGIN) {
      recenterConveyor();
    }
  }

  // ── NATIVE SCROLL WIRING ──
  // recenterConveyor is now safe to call at any time, including mid-gesture
  // (see EDGE_MARGIN above and _shiftConveyorWindow's own comment) -- it no
  // longer writes reader.scrollTop directly except via _rebuildConveyorWindow's
  // "big jump" branch, which EDGE_MARGIN's small, frequent recenters keep
  // this code path from reaching in ordinary continuous scrolling. scrollend
  // (or the settle-poll fallback below, for browsers without it) still runs
  // recenterConveyor too, as a final correction once scrolling fully stops --
  // harmless to call redundantly, since recenterConveyor no-ops if the
  // window's already correctly centered.
  const supportsScrollEnd = 'onscrollend' in window;

  // Batched onto requestAnimationFrame rather than calling syncScrollPosition
  // directly from the scroll listener -- native touch/stylus fling can run
  // entirely on the compositor thread since every listener here is passive,
  // but syncScrollPosition's own work (recenterConveyor's DOM mutation on an
  // edge crossing) still has to happen on the main thread, and doing that
  // synchronously inside the scroll event's own dispatch competes with the
  // browser's compositing work for the same frame -- most visible exactly
  // during a gesture's acceleration/deceleration phases, where a dropped
  // frame is easiest to perceive (2026-08-09). Coalesces any scroll events
  // that fire faster than once per frame into a single check per frame, and
  // lets the browser schedule that check relative to its own paint work
  // instead of forcing it inline. _syncRafPending guards against queuing more
  // than one pending frame; the callback reads reader.scrollTop fresh at
  // execution time (via syncScrollPosition itself), so a burst of events
  // collapsing into one check still uses the latest position, not a stale one.
  let _syncRafPending = false;
  function scheduleSyncScrollPosition() {
    if (_syncRafPending) return;
    _syncRafPending = true;
    requestAnimationFrame(() => {
      _syncRafPending = false;
      syncScrollPosition();
    });
  }

  reader.addEventListener('scroll', () => {
    scheduleSyncScrollPosition();
    if (!supportsScrollEnd) scheduleSettledCheck();
  }, { passive: true });

  if (supportsScrollEnd) {
    reader.addEventListener('scrollend', () => recenterConveyor(true), { passive: true });
  }

  // Screen lock/unlock (or any other backgrounding of the WebView) can leave
  // this whole pipeline silently stalled: native, compositor-driven scrolling
  // keeps working the instant the screen unlocks (it never depended on this
  // app's own JS), but reading position/progress-saving/chapter-completion --
  // and even the conveyor's own slot virtualization -- ALL live downstream of
  // syncScrollPosition(), which only ever re-enters via requestAnimationFrame
  // from inside the native 'scroll' listener above. If a rAF queued right as
  // the screen locked is dropped rather than merely deferred (or the WebView
  // is simply slow to resume dispatching real 'scroll' events after resume),
  // nothing re-primes the chain until the user happens to scroll -- read live
  // as "chapter completion and the last-read page both silently stop
  // updating after locking mid-chapter." Force one synchronous resync
  // directly (not through scheduleSyncScrollPosition/rAF, in case rAF itself
  // is what's stuck) the moment the page becomes visible again, so reading
  // can never resume with this pipeline dark. Harmless to call redundantly
  // when nothing was actually stuck -- syncScrollPosition() itself no-ops
  // past its own throttle/edge checks when nothing changed. Long-strip only,
  // matching checkChapterCompletion's own scope (its very first line) --
  // single-page mode's progress save is driven by its own per-flip settle
  // handler (spGotoIdx's spProgressSaveTimer), not this scroll/rAF chain, and
  // #reader isn't even the active scroll surface there.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (readerSettings.mode !== 'long-strip') return;
    _syncRafPending = false;
    syncScrollPosition();
  });

  let _settledRaf   = null;
  let _settledLast  = 0;
  let _settledTicks = 0;
  function scheduleSettledCheck() {
    _settledTicks = 0;
    if (_settledRaf) return;
    _settledLast = reader.scrollTop;
    _settledRaf  = requestAnimationFrame(_settledTick);
  }
  function _settledTick() {
    const cur = reader.scrollTop;
    if (cur === _settledLast) {
      _settledTicks++;
      if (_settledTicks >= 2) { _settledRaf = null; recenterConveyor(true); return; }
    } else {
      _settledTicks = 0;
      _settledLast  = cur;
    }
    _settledRaf = requestAnimationFrame(_settledTick);
  }

  // ── SET VIRTUAL Y (programmatic jumps: bookmarks, slider, mode switch) ──
  function setVirtualY(newY) {
    const maxY = Math.max(0, cursorY - viewH);
    virtualY = Math.max(0, Math.min(newY, maxY));
    if (manifest.length === 0) return;
    const currentIdx = Math.min(manifest.length - 1, firstIndexAfter(virtualY));
    const count  = Math.min(SLOT_COUNT, manifest.length);
    const target = Math.max(0, Math.min(currentIdx - Math.floor(count / 2), manifest.length - count));
    _rebuildConveyorWindow(target, virtualY);
    updateProgressBar();
    scheduleProgressSave();
  }

  // ── applyManifestToSlots: called after geometry changes (padding/width).
  // Clears the conveyor; the caller's subsequent setVirtualY rebuilds it. ──
  function applyManifestToSlots() {
    for (let i = windowLo; i <= windowHi; i++) {
      manifest[i].loaded = false;
      assignedSlot[i] = -1;
    }
    _clearSlotPool();
    windowLo = 0;
    windowHi = -1;
  }

  // ── JUMP TO OPENING CHAPTER ──
  // globalY is computed from dims.json synchronously — materialize the
  // conveyor window centered on it before first paint.
  const startIdx = chapterStart[chapterId];
  let startGlobalIdx = 0;
  if (startIdx !== undefined) {
    const targetIdx = startPage > 0 ? Math.min(startIdx + startPage, manifest.length - 1) : startIdx;
    startGlobalIdx = targetIdx;
    virtualY = manifest[targetIdx].globalY;
  }

  if (manifest.length > 0) {
    const count  = Math.min(SLOT_COUNT, manifest.length);
    const target = Math.max(0, Math.min(startGlobalIdx - Math.floor(count / 2), manifest.length - count));
    _rebuildConveyorWindow(target, virtualY);
  }

  // Prime the URL cache for the opening chapter, then let the tier system
  // load only the pages around the starting position.
  ensureChapterUrls(chapterId).then(() => {
    prefetchAroundIndex(startGlobalIdx);
  });

  // ── MOMENTUM SCROLL ──
  let velocity = 0;
  let rafId    = null;

  function momentumLoop() {
    if (Math.abs(velocity) < 2.5) {
      velocity = 0;
      rafId    = null;
      return;
    }
    velocity *= 0.982;
    const atEnd = virtualY >= cursorY - viewH - 1;
    if (velocity > 0 && isOnLastChapter() && atEnd) {
      velocity = 0;
      rafId    = null;
      showLastPagePopup();
      return;
    }
    reader.scrollTop += velocity;
    rafId = requestAnimationFrame(momentumLoop);
  }

  // ── NATIVE BLE BRIDGE (Android APK only) ──
  window.injectScroll = function(delta) {
    const sensitivity = Math.abs(delta) < 20 ? 4.0 : 0.6;
    velocity += delta * sensitivity;
    if (!rafId) rafId = requestAnimationFrame(momentumLoop);
  };

  // ── WHEEL INPUT (PC) ──
  // Long-strip: native wheel scrolling on #reader (overflow-y: auto) handles
  // this with no JS involvement. This listener now only intercepts wheel
  // events in single-page mode, where wheel ticks flip pages.
  let spWheelAccum  = 0;
  let spWheelTimer  = null;
  const SP_WHEEL_THRESHOLD = 60;

  window.addEventListener('wheel', e => {
    if (readerSettings.mode !== 'single-page') return;
    e.preventDefault();
    let raw = e.deltaY;
    if (e.deltaMode === 1) raw *= 32;
    if (e.deltaMode === 2) raw *= window.innerHeight;

    spWheelAccum += raw;
    if (Math.abs(spWheelAccum) >= SP_WHEEL_THRESHOLD) {
      const dir = spWheelAccum > 0 ? 1 : -1;
      spWheelAccum = 0;
      clearTimeout(spWheelTimer);
      spWheelTimer = setTimeout(() => { spWheelAccum = 0; }, 300);
      if (dir > 0) spNext(); else spPrev();
    }
  }, { passive: false });

  // ── TOUCH INPUT (tablet / phone) ──
  // Long-strip: native touch scrolling on #reader (overflow-y: auto) handles
  // drag, momentum and rubber-banding directly. These listeners now only
  // track touchMoved, so the document click handler can tell a tap (toggle
  // UI bars) apart from a scroll-drag.
  let touchStartY   = 0;
  let touchMoved    = false;
  const TOUCH_TAP_THRESHOLD = 8;

  reader.addEventListener('touchstart', e => {
    if (readerSettings.mode === 'single-page') return;
    velocity = 0;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    touchStartY = e.touches[0].clientY;
    touchMoved  = false;
  }, { passive: true });

  reader.addEventListener('touchmove', e => {
    if (readerSettings.mode === 'single-page') return;
    const y = e.touches[0].clientY;
    if (Math.abs(y - touchStartY) > TOUCH_TAP_THRESHOLD) touchMoved = true;
  }, { passive: true });

  reader.addEventListener('touchend', e => {
    if (readerSettings.mode === 'single-page') return;
    if (!touchMoved) return;
    e.preventDefault();
  }, { passive: false });

  // ── FRAGMENT PROGRESS BAR ──
  const fragProgress = document.getElementById('fragProgress');

  // Read theme primary color from CSS variable (set by app.js via loadTheme)
  const themeColor = getComputedStyle(document.documentElement)
                       .getPropertyValue('--color-primary').trim() || '#e94560';
  document.documentElement.style.setProperty('--theme-primary', themeColor);

  const leftTooltip = document.getElementById('leftTooltip');

  // Tracks which chapter the left bar is currently built for
  let fragProgressChapterId = chapterId;
  let chapterManifest = manifest.filter(e => e.chapterId === chapterId);
  let totalPages      = chapterManifest.length;

  function rebuildFragProgress(forChapterId) {
    fragProgressChapterId = forChapterId;
    chapterManifest = manifest.filter(e => e.chapterId === forChapterId);
    totalPages      = chapterManifest.length;

    fragProgress.querySelectorAll('.frag-seg').forEach(s => s.remove());

    for (let i = 0; i < totalPages; i++) {
      const seg = document.createElement('div');
      seg.className = 'frag-seg';

      seg.addEventListener('mouseenter', () => {
        leftHoveredIdx = i;
        leftTooltip.textContent = `${i + 1} / ${totalPages}`;
        const r = seg.getBoundingClientRect();
        leftTooltip.style.left      = (r.right + 14) + 'px';
        leftTooltip.style.top       = (r.top + r.height / 2) + 'px';
        leftTooltip.style.transform = 'translateY(-50%)';
        leftTooltip.classList.add('pinned');
      });
      seg.addEventListener('mouseleave', () => {
        leftHoveredIdx = null;
        leftTooltip.classList.remove('pinned');
      });
      seg.addEventListener('click', (e) => {
        e.stopPropagation();
        const target = chapterManifest[i];
        if (!target) return;
        if (readerSettings.mode === 'single-page') {
          const spIdx = spManifest.indexOf(target);
          if (spIdx !== -1) spGotoIdx(spIdx);
          else goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${forChapterId}`);
        } else {
          setVirtualY(target.globalY);
          const globalIdx = manifest.indexOf(target);
          if (globalIdx !== -1) prefetchAroundIndex(globalIdx);
        }
      });

      fragProgress.appendChild(seg);
    }
  }

  // Initial build for the opening chapter
  rebuildFragProgress(chapterId);

  // ── GLOBAL PAGE SLIDER ──
  // Flat ordered list of all pages across all chapters in reading order
  const globalManifest = manifest; // already in order

  const pageSliderWrap  = document.getElementById('pageSliderWrap');
  const pageSliderInput = document.getElementById('pageSliderInput');
  const pageSliderLabel = document.getElementById('pageSliderLabel');
  const thumbStrip      = document.getElementById('thumbStrip');

  pageSliderInput.max   = Math.max(0, globalManifest.length - 1);
  pageSliderInput.value = 0;
  pageSliderLabel.textContent = `1 / ${globalManifest.length}`;

  let sliderDragging    = false;
  let stripVisible      = false;

  // Returns the current global page index based on scroll/single-page position
  function getCurrentGlobalPageIdx() {
    if (readerSettings.mode === 'single-page') {
      const entry = spManifest[spCurrentIdx];
      return entry ? manifest.indexOf(entry) : 0;
    }
    const midY = currentTrackingY();
    let idx = 0;
    for (let i = 0; i < manifest.length; i++) {
      if (manifest[i].globalY <= midY) idx = i;
      else break;
    }
    return idx;
  }

  // Navigate reader to a global manifest index
  function navigateToGlobalIdx(idx) {
    const entry = globalManifest[idx];
    if (!entry) return;
    if (readerSettings.mode === 'single-page') {
      if (entry.chapterId === chapterId) {
        const spIdx = spManifest.indexOf(entry);
        if (spIdx !== -1) { spGotoIdx(spIdx); return; }
      }
      goToChapter(
        `/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${entry.chapterId}?page=${entry.localIdx}`
      );
    } else {
      setVirtualY(entry.globalY);
      prefetchAroundIndex(idx);
    }
    updateProgressBar();
  }

  // ── SLIDER VISIBILITY ──
  function syncSliderVisibility() {
    if (barVisible) {
      const globalIdx = getCurrentGlobalPageIdx();
      pageSliderInput.value = globalIdx;
      pageSliderLabel.textContent = `${globalIdx + 1} / ${globalManifest.length}`;
      pageSliderWrap.classList.add('visible');
    } else {
      pageSliderWrap.classList.remove('visible');
      hideThumbStrip();
    }
  }

  // ── SLIDER INPUT EVENTS ──
  pageSliderInput.addEventListener('mousedown', () => { sliderDragging = true; });
  pageSliderInput.addEventListener('touchstart', () => { sliderDragging = true; }, { passive: true });

  pageSliderInput.addEventListener('input', () => {
    const idx = Number(pageSliderInput.value);
    pageSliderLabel.textContent = `${idx + 1} / ${globalManifest.length}`;
    if (!stripVisible) showThumbStrip(idx);
    else buildThumbStrip(idx);
    clearTimeout(barTimer);
  });

  pageSliderInput.addEventListener('mouseup', (e) => {
    sliderDragging = false;
    if (stripVisible) {
      e.stopPropagation();
      clearTimeout(barTimer);
    }
  });

  pageSliderInput.addEventListener('click', (e) => {
    if (stripVisible) e.stopPropagation();
  });

  pageSliderInput.addEventListener('touchend', () => {
    sliderDragging = false;
    if (stripVisible) clearTimeout(barTimer);
  }, { passive: true });

  pageSliderWrap.addEventListener('click', (e) => {
    if (e.target === pageSliderWrap) {
      hideThumbStrip();
      clearTimeout(barTimer);
      barTimer = setTimeout(() => hideAll(), 3000);
      return;
    }
    if (stripVisible) e.stopPropagation();
  });

  const thumbTrack   = document.getElementById('thumbTrack');
  const THUMB_W      = 100; // px, matches CSS
  const THUMB_GAP    = 6;   // px, matches CSS
  const THUMB_STEP   = THUMB_W + THUMB_GAP; // px per thumb cell
  const THUMB_BUFFER = 5;   // cells to render outside visible edges

  let stripAbortCtrl  = null;
  let stripCenterIdx  = 0;   // global manifest index at the center of the visible window
  let _trackOffset    = 0;   // current translateX of the track (negative = scrolled right)
  let _renderedLo     = 0;   // lowest global index currently in the DOM
  let _renderedHi     = -1;  // highest global index currently in the DOM
  let _cellMap        = {};  // gi → DOM cell element

  // ── VELOCITY TRACKING ──
  let _sliderLastIdx  = 0;
  let _sliderLastTime = 0;
  let _sliderVelocity = 0;
  const VELOCITY_THRESHOLD = 12;
  const THUMB_DEBOUNCE_MS  = 100;
  let _thumbDebounceTimer  = null;

  function _measureSliderVelocity(newIdx) {
    const now = performance.now();
    const dt  = (now - _sliderLastTime) / 1000;
    if (dt > 0 && dt < 1.0) {
      const instantV = Math.abs(newIdx - _sliderLastIdx) / dt;
      _sliderVelocity = _sliderVelocity * 0.6 + instantV * 0.4;
    } else {
      _sliderVelocity = 0;
    }
    _sliderLastIdx  = newIdx;
    _sliderLastTime = now;
  }

  function _cancelThumbLoading() {
    if (stripAbortCtrl) { stripAbortCtrl.abort(); stripAbortCtrl = null; }
    clearTimeout(_thumbDebounceTimer);
    _thumbDebounceTimer = null;
  }

  // ── TRACK POSITION ──
  // trackOffset for a given center global index:
  // we want the center thumb to be at the middle of the strip window.
  function _stripW() {
    // getBoundingClientRect returns 0 before first paint (display:none → block transition)
    // Use the slider wrap width as a reliable proxy since they share the same width.
    const r = pageSliderWrap.getBoundingClientRect().width;
    return r > 0 ? r : window.innerWidth - 40;
  }

  function _offsetForIdx(gi) {
    const centerPx = gi * THUMB_STEP;
    const targetX  = _stripW() / 2 - THUMB_W / 2;
    return targetX - centerPx;
  }

  function _clampOffset(offset) {
    const maxOff = _offsetForIdx(0);
    const minOff = _offsetForIdx(globalManifest.length - 1);
    return Math.max(minOff, Math.min(maxOff, offset));
  }

  function _idxAtOffset(offset) {
    const centerPx = _stripW() / 2 - offset;
    const gi       = Math.round((centerPx - THUMB_W / 2) / THUMB_STEP);
    return Math.max(0, Math.min(globalManifest.length - 1, gi));
  }

  // ── RENDER WINDOW ──
  // Work out which cells should exist in the DOM given current offset,
  // add missing ones, remove ones that have gone out of range.
  function _updateRenderWindow() {
    const stripW     = _stripW();
    const visibleLo  = _idxAtOffset(_trackOffset + stripW);
    const visibleHi  = _idxAtOffset(_trackOffset);
    const lo = Math.max(0, visibleLo - THUMB_BUFFER);
    const hi = Math.min(globalManifest.length - 1, visibleHi + THUMB_BUFFER);

    // Remove cells outside the new range
    for (let gi = _renderedLo; gi <= _renderedHi; gi++) {
      if (gi < lo || gi > hi) {
        const cell = _cellMap[gi];
        if (cell) { cell.remove(); delete _cellMap[gi]; }
      }
    }

    // Add cells inside the new range that aren't yet in the DOM
    for (let gi = lo; gi <= hi; gi++) {
      if (_cellMap[gi]) continue;
      const entry = globalManifest[gi];
      if (!entry) continue;

      const cell = document.createElement('div');
      cell.className = 'thumb-cell';
      // Position cell absolutely within the track at its natural slot
      cell.style.position = 'absolute';
      cell.style.left = (gi * THUMB_STEP) + 'px';

      const imgWrap = document.createElement('div');
      imgWrap.className = 'thumb-cell-img-wrap';
      const img = document.createElement('img');
      img.alt = '';
      imgWrap.appendChild(img);

      const label = document.createElement('div');
      label.className = 'thumb-cell-label';
      label.textContent = `${gi + 1}`;

      cell.appendChild(imgWrap);
      cell.appendChild(label);
      thumbTrack.appendChild(cell);

      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        if (_stripDidDrag) { _stripDidDrag = false; return; }
        navigateToGlobalIdx(gi);
        hideAll();
      });

      _cellMap[gi] = cell;
    }

    _renderedLo = lo;
    _renderedHi = hi;

    // Set track width to fit all possible thumbs
    thumbTrack.style.width = (globalManifest.length * THUMB_STEP) + 'px';
  }

  // Apply translateX to the track
  function _applyTrackOffset(offset) {
    _trackOffset = offset;
    thumbTrack.style.transform = `translateX(${offset}px)`;
    _updateRenderWindow();

    // Sync slider to whichever thumb is now centered
    const ci = _idxAtOffset(offset);
    if (ci !== stripCenterIdx) {
      stripCenterIdx = ci;
      if (!sliderDragging) {
        pageSliderInput.value = ci;
        pageSliderLabel.textContent = `${ci + 1} / ${globalManifest.length}`;
      }
    }
  }

  // ── LOAD THUMBS IN VIEW ──
  async function _loadVisibleThumbs(signal) {
    const stripW    = _stripW();
    const visibleLo = Math.max(0, _idxAtOffset(_trackOffset + stripW) - THUMB_BUFFER);
    const visibleHi = Math.min(globalManifest.length - 1, _idxAtOffset(_trackOffset) + THUMB_BUFFER);
    const center    = _idxAtOffset(_trackOffset);

    // Build center-outward order
    const ordered = [];
    ordered.push(center);
    for (let d = 1; d <= (visibleHi - visibleLo + THUMB_BUFFER); d++) {
      if (center + d <= visibleHi) ordered.push(center + d);
      if (center - d >= visibleLo) ordered.push(center - d);
    }

    // ── THUMBS: abortable fetch, center-outward ──
    const thumbPromises = ordered.map(gi => {
      if (signal.aborted) return;
      const entry = globalManifest[gi];
      if (!entry) return;
      const cell = _cellMap[gi];
      if (!cell) return;
      const img = cell.querySelector('img');
      if (!img || img.src) return; // already loaded
      return fetch(
        `/api/manga/${libraryId}/${mangaId}/thumb/${entry.chapterId}/${entry.localIdx}`,
        { signal }
      )
        .then(r => r.ok ? r.blob() : null)
        .then(blob => {
          if (!blob || signal.aborted) return;
          const url = URL.createObjectURL(blob);
          img.src = url;
          img.onload = () => URL.revokeObjectURL(url);
        })
        .catch(() => {}); // aborted or network error — silently ignore
    });

    // Wait for all thumbs to have their fetch initiated before starting full-res
    await Promise.allSettled(thumbPromises);
    if (signal.aborted) return;

    // ── FULL-RES PRELOAD: abortable fetch, center-outward ──
    for (const gi of ordered) {
      if (signal.aborted) return;
      const entry = globalManifest[gi];
      if (!entry || entry.loaded || entry.url) continue;
      ensureChapterUrls(entry.chapterId).then(urls => {
        if (signal.aborted) return;
        const url = urls[entry.localIdx] || '';
        if (!url) return;
        entry.url = url;
        return fetch(url, { signal })
          .then(r => r.ok ? r.blob() : null)
          .then(blob => {
            if (!blob || signal.aborted) return;
            // Blob is discarded — the browser now has it cached for when the user navigates there
          })
          .catch(() => {});
      }).catch(() => {});
    }
  }

  function _scheduleThumbLoad() {
    _cancelThumbLoading();
    _thumbDebounceTimer = setTimeout(() => {
      stripAbortCtrl = new AbortController();
      _loadVisibleThumbs(stripAbortCtrl.signal);
    }, 10);
  }

  // ── SNAP ON RELEASE ──
  function _snapToNearest() {
    const gi     = _idxAtOffset(_trackOffset);
    const target = _offsetForIdx(gi);
    _applyTrackOffset(_clampOffset(target));
    stripCenterIdx = gi;
    pageSliderInput.value = gi;
    pageSliderLabel.textContent = `${gi + 1} / ${globalManifest.length}`;
    _scheduleThumbLoad();
  }

  // ── PUBLIC: show strip at a given global index ──
  function buildThumbStrip(centerGlobalIdx) {
    _measureSliderVelocity(centerGlobalIdx);
    _cancelThumbLoading();

    stripCenterIdx = centerGlobalIdx;
    const offset   = _clampOffset(_offsetForIdx(centerGlobalIdx));
    _applyTrackOffset(offset);

    if (_sliderVelocity > VELOCITY_THRESHOLD) {
      _thumbDebounceTimer = setTimeout(() => {
        _sliderVelocity = 0;
        _scheduleThumbLoad();
      }, THUMB_DEBOUNCE_MS);
      return;
    }

    _scheduleThumbLoad();
  }

  function showThumbStrip(centerGlobalIdx) {
    stripVisible = true;
    thumbStrip.classList.add('active');
    buildThumbStrip(centerGlobalIdx);
    clearTimeout(barTimer);
  }

  function hideThumbStrip() {
    stripVisible    = false;
    _sliderVelocity = 0;
    _sliderLastTime = 0;
    thumbStrip.classList.remove('active');
    _cancelThumbLoading();
    // Clear DOM to free memory
    thumbTrack.innerHTML = '';
    _cellMap      = {};
    _renderedLo   = 0;
    _renderedHi   = -1;
  }

  // ── STRIP DRAG ──
  let stripDragActive  = false;
  let stripDragStartX  = 0;
  let stripDragStartOffset = 0; // track offset at drag start
  let stripDragMomentumV   = 0;
  let stripDragLastX       = 0;
  let stripDragLastTime    = 0;
  let stripMomentumRaf     = null;

  function _stopMomentum() {
    if (stripMomentumRaf) { cancelAnimationFrame(stripMomentumRaf); stripMomentumRaf = null; }
  }

  function _momentumLoop() {
    if (Math.abs(stripDragMomentumV) < 0.5) {
      stripDragMomentumV = 0;
      _snapToNearest();
      return;
    }
    stripDragMomentumV *= 0.88;
    _applyTrackOffset(_clampOffset(_trackOffset + stripDragMomentumV));
    stripMomentumRaf = requestAnimationFrame(_momentumLoop);
  }

  let _stripDidDrag = false;

  function _onStripDragStart(clientX) {
    _stopMomentum();
    _cancelThumbLoading();
    stripDragActive      = true;
    _stripDidDrag        = false;
    stripDragStartX      = clientX;
    stripDragStartOffset = _trackOffset;
    stripDragMomentumV   = 0;
    stripDragLastX       = clientX;
    stripDragLastTime    = performance.now();
  }

  function _onStripDragMove(clientX) {
    if (!stripDragActive) return;
    const dx = clientX - stripDragStartX;
    if (Math.abs(dx) > 4) _stripDidDrag = true; // only flag as drag after 4px movement
    const now    = performance.now();
    const dt     = now - stripDragLastTime || 1;
    stripDragMomentumV = (clientX - stripDragLastX) / dt * 16;
    stripDragLastX     = clientX;
    stripDragLastTime  = now;
    _applyTrackOffset(_clampOffset(stripDragStartOffset + dx));
  }

  function _onStripDragEnd() {
    if (!stripDragActive) return;
    stripDragActive = false;
    if (_stripDidDrag && Math.abs(stripDragMomentumV) > 2) {
      stripMomentumRaf = requestAnimationFrame(_momentumLoop);
    }
    _scheduleThumbLoad();
  }

  thumbStrip.addEventListener('mousedown', (e) => { _onStripDragStart(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove',     (e) => { _onStripDragMove(e.clientX); });
  window.addEventListener('mouseup',       ()  => { _onStripDragEnd(); });

  thumbStrip.addEventListener('touchstart', (e) => { _onStripDragStart(e.touches[0].clientX); }, { passive: true });
  thumbStrip.addEventListener('touchmove',  (e) => { e.preventDefault(); _onStripDragMove(e.touches[0].clientX); }, { passive: false });
  thumbStrip.addEventListener('touchend',   ()  => { _onStripDragEnd(); }, { passive: true });

  function updateProgressBar() {
    // Everything below is UI bookkeeping for the progress bar/chapter
    // label/page slider, which hideAll() hides ~3s after every tap — most
    // of a continuous BLE-scroller read happens with it hidden. Doing this
    // work while invisible was pure waste, and rebuildFragProgress() below
    // in particular (removes/creates one DOM element + 3 listeners per page
    // in the newly-entered chapter, on every chapter-boundary crossing) got
    // MORE frequent the faster you scrolled — showAll() forces one full
    // call on reveal so nothing here goes stale while hidden (2026-07-08).
    if (!barVisible) return;

    const midY = currentTrackingY();

    // Determine which chapter is currently visible
    let visibleChapterId = chapterId;
    if (readerSettings.mode === 'single-page') {
      visibleChapterId = (spManifest[spCurrentIdx] || {}).chapterId || chapterId;
    } else {
      for (const entry of manifest) {
        if (midY >= entry.globalY) visibleChapterId = entry.chapterId;
        else break;
      }
    }

    // Rebuild left bar if chapter changed
    if (visibleChapterId !== fragProgressChapterId) {
      rebuildFragProgress(visibleChapterId);
    }

    const segs = fragProgress.querySelectorAll('.frag-seg');

    // Find active page index within the visible chapter
    let activeIdx = 0;
    if (readerSettings.mode === 'single-page') {
      const spEntry = spManifest[spCurrentIdx];
      if (spEntry && spEntry.chapterId === visibleChapterId) {
        activeIdx = spEntry.localIdx;
      }
    } else {
      for (let i = 0; i < chapterManifest.length; i++) {
        const e = chapterManifest[i];
        if (midY >= e.globalY) {
          activeIdx = e.localIdx;
        } else {
          break;
        }
      }
    }
    segs.forEach((s, i) => s.classList.toggle('active', i <= activeIdx));

    // Update chapter dropdown label
    let visibleChapIdx = currentChapIdx;
    if (readerSettings.mode === 'single-page') {
      const spEntry = spManifest[spCurrentIdx];
      visibleChapIdx = spEntry ? chapterList.findIndex(c => c.id === spEntry.chapterId) : currentChapIdx;
      if (visibleChapIdx === -1) visibleChapIdx = currentChapIdx;
    } else {
      for (let i = 0; i < manifest.length; i++) {
        if (midY >= manifest[i].globalY) {
          const idx = chapterList.findIndex(c => c.id === manifest[i].chapterId);
          if (idx !== -1) visibleChapIdx = idx;
        } else break;
      }
    }
    if (visibleChapIdx !== activeChapDropdownIdx) {
      activeChapDropdownIdx = visibleChapIdx;
      const visibleChap = chapterList[visibleChapIdx];
      if (visibleChap) {
        bbChapLabel.textContent = visibleChap.name;
        bbChapMenu.querySelectorAll('.bb-chap-menu-item').forEach((item, i) => {
          item.classList.toggle('active', i === visibleChapIdx);
        });
        bbPrevChap.disabled = visibleChapIdx <= 0;
        bbNextChap.disabled = visibleChapIdx >= chapterList.length - 1;
      }
    }

    // Update left tooltip
    updatePinnedTooltips();

    // Update global page slider (only if user is not dragging it)
    if (!sliderDragging) {
      const globalIdx = getCurrentGlobalPageIdx();
      pageSliderInput.value = globalIdx;
      pageSliderLabel.textContent = `${globalIdx + 1} / ${globalManifest.length}`;
    }
  }

  function updatePinnedTooltips() {
    if (!barVisible) return;
    const leftSegs = fragProgress.querySelectorAll('.frag-seg');
    let leftActiveEl = null;
    leftSegs.forEach(s => { if (s.classList.contains('active')) leftActiveEl = s; });
    if (leftActiveEl) {
      const r = leftActiveEl.getBoundingClientRect();
      const idx = Array.from(leftSegs).indexOf(leftActiveEl);
      leftTooltip.textContent = `${idx + 1} / ${totalPages}`;
      leftTooltip.style.left      = (r.right + 14) + 'px';
      leftTooltip.style.top       = (r.top + r.height / 2) + 'px';
      leftTooltip.style.transform = 'translateY(-50%)';
      leftTooltip.classList.add('pinned');
    }
  }

  // ── BOTTOM BAR ──
  const bottombar     = document.getElementById('bottombar');
  const bbChapBtn     = document.getElementById('bbChapBtn');
  const bbChapLabel   = document.getElementById('bbChapLabel');
  const bbChapMenu    = document.getElementById('bbChapMenu');
  const bbPrevChap    = document.getElementById('bbPrevChap');
  const bbNextChap    = document.getElementById('bbNextChap');
  const bbZoomRange   = document.getElementById('bbZoomRange');
  const bbZoomValue   = document.getElementById('bbZoomValue');

  // Build chapter menu items (same order as chapterList)

    item.addEventListener('click', (e) => {

  // Set initial label to current chapter name

  // Scroll the active item into view when menu opens
  function openBbMenu() {
      bbChapMenu.classList.add('open');
      bbChapBtn.classList.add('open');

  // Prev / Next chapter navigation

    }
  });
  bbNextChap.addEventListener('click', (e) => {
    e.stopPropagation();

      // goToChapter() is a hard navigation (location.replace) -- it never
      // gives long-strip's scroll-crossing detection or single-page mode's
      // own spForward hook a chance to fire, so clicking straight to the
      // next chapter (instead of scrolling/flipping past the actual seam)
      // silently never marked the chapter being left as read, no matter how
      // much of it had actually been read. An explicit "next chapter" click
      // is as clear a "done with this one" signal as either of those, so it
      // marks completion the same way. saveReadingProgress's fetch is
      // keepalive, so it's safe to fire-and-forget right before navigating.
      saveReadingProgress(chapterId);

  // Zoom slider label update (no-op on layout for now)
  // ── STRIP WIDTH SLIDER ──
  function applyStripWidth(pct) {
    readerSettings.stripWidth = pct;
    const effectiveW = Math.round(viewW * pct / 100);
    // Resize readerInner, not #reader itself -- #reader stays permanently
    // full-bleed so the black letterbox area at zoomed-out widths is still
    // part of #reader's own scrollable/draggable bounds (bug 6 fix), not
    // empty space outside them. readerInner is a normal static block (not
    // position:fixed), so simple width + auto-margin centers it -- no
    // separate left/right inset math needed the way #reader's old
    // fixed-positioning required.
    readerInner.style.width  = pct + '%';
    readerInner.style.margin = '0 auto';
    bbZoomRange.value       = pct;
    bbZoomValue.textContent = pct + '%';

    let anchorEntry = manifest[0];
    for (const entry of manifest) {
      if (entry.globalY <= virtualY) anchorEntry = entry;
      else break;
    }
    const offsetIntoPage  = virtualY - anchorEntry.globalY;
    const anchorGlobalIdx = manifest.indexOf(anchorEntry);

    recomputeGeometry(readerSettings.padding, effectiveW);
    applyManifestToSlots();

    setVirtualY(manifest[anchorGlobalIdx].globalY + offsetIntoPage);
    prefetchAroundIndex(anchorGlobalIdx);
  }

  function updateZoomVisibility() {
    const isLong = readerSettings.mode === 'long-strip';
    bbZoomRange.style.display = isLong ? '' : 'none';
    bbZoomValue.style.display = isLong ? '' : 'none';
  }

  bbZoomRange.addEventListener('input', () => {
    applyStripWidth(Number(bbZoomRange.value));
    saveReaderSettings();
  });

  function updateStretchBtnVisibility() {
    updateZoomVisibility();
  }

  // ── SETTINGS PANEL ──
  const settingsPanel            = document.getElementById('settingsPanel');
  const bbSettingsBtn            = document.getElementById('bbSettingsBtn');
  const settingsModeLongStrip    = document.getElementById('settingsModeLongStrip');
  const settingsModeSingle       = document.getElementById('settingsModeSingle');
  const settingsLongStripOptions = document.getElementById('settingsLongStripOptions');
  const settingsSingleOptions    = document.getElementById('settingsSingleOptions');
  const settingsPaddingToggle    = document.getElementById('settingsPaddingToggle');
  const settingsDirLTR           = document.getElementById('settingsDirLTR');
  const settingsDirRTL           = document.getElementById('settingsDirRTL');

  function openSettingsPanel() {
    settingsPanel.classList.add('open');
    bbSettingsBtn.classList.add('active');
  }
  function closeSettingsPanel() {
    settingsPanel.classList.remove('open');
    bbSettingsBtn.classList.remove('active');
  }

  function syncSettingsUI() {
    const isLong = readerSettings.mode === 'long-strip';
    settingsModeLongStrip.classList.toggle('active', isLong);
    settingsModeSingle.classList.toggle('active', !isLong);
    settingsLongStripOptions.style.display = isLong ? '' : 'none';
    settingsSingleOptions.style.display    = isLong ? 'none' : '';
    settingsPaddingToggle.checked = !!readerSettings.padding;
    settingsDirLTR.classList.toggle('active', readerSettings.direction === 'ltr');
    settingsDirRTL.classList.toggle('active', readerSettings.direction === 'rtl');
    // Preload slider: shown for every source type. Was gated to compressed
    // sources only (isCompressed) from when this setting was introduced --
    // stale since the 2026-07-28 predecode fix unified loose and compressed
    // sources onto the same tier1/tier2/tier3 loading path (TIER1_RADIUS/
    // TIER2_RADIUS have never branched on source type), so loose-image manga
    // -- exactly the case that needs tuning most on a slow/high-latency
    // connection -- had no way to reach this control at all (2026-08-10).
    const preloadWrap = document.getElementById('settingsPreloadWrap');
    if (preloadWrap) preloadWrap.style.display = '';
    const r = readerSettings.preloadRadius ?? 7;
    document.getElementById('settingsPreloadValue').textContent = `±${r}`;
    document.getElementById('settingsPreloadRange').value = r;
    // PDF quality: only show for PDF sources
    const pdfQualityWrap = document.getElementById('settingsPdfQualityWrap');
    if (pdfQualityWrap) pdfQualityWrap.style.display = isPdf ? '' : 'none';

  bbSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.classList.contains('open') ? closeSettingsPanel() : openSettingsPanel();
  });

  // Close when clicking outside
  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== bbSettingsBtn) {
      closeSettingsPanel();
    }
  });

  // Prevent panel click from propagating to document (which would close it)
  settingsPanel.addEventListener('click', (e) => e.stopPropagation());

  // Mode buttons
  function applyMode(mode) {
    readerSettings.mode = mode;
    syncSettingsUI();
    updateStretchBtnVisibility();
    if (mode === 'long-strip') {
      activateLongStripMode();
    } else {
      activateSinglePageMode();
    }
    saveReaderSettings();
  }

  settingsModeLongStrip.addEventListener('click', () => applyMode('long-strip'));
  settingsModeSingle.addEventListener('click',    () => applyMode('single-page'));

  // Padding toggle
  settingsPaddingToggle.addEventListener('change', () => {
    readerSettings.padding = settingsPaddingToggle.checked;
    applyPaddingSetting();
    saveReaderSettings();
  });

  // Direction buttons
  settingsDirLTR.addEventListener('click', () => {
    readerSettings.direction = 'ltr';
    syncSettingsUI();
    saveReaderSettings();
  });
  settingsDirRTL.addEventListener('click', () => {
    readerSettings.direction = 'rtl';
    syncSettingsUI();
    saveReaderSettings();
  });

  document.getElementById('settingsPreloadRange').addEventListener('input', (e) => {
    applyPreloadRadius(Number(e.target.value));
    saveReaderSettings();
  });

  // ── PDF QUALITY ──

  function syncPdfQualityUI(val) {
    const pct = val / 2 * 100;
    const fill = document.getElementById('pdfQualityFill');
    if (fill) fill.style.width = pct + '%';
    document.getElementById('pdfQualityRange').value = val;
