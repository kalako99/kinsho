    const gi       = Math.round((centerPx - THUMB_W / 2) / THUMB_STEP);
    return Math.max(0, Math.min(globalManifest.length - 1, gi));
  }

  // ── RENDER WINDOW ──
  // Work out which cells should exist in the DOM given current offset,
  // add missing ones, remove ones that have gone out of range.
  function _updateRenderWindow() {
    const stripW     = _stripW();
    const visibleLo  = _idxAtOffset(_trackOffset + stripW);
    const visibleHi  = _idxAtOffset(_trackOffset);
    const lo = Math.max(0, visibleLo - THUMB_BUFFER);
    const hi = Math.min(globalManifest.length - 1, visibleHi + THUMB_BUFFER);

    // Remove cells outside the new range
    for (let gi = _renderedLo; gi <= _renderedHi; gi++) {
      if (gi < lo || gi > hi) {
        const cell = _cellMap[gi];
        if (cell) { cell.remove(); delete _cellMap[gi]; }
      }
    }

    // Add cells inside the new range that aren't yet in the DOM
    for (let gi = lo; gi <= hi; gi++) {
      if (_cellMap[gi]) continue;
      const entry = globalManifest[gi];
      if (!entry) continue;

      const cell = document.createElement('div');
      cell.className = 'thumb-cell';
      // Position cell absolutely within the track at its natural slot
      cell.style.position = 'absolute';
      cell.style.left = (gi * THUMB_STEP) + 'px';

      const imgWrap = document.createElement('div');
      imgWrap.className = 'thumb-cell-img-wrap';
      const img = document.createElement('img');
      img.alt = '';
      imgWrap.appendChild(img);

      const label = document.createElement('div');
      label.className = 'thumb-cell-label';
      label.textContent = `${gi + 1}`;

      cell.appendChild(imgWrap);
      cell.appendChild(label);
      thumbTrack.appendChild(cell);

      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        if (_stripDidDrag) { _stripDidDrag = false; return; }
        navigateToGlobalIdx(gi);
        hideAll();
      });

      _cellMap[gi] = cell;
    }

    _renderedLo = lo;
    _renderedHi = hi;

    // Set track width to fit all possible thumbs
    thumbTrack.style.width = (globalManifest.length * THUMB_STEP) + 'px';
  }

  // Apply translateX to the track
  function _applyTrackOffset(offset) {
    _trackOffset = offset;
    thumbTrack.style.transform = `translateX(${offset}px)`;
    _updateRenderWindow();

    // Sync slider to whichever thumb is now centered
    const ci = _idxAtOffset(offset);
    if (ci !== stripCenterIdx) {
      stripCenterIdx = ci;
      if (!sliderDragging) {
        pageSliderInput.value = ci;
        pageSliderLabel.textContent = `${ci + 1} / ${globalManifest.length}`;
      }
    }
  }

  // ── LOAD THUMBS IN VIEW ──
  async function _loadVisibleThumbs(signal) {
    const stripW    = _stripW();
    const visibleLo = Math.max(0, _idxAtOffset(_trackOffset + stripW) - THUMB_BUFFER);
    const visibleHi = Math.min(globalManifest.length - 1, _idxAtOffset(_trackOffset) + THUMB_BUFFER);
    const center    = _idxAtOffset(_trackOffset);

    // Build center-outward order
    const ordered = [];
    ordered.push(center);
    for (let d = 1; d <= (visibleHi - visibleLo + THUMB_BUFFER); d++) {
      if (center + d <= visibleHi) ordered.push(center + d);
      if (center - d >= visibleLo) ordered.push(center - d);
    }

    // ── THUMBS: abortable fetch, center-outward ──
    const thumbPromises = ordered.map(gi => {
      if (signal.aborted) return;
      const entry = globalManifest[gi];
      if (!entry) return;
      const cell = _cellMap[gi];
      if (!cell) return;
      const img = cell.querySelector('img');
      if (!img || img.src) return; // already loaded
      return fetch(
        `/api/manga/${libraryId}/${mangaId}/thumb/${entry.chapterId}/${entry.localIdx}`,
        { signal }
      )
        .then(r => r.ok ? r.blob() : null)
        .then(blob => {
          if (!blob || signal.aborted) return;
          const url = URL.createObjectURL(blob);
          img.src = url;
          img.onload = () => URL.revokeObjectURL(url);
        })
        .catch(() => {}); // aborted or network error — silently ignore
    });

    // Wait for all thumbs to have their fetch initiated before starting full-res
    await Promise.allSettled(thumbPromises);
    if (signal.aborted) return;

    // ── FULL-RES PRELOAD: abortable fetch, center-outward ──
    for (const gi of ordered) {
      if (signal.aborted) return;
      const entry = globalManifest[gi];
      if (!entry || entry.loaded || entry.url) continue;
      ensureChapterUrls(entry.chapterId).then(urls => {
        if (signal.aborted) return;
        const url = urls[entry.localIdx] || '';
        if (!url) return;
        entry.url = url;
        return fetch(url, { signal })
          .then(r => r.ok ? r.blob() : null)
          .then(blob => {
            if (!blob || signal.aborted) return;
            // Blob is discarded — the browser now has it cached for when the user navigates there
          })
          .catch(() => {});
      }).catch(() => {});
    }
  }

  function _scheduleThumbLoad() {
    _cancelThumbLoading();
    _thumbDebounceTimer = setTimeout(() => {
      stripAbortCtrl = new AbortController();
      _loadVisibleThumbs(stripAbortCtrl.signal);
    }, 10);
  }

  // ── SNAP ON RELEASE ──
  function _snapToNearest() {
    const gi     = _idxAtOffset(_trackOffset);
    const target = _offsetForIdx(gi);
    _applyTrackOffset(_clampOffset(target));
    stripCenterIdx = gi;
    pageSliderInput.value = gi;
    pageSliderLabel.textContent = `${gi + 1} / ${globalManifest.length}`;
    _scheduleThumbLoad();
  }

  // ── PUBLIC: show strip at a given global index ──
  function buildThumbStrip(centerGlobalIdx) {
    _measureSliderVelocity(centerGlobalIdx);
    _cancelThumbLoading();

    stripCenterIdx = centerGlobalIdx;
    const offset   = _clampOffset(_offsetForIdx(centerGlobalIdx));
    _applyTrackOffset(offset);

    if (_sliderVelocity > VELOCITY_THRESHOLD) {
      _thumbDebounceTimer = setTimeout(() => {
        _sliderVelocity = 0;
        _scheduleThumbLoad();
      }, THUMB_DEBOUNCE_MS);
      return;
    }

    _scheduleThumbLoad();
  }

  function showThumbStrip(centerGlobalIdx) {
    stripVisible = true;
    thumbStrip.classList.add('active');
    buildThumbStrip(centerGlobalIdx);
    clearTimeout(barTimer);
  }

  function hideThumbStrip() {
    stripVisible    = false;
    _sliderVelocity = 0;
    _sliderLastTime = 0;
    thumbStrip.classList.remove('active');
    _cancelThumbLoading();
    // Clear DOM to free memory
    thumbTrack.innerHTML = '';
    _cellMap      = {};
    _renderedLo   = 0;
    _renderedHi   = -1;
  }

  // ── STRIP DRAG ──
  let stripDragActive  = false;
  let stripDragStartX  = 0;
  let stripDragStartOffset = 0; // track offset at drag start
  let stripDragMomentumV   = 0;
  let stripDragLastX       = 0;
  let stripDragLastTime    = 0;
  let stripMomentumRaf     = null;

  function _stopMomentum() {
    if (stripMomentumRaf) { cancelAnimationFrame(stripMomentumRaf); stripMomentumRaf = null; }
  }

  function _momentumLoop() {
    if (Math.abs(stripDragMomentumV) < 0.5) {
      stripDragMomentumV = 0;
      _snapToNearest();
      return;
    }
    stripDragMomentumV *= 0.88;
    _applyTrackOffset(_clampOffset(_trackOffset + stripDragMomentumV));
    stripMomentumRaf = requestAnimationFrame(_momentumLoop);
  }

  let _stripDidDrag = false;

  function _onStripDragStart(clientX) {
    _stopMomentum();
    _cancelThumbLoading();
    stripDragActive      = true;
    _stripDidDrag        = false;
    stripDragStartX      = clientX;
    stripDragStartOffset = _trackOffset;
    stripDragMomentumV   = 0;
    stripDragLastX       = clientX;
    stripDragLastTime    = performance.now();
  }

  function _onStripDragMove(clientX) {
    if (!stripDragActive) return;
    const dx = clientX - stripDragStartX;
    if (Math.abs(dx) > 4) _stripDidDrag = true; // only flag as drag after 4px movement
    const now    = performance.now();
    const dt     = now - stripDragLastTime || 1;
    stripDragMomentumV = (clientX - stripDragLastX) / dt * 16;
    stripDragLastX     = clientX;
    stripDragLastTime  = now;
    _applyTrackOffset(_clampOffset(stripDragStartOffset + dx));
  }

  function _onStripDragEnd() {
    if (!stripDragActive) return;
    stripDragActive = false;
    if (_stripDidDrag && Math.abs(stripDragMomentumV) > 2) {
      stripMomentumRaf = requestAnimationFrame(_momentumLoop);
    }
    _scheduleThumbLoad();
  }

  thumbStrip.addEventListener('mousedown', (e) => { _onStripDragStart(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove',     (e) => { _onStripDragMove(e.clientX); });
  window.addEventListener('mouseup',       ()  => { _onStripDragEnd(); });

  thumbStrip.addEventListener('touchstart', (e) => { _onStripDragStart(e.touches[0].clientX); }, { passive: true });
  thumbStrip.addEventListener('touchmove',  (e) => { e.preventDefault(); _onStripDragMove(e.touches[0].clientX); }, { passive: false });
  thumbStrip.addEventListener('touchend',   ()  => { _onStripDragEnd(); }, { passive: true });

  function updateProgressBar() {
    // Everything below is UI bookkeeping for the progress bar/chapter
    // label/page slider, which hideAll() hides ~3s after every tap — most
    // of a continuous BLE-scroller read happens with it hidden. Doing this
    // work while invisible was pure waste, and rebuildFragProgress() below
    // in particular (removes/creates one DOM element + 3 listeners per page
    // in the newly-entered chapter, on every chapter-boundary crossing) got
    // MORE frequent the faster you scrolled — showAll() forces one full
    // call on reveal so nothing here goes stale while hidden (2026-07-08).
    if (!barVisible) return;

    const midY = currentTrackingY();

    // Determine which chapter is currently visible
    let visibleChapterId = chapterId;
    if (readerSettings.mode === 'single-page') {
      visibleChapterId = (spManifest[spCurrentIdx] || {}).chapterId || chapterId;
    } else {
      for (const entry of manifest) {
        if (midY >= entry.globalY) visibleChapterId = entry.chapterId;
        else break;
      }
    }

    // Rebuild left bar if chapter changed
    if (visibleChapterId !== fragProgressChapterId) {
      rebuildFragProgress(visibleChapterId);
    }

    const segs = fragProgress.querySelectorAll('.frag-seg');

    // Find active page index within the visible chapter
    let activeIdx = 0;
    if (readerSettings.mode === 'single-page') {
      const spEntry = spManifest[spCurrentIdx];
      if (spEntry && spEntry.chapterId === visibleChapterId) {
        activeIdx = spEntry.localIdx;
      }
    } else {
      for (let i = 0; i < chapterManifest.length; i++) {
        const e = chapterManifest[i];
        if (midY >= e.globalY) {
          activeIdx = e.localIdx;
        } else {
          break;
        }
      }
    }
    segs.forEach((s, i) => s.classList.toggle('active', i <= activeIdx));

    // Update chapter dropdown label
    let visibleChapIdx = currentChapIdx;
    if (readerSettings.mode === 'single-page') {
      const spEntry = spManifest[spCurrentIdx];
      visibleChapIdx = spEntry ? chapterList.findIndex(c => c.id === spEntry.chapterId) : currentChapIdx;
      if (visibleChapIdx === -1) visibleChapIdx = currentChapIdx;
    } else {
      for (let i = 0; i < manifest.length; i++) {
        if (midY >= manifest[i].globalY) {
          const idx = chapterList.findIndex(c => c.id === manifest[i].chapterId);
          if (idx !== -1) visibleChapIdx = idx;
        } else break;
      }
    }
    if (visibleChapIdx !== activeChapDropdownIdx) {
      activeChapDropdownIdx = visibleChapIdx;
      const visibleChap = chapterList[visibleChapIdx];
      if (visibleChap) {
        bbChapLabel.textContent = visibleChap.name;
        bbChapMenu.querySelectorAll('.bb-chap-menu-item').forEach((item, i) => {
          item.classList.toggle('active', i === visibleChapIdx);
        });
        bbPrevChap.disabled = visibleChapIdx <= 0;
        bbNextChap.disabled = visibleChapIdx >= chapterList.length - 1;
      }
    }

    // Update left tooltip
    updatePinnedTooltips();

    // Update global page slider (only if user is not dragging it)
    if (!sliderDragging) {
      const globalIdx = getCurrentGlobalPageIdx();
      pageSliderInput.value = globalIdx;
      pageSliderLabel.textContent = `${globalIdx + 1} / ${globalManifest.length}`;
    }
  }

  function updatePinnedTooltips() {
    if (!barVisible) return;
    const leftSegs = fragProgress.querySelectorAll('.frag-seg');
    let leftActiveEl = null;
    leftSegs.forEach(s => { if (s.classList.contains('active')) leftActiveEl = s; });
    if (leftActiveEl) {
      const r = leftActiveEl.getBoundingClientRect();
      const idx = Array.from(leftSegs).indexOf(leftActiveEl);
      leftTooltip.textContent = `${idx + 1} / ${totalPages}`;
      leftTooltip.style.left      = (r.right + 14) + 'px';
      leftTooltip.style.top       = (r.top + r.height / 2) + 'px';
      leftTooltip.style.transform = 'translateY(-50%)';
      leftTooltip.classList.add('pinned');
    }
  }

  // ── BOTTOM BAR ──
  const bottombar     = document.getElementById('bottombar');
  const bbChapBtn     = document.getElementById('bbChapBtn');
  const bbChapLabel   = document.getElementById('bbChapLabel');
  const bbChapMenu    = document.getElementById('bbChapMenu');
  const bbPrevChap    = document.getElementById('bbPrevChap');
  const bbNextChap    = document.getElementById('bbNextChap');
  const bbZoomRange   = document.getElementById('bbZoomRange');
  const bbZoomValue   = document.getElementById('bbZoomValue');

  // Build chapter menu items (same order as chapterList)
  for (let i = 0; i < chapterList.length; i++) {
    const ch   = chapterList[i];
    const item = document.createElement('div');
    item.className = 'bb-chap-menu-item' + (ch.id === chapterId ? ' active' : '');
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', ch.id === chapterId ? 'true' : 'false');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'bb-chap-name';
    nameSpan.textContent = ch.name;

    const numSpan = document.createElement('span');
    numSpan.className = 'bb-chap-num';
    numSpan.textContent = `${i + 1} / ${chapterList.length}`;

    item.appendChild(nameSpan);
    item.appendChild(numSpan);

    item.addEventListener('click', (e) => {
      e.stopPropagation();
      closeBbMenu();
      if (ch.id !== chapterId) {
        goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${ch.id}`);
      }
    });

    bbChapMenu.appendChild(item);
  }

  // Set initial label to current chapter name
  const currentChap = chapterList.find(c => c.id === chapterId);
  if (currentChap) bbChapLabel.textContent = currentChap.name;

  // Scroll the active item into view when menu opens
  function openBbMenu() {
      bbChapMenu.classList.add('open');
      bbChapBtn.classList.add('open');
      bbChapBtn.setAttribute('aria-expanded', 'true');
      fragProgress.style.opacity = '0';
      fragProgress.style.pointerEvents = 'none';
      pageSliderWrap.style.opacity = '0';
      pageSliderWrap.style.pointerEvents = 'none';
      const activeItem = bbChapMenu.querySelector('.bb-chap-menu-item.active');
      if (activeItem) {
          requestAnimationFrame(() => {
              activeItem.scrollIntoView({ block: 'nearest' });
          });
      }
  }

  function closeBbMenu() {
      bbChapMenu.classList.remove('open');
      bbChapBtn.classList.remove('open');
      bbChapBtn.setAttribute('aria-expanded', 'false');
      fragProgress.style.opacity = '';
      fragProgress.style.pointerEvents = '';
      pageSliderWrap.style.opacity = '';
      pageSliderWrap.style.pointerEvents = '';
  }

  // Prevent page scroll when wheeling inside the chapter menu
  bbChapMenu.addEventListener('wheel', (e) => {
    e.stopPropagation();
  }, { passive: true });

  bbChapBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    bbChapMenu.classList.contains('open') ? closeBbMenu() : openBbMenu();
  });

  // Close menu when clicking outside
  document.addEventListener('click', () => closeBbMenu());

  // Prev / Next chapter navigation
  const currentChapIdx = chapterList.findIndex(c => c.id === chapterId);
  let activeChapDropdownIdx = currentChapIdx;
  // (activeChapDropdownIdx_init is defined after updateProgressBar for reference parity)
  bbPrevChap.disabled = currentChapIdx <= 0;
  bbNextChap.disabled = currentChapIdx >= chapterList.length - 1;

  bbPrevChap.addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentChapIdx > 0) {
      goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${chapterList[currentChapIdx - 1].id}`);
    }
  });
  bbNextChap.addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentChapIdx < chapterList.length - 1) {
      goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${chapterList[currentChapIdx + 1].id}`);
    }
  });

  // Zoom slider label update (no-op on layout for now)
  // ── STRIP WIDTH SLIDER ──
  function applyStripWidth(pct) {
    readerSettings.stripWidth = pct;
    const effectiveW = Math.round(viewW * pct / 100);
    // Resize readerInner, not #reader itself -- #reader stays permanently
    // full-bleed so the black letterbox area at zoomed-out widths is still
    // part of #reader's own scrollable/draggable bounds (bug 6 fix), not
    // empty space outside them. readerInner is a normal static block (not
    // position:fixed), so simple width + auto-margin centers it -- no
    // separate left/right inset math needed the way #reader's old
    // fixed-positioning required.
    readerInner.style.width  = pct + '%';
    readerInner.style.margin = '0 auto';
    bbZoomRange.value       = pct;
    bbZoomValue.textContent = pct + '%';

    let anchorEntry = manifest[0];
    for (const entry of manifest) {
      if (entry.globalY <= virtualY) anchorEntry = entry;
      else break;
    }
    const offsetIntoPage  = virtualY - anchorEntry.globalY;
    const anchorGlobalIdx = manifest.indexOf(anchorEntry);

    recomputeGeometry(readerSettings.padding, effectiveW);
    applyManifestToSlots();

    setVirtualY(manifest[anchorGlobalIdx].globalY + offsetIntoPage);
    prefetchAroundIndex(anchorGlobalIdx);
  }

  function updateZoomVisibility() {
    const isLong = readerSettings.mode === 'long-strip';
    bbZoomRange.style.display = isLong ? '' : 'none';
    bbZoomValue.style.display = isLong ? '' : 'none';
  }

  bbZoomRange.addEventListener('input', () => {
    applyStripWidth(Number(bbZoomRange.value));
    saveReaderSettings();
  });

  function updateStretchBtnVisibility() {
    updateZoomVisibility();
  }

  // ── SETTINGS PANEL ──
  const settingsPanel            = document.getElementById('settingsPanel');
  const bbSettingsBtn            = document.getElementById('bbSettingsBtn');
  const settingsModeLongStrip    = document.getElementById('settingsModeLongStrip');
  const settingsModeSingle       = document.getElementById('settingsModeSingle');
  const settingsLongStripOptions = document.getElementById('settingsLongStripOptions');
  const settingsSingleOptions    = document.getElementById('settingsSingleOptions');
  const settingsPaddingToggle    = document.getElementById('settingsPaddingToggle');
  const settingsDirLTR           = document.getElementById('settingsDirLTR');
  const settingsDirRTL           = document.getElementById('settingsDirRTL');

  function openSettingsPanel() {
    settingsPanel.classList.add('open');
    bbSettingsBtn.classList.add('active');
  }
  function closeSettingsPanel() {
    settingsPanel.classList.remove('open');
    bbSettingsBtn.classList.remove('active');
  }

  function syncSettingsUI() {
    const isLong = readerSettings.mode === 'long-strip';
    settingsModeLongStrip.classList.toggle('active', isLong);
    settingsModeSingle.classList.toggle('active', !isLong);
    settingsLongStripOptions.style.display = isLong ? '' : 'none';
    settingsSingleOptions.style.display    = isLong ? 'none' : '';
    settingsPaddingToggle.checked = !!readerSettings.padding;
    settingsDirLTR.classList.toggle('active', readerSettings.direction === 'ltr');
    settingsDirRTL.classList.toggle('active', readerSettings.direction === 'rtl');
    // Preload slider: only show for compressed sources
    const preloadWrap = document.getElementById('settingsPreloadWrap');
    if (preloadWrap) preloadWrap.style.display = isCompressed ? '' : 'none';
    const r = readerSettings.preloadRadius ?? 7;
    document.getElementById('settingsPreloadValue').textContent = `±${r}`;
    document.getElementById('settingsPreloadRange').value = r;
    // PDF quality: only show for PDF sources
    const pdfQualityWrap = document.getElementById('settingsPdfQualityWrap');
    if (pdfQualityWrap) pdfQualityWrap.style.display = isPdf ? '' : 'none';
    syncPdfQualityUI(readerSettings.pdfScale ?? 1);
  }

  bbSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.classList.contains('open') ? closeSettingsPanel() : openSettingsPanel();
  });

  // Close when clicking outside
  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== bbSettingsBtn) {
      closeSettingsPanel();
    }
  });

  // Prevent panel click from propagating to document (which would close it)
  settingsPanel.addEventListener('click', (e) => e.stopPropagation());

  // Mode buttons
  function applyMode(mode) {
    readerSettings.mode = mode;
    syncSettingsUI();
    updateStretchBtnVisibility();
    if (mode === 'long-strip') {
      activateLongStripMode();
    } else {
      activateSinglePageMode();
    }
    saveReaderSettings();
  }

  settingsModeLongStrip.addEventListener('click', () => applyMode('long-strip'));
  settingsModeSingle.addEventListener('click',    () => applyMode('single-page'));

  // Padding toggle
  settingsPaddingToggle.addEventListener('change', () => {
    readerSettings.padding = settingsPaddingToggle.checked;
    applyPaddingSetting();
    saveReaderSettings();
  });

  // Direction buttons
  settingsDirLTR.addEventListener('click', () => {
    readerSettings.direction = 'ltr';
    syncSettingsUI();
    saveReaderSettings();
  });
  settingsDirRTL.addEventListener('click', () => {
    readerSettings.direction = 'rtl';
    syncSettingsUI();
    saveReaderSettings();
  });

  document.getElementById('settingsPreloadRange').addEventListener('input', (e) => {
    applyPreloadRadius(Number(e.target.value));
    saveReaderSettings();
  });

  // ── PDF QUALITY ──

  function syncPdfQualityUI(val) {
    const pct = val / 2 * 100;
    const fill = document.getElementById('pdfQualityFill');
    if (fill) fill.style.width = pct + '%';
    document.getElementById('pdfQualityRange').value = val;
    for (let i = 0; i <= 2; i++) {
      const lbl = document.getElementById(`pdfQLabel${i}`);
      if (lbl) lbl.classList.toggle('active', i === val);
    }
  }

  document.getElementById('pdfQualityRange').addEventListener('input', (e) => {
    const val = Number(e.target.value);
    readerSettings.pdfScale = val;
    syncPdfQualityUI(val);
    Object.keys(urlCache).forEach(k => delete urlCache[k]);
    for (let i = 0; i < manifest.length; i++) {
      manifest[i].url    = null;
      manifest[i].loaded = false;
    }
    applyManifestToSlots();
    saveReaderSettings();
  });

  // Clicking a label snaps slider to that value
  for (let i = 0; i <= 2; i++) {
    document.getElementById(`pdfQLabel${i}`).addEventListener('click', () => {
      readerSettings.pdfScale = i;
      syncPdfQualityUI(i);
      Object.keys(urlCache).forEach(k => delete urlCache[k]);
      for (let j = 0; j < manifest.length; j++) {
        manifest[j].url    = null;
        manifest[j].loaded = false;
      }
      applyManifestToSlots();
      saveReaderSettings();
    });
  }

  function applyPaddingSetting() {
    let anchorEntry = manifest[0];
    for (const entry of manifest) {
      if (entry.globalY <= virtualY) anchorEntry = entry;
      else break;
    }
    const offsetIntoPage  = virtualY - anchorEntry.globalY;
    const anchorGlobalIdx = manifest.indexOf(anchorEntry);

    recomputeGeometry(readerSettings.padding);
    applyManifestToSlots();

    setVirtualY(manifest[anchorGlobalIdx].globalY + offsetIntoPage);
  }

  // ── SINGLE PAGE MODE ──
  const singlePageView = document.getElementById('singlePageView');
  // A single persistent <img>, reassigned directly on each flip -- matches
  // long-strip mode's own slot images. Used to be two alternating elements
  // with a CSS slide-transition swapping which was foreground/background;
  // that machinery went through several rounds of bugs (stale-page flashes,
  // then a racing thumbnail fallback corrupting the swap state) without
  // ever converging, so it was removed in favor of the same simple
  // direct-src-assignment approach long-strip mode already uses safely.
  const spImage = document.getElementById('spImage');
  const spZoneLeft     = document.getElementById('spZoneLeft');
  const spZoneCenter   = document.getElementById('spZoneCenter');
  const spZoneRight    = document.getElementById('spZoneRight');

  // All pages flattened in order (same order as manifest)
  let spCurrentIdx = 0; // index into manifest for current chapter pages
  const spManifest = manifest.filter(e => e.chapterId === chapterId);
  let lastSeenChapterId = chapterId;
  // Guards the "reached the true end of the manga" completion save in
  // syncScrollPosition (long-strip mode) so it only fires once per page load.
  let finalChapterCompletionSaved = false;
  let bmEndToEnd = false;
  let bmEndToEndActive = false;
  let progressSaveTimer = null;
  let spProgressSaveTimer = null;


  const lastPagePopupEl = document.getElementById('lastPagePopup');
  let lastPagePopupTimer = null;
  function showLastPagePopup() {
    lastPagePopupEl.classList.add('show');
    clearTimeout(lastPagePopupTimer);
    lastPagePopupTimer = setTimeout(() => lastPagePopupEl.classList.remove('show'), 2000);
  }

  // _spAnimFrame itself is declared earlier, near loadEntryTier1 — see the
  // comment there for why.
  let _spPrefAbort   = null;
  let _spPrefTimer   = null;
  let _spVelLastIdx  = 0;
  let _spVelLastTime = 0;
  let _spVelocity    = 0;      // pages/second (EMA)
  let _spLastFlipDir = 0;      // 1 = forward, -1 = backward, 0 = unknown

  function _spMeasureVelocity(idx) {
    const now = performance.now();
    const dt  = (now - _spVelLastTime) / 1000;
    if (dt > 0 && dt < 2.0) {
      const instant = Math.abs(idx - _spVelLastIdx) / dt;
      _spVelocity   = _spVelocity * 0.5 + instant * 0.5;
    } else {
      _spVelocity = 0;
    }
    _spVelLastIdx  = idx;
    _spVelLastTime = now;
  }

  function _spSchedulePrefetch(globalIdx) {
    clearTimeout(_spPrefTimer);
    if (_spPrefAbort) { _spPrefAbort.abort(); _spPrefAbort = null; }

    // Velocity-scaled forward radius:
    //   0 pps  → 4 pages ahead (tier-1), 8 pages ahead (tier-2)
    //   5 pps  → ~9 pages ahead (tier-1), ~18 pages ahead (tier-2)
    //   10+ pps → 15 pages ahead (tier-1), 30 pages ahead (tier-2)
    const scaledT1 = Math.round(Math.min(15, 4 + _spVelocity * 1.1));
    const scaledT2 = scaledT1 * 2;

    // Travel direction: compare current global idx to previous
    const direction = globalIdx > (_spVelLastIdx < 0 ? globalIdx : globalIdx) ? 0
      : (spCurrentIdx > (_spVelLastIdx || spCurrentIdx) ? 1 : -1);
    // Derive direction from the EMA velocity sign isn't stored, so use idx vs previous spCurrentIdx.
    // _spVelLastIdx is updated by _spMeasureVelocity before _spSchedulePrefetch is called,
    // so at this point _spVelLastIdx === spCurrentIdx. Use the flip direction instead:
    const spDir = _spLastFlipDir || 0;

    const delay = Math.max(50, 300 - _spVelocity * 25);
    _spPrefTimer = setTimeout(() => {
      _spPrefAbort = new AbortController();
      // Temporarily widen radii for this prefetch pass.
      const savedT1 = TIER1_RADIUS;
      const savedT2 = TIER2_RADIUS;
      TIER1_RADIUS = scaledT1;
      TIER2_RADIUS = scaledT2;
      prefetchAroundIndex(globalIdx, _spPrefAbort.signal, spDir);
      TIER1_RADIUS = savedT1;
      TIER2_RADIUS = savedT2;
    }, delay);
  }

  function spGotoIdx(idx) {
    if (idx < 0) {
      if (currentChapIdx > 0) {
        const prevChap = chapterList[currentChapIdx - 1];
        const prevChapPages = manifest.filter(e => e.chapterId === prevChap.id);
        const lastPageIdx = prevChapPages.length > 0 ? prevChapPages[prevChapPages.length - 1].localIdx : 0;
        goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${prevChap.id}?page=${lastPageIdx}`);
      }
      return;
    }
    if (idx >= spManifest.length) {
      if (currentChapIdx < chapterList.length - 1) {
        goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${chapterList[currentChapIdx + 1].id}`);
      } else {
        showLastPagePopup();
      }
      return;
    }

    _spMeasureVelocity(idx);
    _spLastFlipDir = idx > spCurrentIdx ? 1 : -1;

    spCurrentIdx = idx;
    const entry  = spManifest[idx];
    const myFrame = ++_spAnimFrame;

    // Reassign the single persistent <img> directly -- same mechanism
    // long-strip mode's slot images already use safely. The browser's own
    // native behavior (keep showing the current pixels until the new src
    // finishes loading, then swap in place, atomically, with no
    // intermediate state) is exactly what's wanted here; there's no second
    // element or animation timing left to coordinate, so there's nothing
    // left that can show the wrong page's content.
    const applyEntry = () => {
      if (_spAnimFrame !== myFrame) return;
      spImage.onload = () => { entry.loaded = true; };
      spImage.src = entry.url;
    };

    if (entry.url) {
      applyEntry();
    } else {
      ensureChapterUrls(entry.chapterId).then(urls => {
        entry.url = urls[entry.localIdx] || '';
        if (entry.url && _spAnimFrame === myFrame) applyEntry();
      });
    }

    const globalIdx = manifest.indexOf(entry);
    if (globalIdx !== -1) _spSchedulePrefetch(globalIdx);

    updateProgressBar();

    // ── EAGER CHAPTER BOUNDARY PREFETCH ──
    // Within 5 pages of a chapter edge: load the first/last few pages of the
    // neighboring chapter so entry.url is populated before the user flips there.
    const SP_CHAP_PREFETCH_THRESHOLD = 5;
    const SP_CHAP_PREFETCH_PAGES     = 4; // how many boundary pages to fully load
    const _pagesFromEnd   = spManifest.length - 1 - idx;
    const _pagesFromStart = idx;
    if (_pagesFromEnd <= SP_CHAP_PREFETCH_THRESHOLD && currentChapIdx < chapterList.length - 1) {
      const nextChapId = chapterList[currentChapIdx + 1].id;
      const nextStart  = chapterStart[nextChapId];
      if (nextStart !== undefined) {
        const hi = Math.min(manifest.length - 1, nextStart + SP_CHAP_PREFETCH_PAGES - 1);
        for (let i = nextStart; i <= hi; i++) loadEntryTier1(manifest[i]);
      }
    }
    if (_pagesFromStart <= SP_CHAP_PREFETCH_THRESHOLD && currentChapIdx > 0) {
      const prevChapId = chapterList[currentChapIdx - 1].id;
      const prevStart  = chapterStart[prevChapId];
      if (prevStart !== undefined) {
        const chLen = manifest.filter(e => e.chapterId === prevChapId).length;
        const lo    = Math.max(prevStart, prevStart + chLen - SP_CHAP_PREFETCH_PAGES);
        for (let i = lo; i < prevStart + chLen; i++) loadEntryTier1(manifest[i]);
      }
    }

    clearTimeout(spProgressSaveTimer);
    spProgressSaveTimer = setTimeout(() => {
      spProgressSaveTimer = null;
      saveReadingProgress();
    }, 800);
  }

  function spForward()  { spGotoIdx(spCurrentIdx + 1); }
  function spBackward() { spGotoIdx(spCurrentIdx - 1); }
  function spNext() { readerSettings.direction === 'ltr' ? spForward()  : spBackward(); }
  // ── SINGLE PAGE DRAG / SWIPE ──
  // Mouse drag and touch swipe to change pages in single-page mode.
  // A move of > SP_DRAG_THRESHOLD px commits the flip; releasing before
  // that threshold counts as a tap and is handled by the zone click listeners.
  const SP_DRAG_THRESHOLD = 50; // px to commit a page flip
  let _spDragActive   = false;
  let _spDragStartX   = 0;
  let _spDragMoved    = false;

  function _spDragStart(clientX) {
    if (readerSettings.mode !== 'single-page') return;
    _spDragActive = true;
    _spDragMoved  = false;
    _spDragStartX = clientX;
  }

  function _spDragMove(clientX) {
    if (!_spDragActive) return;
    if (Math.abs(clientX - _spDragStartX) > 8) _spDragMoved = true;
  }

  function _spDragEnd(clientX) {
    if (!_spDragActive) return;
    _spDragActive = false;
    if (!_spDragMoved) return; // treat as tap — let click listeners handle it
    const dx = clientX - _spDragStartX;
    if (Math.abs(dx) < SP_DRAG_THRESHOLD) return; // not enough movement
    // Swipe left (dx < 0) → go forward in LTR, backward in RTL
    if (dx < 0) spNext(); else spPrev();
  }

  // Mouse events on the single-page view
  singlePageView.addEventListener('mousedown', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    _spDragStart(e.clientX);
  });
  window.addEventListener('mousemove', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    _spDragMove(e.clientX);
  });
  window.addEventListener('mouseup', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    const wasMoved = _spDragMoved;
    _spDragEnd(e.clientX);
    // If it was a real drag, stop the event from firing the zone click listeners
    if (wasMoved) e.stopImmediatePropagation();
  });

  // Touch events on the single-page view
  singlePageView.addEventListener('touchstart', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    _spDragStart(e.touches[0].clientX);
  }, { passive: true });
  singlePageView.addEventListener('touchmove', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    _spDragMove(e.touches[0].clientX);
    if (_spDragMoved) e.preventDefault(); // prevent page pan while swiping
  }, { passive: false });
  singlePageView.addEventListener('touchend', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    const clientX = e.changedTouches[0].clientX;
    const wasMoved = _spDragMoved;
    _spDragEnd(clientX);
    // Suppress the synthetic click that would follow if this was a real swipe
    if (wasMoved && Math.abs(clientX - _spDragStartX) >= SP_DRAG_THRESHOLD) {
      e.preventDefault();
    }
  }, { passive: false });
  function spPrev() { readerSettings.direction === 'ltr' ? spBackward() : spForward();  }

  spZoneCenter.addEventListener('click', (e) => {
    e.stopPropagation();
    barVisible ? hideAll() : showAll();
  });
  spZoneLeft.addEventListener('click', (e) => {
    e.stopPropagation();
    // Physical left = backward in LTR, forward in RTL
    readerSettings.direction === 'ltr' ? spBackward() : spForward();
  });
  spZoneRight.addEventListener('click', (e) => {
    e.stopPropagation();
    // Physical right = forward in LTR, backward in RTL
    readerSettings.direction === 'ltr' ? spForward() : spBackward();
  });

  // Keyboard / controller arrow navigation (works in both modes)
  document.addEventListener('keydown', (e) => {
    if (readerSettings.mode !== 'single-page') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      readerSettings.direction === 'ltr' ? spNext() : spPrev();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      readerSettings.direction === 'ltr' ? spPrev() : spNext();
    }
  });

  function activateSinglePageMode() {
    reader.style.display = 'none';
    singlePageView.classList.add('active');
    // Find which page corresponds to current virtualY position
    let startIdx = 0;
    for (let i = 0; i < spManifest.length; i++) {
      if (spManifest[i].globalY <= virtualY) startIdx = i;
      else break;
    }
    spGotoIdx(startIdx);
  }

  function activateLongStripMode() {
    reader.style.display = '';
    singlePageView.classList.remove('active');
    // Restore virtualY to the current single page position
    const entry = spManifest[spCurrentIdx];
    if (entry) setVirtualY(entry.globalY);
    else setVirtualY(virtualY);
  }

  // ── APPLY INITIAL SETTINGS ──
  syncSettingsUI();
  updateStretchBtnVisibility();
  applyStripWidth(readerSettings.stripWidth ?? 100);
  applyPreloadRadius(readerSettings.preloadRadius ?? 7);

  // ── INITIAL PREFETCH ──
  {
    const startGlobalIdx = startIdx !== undefined
      ? Math.min(startIdx + startPage, manifest.length - 1)
      : 0;
    prefetchAroundIndex(startGlobalIdx);
  }

  if (readerSettings.mode === 'single-page') {
    // Wait for the opening chapter URL batch before showing the first page,
    // so spGotoIdx always finds entry.url populated and never hits the thumb fallback.
    ensureChapterUrls(chapterId).then(() => activateSinglePageMode());
  }

  // ── KINSHO BLE SCROLLER ──
  // window.KinshoBLE only exists inside the Android app (native bridge from
  // kinsho-android's MainActivity.java/KinshoBleBridge.java) — absent on
  // desktop/browser, so this entire block is a no-op there. See
  // kinsho-android/CLAUDE.md for the full plan (M0-M2 already verified
  // working end to end; this is M3).
  //
  // There is deliberately only a Connect/Disconnect pair here, not a list of
  // discovered devices: the native side already scans filtered to exactly
  // the Scroller-HD's custom GATT service UUID and connects to the first
  // match, so there is nothing else for a picker to distinguish between.
  {
    const scrollerBtn           = document.getElementById('scrollerBtn');
    const scrollerDot           = document.getElementById('scrollerDot');
    const scrollerPanel         = document.getElementById('scrollerPanel');
    const scrollerStatusText    = document.getElementById('scrollerStatusText');
    const scrollerConnectBtn    = document.getElementById('scrollerConnectBtn');
    const scrollerDisconnectBtn = document.getElementById('scrollerDisconnectBtn');

    // ~100px/notch matches the desktop browser's feel; revisit only if this
    // fixed value proves wrong in practice (per the plan — not a settings
    // control yet).
    const KINSHO_PX_PER_NOTCH = 100;
    // Matches RESOLUTION_MULTIPLIER in scroller_hd.ino — the firmware sends
    // rate in 1/120-notch units/sec.
    const KINSHO_UNITS_PER_NOTCH = 120;

    const KINSHO_ERROR_MESSAGES = {
      bluetooth_off:            'Bluetooth is off',
      ble_unsupported:          'BLE not supported on this device',
      permission_denied:        'Bluetooth permission denied',
      service_not_found:        'Scroller service not found',
      service_discovery_failed: 'Could not read device services',
      not_found:                'Scroller not found',
    };

    // M4: remembers that a connection has been made before, so the reader
    // can silently reconnect on each new chapter open instead of making the
    // user tap Connect every time — same mental model as a Bluetooth
    // headphone reconnecting automatically once paired. Set on any
    // successful connection (auto or manual); cleared only by an explicit
    // Disconnect tap, which is treated as "stop trying for now".
    const KINSHO_AUTOCONNECT_KEY = 'kinshoAutoConnectScroller';

    let kinshoRate         = 0;  // signed, 1/120-notch units/sec — latest value from the device
    let kinshoLastRateTime = 0;  // performance.now() of the last notification received
    let kinshoScrollPos    = null;  // fractional mirror of reader.scrollTop while kinsho is actively driving it; null when idle

    function scrollerSetStatus(cssClass, text) {
      scrollerStatusText.className = 'scroller-status' + (cssClass ? ' ' + cssClass : '');
      scrollerStatusText.textContent = text;
      scrollerDot.className = 'scroller-dot' + (cssClass ? ' ' + cssClass : '');
    }

    // Default true: the feature is hidden unless the user has explicitly
    // turned this off in Settings — most viewers of a shared server don't
    // own the Scroller-HD hardware.
    const kinshoHideBleScroller = adminData.hide_ble_scroller !== false;

    if (window.KinshoBLE && !kinshoHideBleScroller) {
      scrollerBtn.style.display = '';

      window.__kinshoBleOnState = (state) => {
        if (state === 'scanning') {
          scrollerSetStatus('scanning', 'Scanning…');
          scrollerConnectBtn.style.display = 'none';
          scrollerDisconnectBtn.style.display = '';
        } else if (state === 'connected') {
          scrollerSetStatus('connected', 'Connected');
          scrollerConnectBtn.style.display = 'none';
          scrollerDisconnectBtn.style.display = '';
          localStorage.setItem(KINSHO_AUTOCONNECT_KEY, '1');
        } else if (state === 'disconnected') {
          scrollerSetStatus('', 'Not connected');
          scrollerConnectBtn.style.display = '';
          scrollerDisconnectBtn.style.display = 'none';
          kinshoRate = 0;
        } else if (state.startsWith('error:')) {
          const reason = state.slice(6);
          scrollerSetStatus('error', KINSHO_ERROR_MESSAGES[reason] || ('Error: ' + reason));
          scrollerConnectBtn.style.display = '';
          scrollerDisconnectBtn.style.display = 'none';
          kinshoRate = 0;
        }
      };

      window.__kinshoBleOnRate = (rate) => {
        kinshoRate = rate;
        kinshoLastRateTime = performance.now();
      };

      scrollerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        scrollerPanel.classList.toggle('open');
      });
      scrollerPanel.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', (e) => {
        if (!scrollerPanel.contains(e.target) && e.target !== scrollerBtn) {
          scrollerPanel.classList.remove('open');
        }
      });
      scrollerConnectBtn.addEventListener('click', () => window.KinshoBLE.connect());
      scrollerDisconnectBtn.addEventListener('click', () => {
        // An explicit Disconnect tap means "stop trying for now" — unlike a
        // dropped link (also reported as 'disconnected' above), which must
        // NOT clear the preference or the scroller would never auto-rejoin
        // after briefly going out of range.
        localStorage.removeItem(KINSHO_AUTOCONNECT_KEY);
        window.KinshoBLE.disconnect();
      });

      // M4: the native BLE connection is owned by MainActivity, not the
      // WebView's JS context, so it survives the full-page reload each
      // chapter navigation does (goToChapter() uses location.replace) —
      // check the already-connected state first rather than reconnecting
      // from scratch. Otherwise, silently reconnect if the user has
      // connected before and hasn't explicitly disconnected since; the
      // popup stays closed throughout, so this only ever moves the small
      // status dot, never pops anything open uninvited.
      if (window.KinshoBLE.isConnected()) {
        scrollerSetStatus('connected', 'Connected');
        scrollerConnectBtn.style.display = 'none';
        scrollerDisconnectBtn.style.display = '';
      } else if (localStorage.getItem(KINSHO_AUTOCONNECT_KEY) === '1') {
        window.KinshoBLE.connect();
      }

      // Velocity-driven scroll loop: converts the latest rate into a
      // per-frame pixel delta and nudges reader.scrollTop directly, which
      // fires the SAME native 'scroll' event the existing conveyor-belt
      // system already listens for (syncScrollPosition/recenterConveyor) —
      // no separate integration path needed; this reads to the rest of the
      // reader exactly like a user physically scrolling.
      //
      // Displayed velocity actually used for scrolling — BLE notifications
      // arrive in discrete ~50ms steps, sometimes irregularly (Android's
      // main thread can be busy decoding/laying out scrolled-in images
      // right when a notification needs marshaling onto it), so jumping
      // straight to each newly received rate reads as choppy. Ramps toward
      // the latest rate at a bounded, CONSTANT acceleration instead of
      // snapping to it or exponentially chasing it — a fixed rate of
      // change per second regardless of how big the jump is, so continuous
      // slider movement (repeatedly re-targeting a new speed) still
      // produces one smooth, predictable curve rather than a series of
      // kinks. See CLAUDE.md's scroller tuning table for what to adjust if
      // this still isn't smooth enough, or feels laggy to respond.
      let kinshoDisplayRate = 0;
      // notches/sec² — how fast the displayed speed can ramp up/down. kinshoRate/
      // kinshoDisplayRate are in raw 1/120-notch units (KINSHO_UNITS_PER_NOTCH), so
      // this gets multiplied by that factor below before comparing against them —
      // omitting that scaling was a real bug (2026-07-08): it made maxChange 120x
      // smaller than intended, so ramping from 0 to boost max (25 notches/sec = 3000
      // raw units) took ~50s instead of the ~0.2s this value now targets. That's what
      // read as "unresponsive, keeps drifting long after returning to center."
      const KINSHO_MAX_ACCEL = 125;

      let kinshoLastFrameTime = performance.now();
      function kinshoScrollLoop(now) {
        const dt = Math.min((now - kinshoLastFrameTime) / 1000, 0.1); // clamp for tab-switch/stalls
        kinshoLastFrameTime = now;

        // Silence watchdog: a dropped BLE link must not leave the page
        // drifting forever on the last rate it heard.
        if (kinshoRate !== 0 && now - kinshoLastRateTime > 1000) {
          kinshoRate = 0;
        }

        // Constant-acceleration ramp toward the target rate (not a
        // percentage-of-gap exponential chase) — also gives a real BLE
        // disconnect (kinshoRate forced to 0 above) a smooth, bounded-time
        // decel to a stop instead of an abrupt freeze.
        const rateDiff  = kinshoRate - kinshoDisplayRate;
        const maxChange = KINSHO_MAX_ACCEL * KINSHO_UNITS_PER_NOTCH * dt;
        if (Math.abs(rateDiff) <= maxChange) {
          kinshoDisplayRate = kinshoRate;
        } else {
          kinshoDisplayRate += Math.sign(rateDiff) * maxChange;
        }

        if (kinshoDisplayRate !== 0 && readerSettings.mode === 'long-strip') {
          // Re-sync from the DOM's actual position whenever resuming after
          // an idle spell, AND whenever something else has moved
          // reader.scrollTop out from under us since our last write here
          // (the conveyor-belt recenter logic can reposition the window
          // and adjust scrollTop mid-continuous-scroll — a plain rounding
          // difference from our own last write is at most ~1px, so
          // anything bigger than that is an external change to adopt, not
          // fight by jumping back to our own stale tracked value next frame).
          if (kinshoScrollPos === null || Math.abs(reader.scrollTop - kinshoScrollPos) > 3) {
            kinshoScrollPos = reader.scrollTop;
          }
          const pxPerSec = (kinshoDisplayRate / KINSHO_UNITS_PER_NOTCH) * KINSHO_PX_PER_NOTCH;
          kinshoScrollPos += pxPerSec * dt;
          // A fractional assignment here (not whole-pixel accumulation) is
          // what makes slow scrolling glide instead of stutter — at low
          // rates the old whole-pixel-only approach could take ~2 seconds
          // to accumulate a single displayable pixel, reading as a stop of
          // motion.
          reader.scrollTop = kinshoScrollPos;
        } else {
          // Not scrolling (dead zone) or not in long-strip mode — drop the
          // tracked position so the next active frame re-syncs fresh.
          kinshoScrollPos = null;
        }

        requestAnimationFrame(kinshoScrollLoop);
      }
      requestAnimationFrame(kinshoScrollLoop);
    }
  }

  // ── READING PROGRESS TRACKING ──

  function getVisibleChapterId() {
    if (readerSettings.mode === 'single-page') {
      return (spManifest[spCurrentIdx] || {}).chapterId || chapterId;
    }
    const midY = currentTrackingY();
    let visibleChapterId = chapterId;
    for (const entry of manifest) {
      if (midY >= entry.globalY) visibleChapterId = entry.chapterId;
      else break;
    }
    return visibleChapterId;
  }

  async function saveReadingProgress(completedChapterId = null) {
    const currentPage      = getCurrentPageIdx();
    const visibleChapterId = getVisibleChapterId();
    await fetch(apiUrl('/api/reading/progress'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        library_id:           libraryId,
        manga_id:             mangaId,
        chapter_id:           visibleChapterId,
        page:                 currentPage,
        completed_chapter_id: completedChapterId,
      }),
    });
  }

  function getCurrentPageIdx() {
    if (readerSettings.mode === 'single-page') {
      return (spManifest[spCurrentIdx] || {}).localIdx || 0;
    }
    const midY = currentTrackingY();
    let idx = 0;
    for (let i = 0; i < manifest.length; i++) {
      const e = manifest[i];
      if (midY >= e.globalY) idx = e.localIdx;
      else break;
    }
    return idx;
  }

  function checkChapterCompletion() {
    if (readerSettings.mode !== 'long-strip') return;
    const midY = currentTrackingY();

    let visibleChapterId = chapterId;
    for (const entry of manifest) {
      if (midY >= entry.globalY) visibleChapterId = entry.chapterId;
      else break;
    }

    if (visibleChapterId !== lastSeenChapterId) {
      const newChapEntries = manifest.filter(e => e.chapterId === visibleChapterId);
      if (newChapEntries.length >= 2) {
        if (virtualY >= newChapEntries[1].globalY) {
          saveReadingProgress(lastSeenChapterId);
          lastSeenChapterId = visibleChapterId;
          return;
        }
      } else {
        saveReadingProgress(lastSeenChapterId);
        lastSeenChapterId = visibleChapterId;
        return;
      }
    }
  }

  function scheduleProgressSave() {
    checkChapterCompletion();
    if (bmEndToEndActive) checkEndToEnd();
    if (progressSaveTimer) return;
    progressSaveTimer = setTimeout(() => {
      progressSaveTimer = null;
      saveReadingProgress();
    }, 2000);
  }

  // Skip initial save when resuming from a saved page — the saved state is already correct
  const _resumePage = new URLSearchParams(window.location.search).get('page');
  if (!_resumePage || _resumePage === '0') {
    saveReadingProgress();
  }
  // ── BOOKMARK SYSTEM ──

  let bookmarks = [];

  // ── HELPERS ──

  function getCurrentPosition() {
    const cid = getVisibleChapterId();
    const chapIdx = chapterList.findIndex(c => c.id === cid);
    let pageIdx = 0;
    if (readerSettings.mode === 'single-page') {
      pageIdx = (spManifest[spCurrentIdx] || {}).localIdx || 0;
    } else {
      const midY = currentTrackingY();
      for (const e of manifest) {
        if (e.chapterId === cid && midY >= e.globalY) pageIdx = e.localIdx;
      }
    }
    return { chapterId: cid, chapterIdx: chapIdx, pageIdx };
  }

  function positionBefore(a, b) {
    // Returns true if position a is strictly before position b
    if (a.chapterIdx !== b.chapterIdx) return a.chapterIdx < b.chapterIdx;
    return a.pageIdx < b.pageIdx;
  }

  function positionEqual(a, b) {
    return a.chapterIdx === b.chapterIdx && a.pageIdx === b.pageIdx;
  }

  function chapterName(cid) {
    const ch = chapterList.find(c => c.id === cid);
    return ch ? ch.name : cid;
  }

  function bmPositionLabel(pos) {
    return `Ch. ${chapterName(pos.chapterId)} — Page ${pos.pageIdx + 1}`;
  }

  // ── LOAD / SAVE ──

  async function loadBookmarks() {
    try {
      const res = await fetch(apiUrl(`/api/manga/${libraryId}/${mangaId}/bookmarks`));
      const data = await res.json();
      bookmarks = data.bookmarks || [];
    } catch(e) {
      bookmarks = [];
    }
  }

  async function persistBookmarks() {
    await fetch(apiUrl(`/api/manga/${libraryId}/${mangaId}/bookmarks`), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookmarks }),
    });
  }

  // ── SORT bookmarks by start position (chapter then page) ──
  function sortBookmarks() {
    bookmarks.sort((a, b) => {
      if (a.start.chapterIdx !== b.start.chapterIdx) return a.start.chapterIdx - b.start.chapterIdx;
      return a.start.pageIdx - b.start.pageIdx;
    });
  }

  // ── AUTO-NUMBERING ──
  // Strip trailing number suffix (e.g. "Luffy fights 03" → "Luffy fights")
  function bmBaseName(name) {
    return name.replace(/\s+\d+$/, '').trim();
  }

  function renumberGroup(baseName) {
    // Find all bookmarks with this base name, in sorted order, and assign 01, 02, …
    const group = bookmarks.filter(b => bmBaseName(b.name) === baseName);
    if (group.length < 2) {
      // Only one — strip the number suffix if it crept in
      if (group.length === 1 && group[0].name !== baseName) {
        group[0].name = baseName;
      }
      return;
    }
    // Sort by position
    group.sort((a, b) => {
      if (a.start.chapterIdx !== b.start.chapterIdx) return a.start.chapterIdx - b.start.chapterIdx;
      return a.start.pageIdx - b.start.pageIdx;
    });
    group.forEach((b, i) => {
      b.name = `${baseName} ${String(i + 1).padStart(2, '0')}`;
    });
  }

  // ── TOAST ──
  let bmToastTimer = null;
  const bmToastEl = document.getElementById('bmToast');
  function showToast(msg) {
    bmToastEl.textContent = msg;
    bmToastEl.classList.add('show');
    clearTimeout(bmToastTimer);
    bmToastTimer = setTimeout(() => bmToastEl.classList.remove('show'), 2500);
  }

  // ── MODAL HELPERS ──
  const bmModalOverlay = document.getElementById('bmModalOverlay');
  const bmModalTitle   = document.getElementById('bmModalTitle');
  const bmModalBody    = document.getElementById('bmModalBody');
  const bmModalActions = document.getElementById('bmModalActions');

  function openModal(title, bodyFn, actionsFn) {
    bmModalTitle.textContent = title;
    bmModalBody.innerHTML = '';
    bmModalActions.innerHTML = '';
    bodyFn(bmModalBody);
    if (actionsFn) actionsFn(bmModalActions);
    bmModalOverlay.style.display = 'flex';
  }

  function closeModal() {
    bmModalOverlay.style.display = 'none';
  }

  bmModalOverlay.addEventListener('click', (e) => {
    if (e.target === bmModalOverlay) closeModal();
  });

  // ── BOOKMARK PANEL ──
  const bookmarkPanel  = document.getElementById('bookmarkPanel');
  const bbBookmarkBtn  = document.getElementById('bbBookmarkBtn');
  const bmAddBtn       = document.getElementById('bmAddBtn');
  const bmCloseBtn     = document.getElementById('bmCloseBtn');
  const bmListBtn      = document.getElementById('bmListBtn');

  function openBookmarkPanel() {
    bookmarkPanel.classList.add('open');
    bbBookmarkBtn.classList.add('active');
    closeSettingsPanel();
  }
  function closeBookmarkPanel() {
    bookmarkPanel.classList.remove('open');
    bbBookmarkBtn.classList.remove('active');
  }

  bbBookmarkBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    bookmarkPanel.classList.contains('open') ? closeBookmarkPanel() : openBookmarkPanel();
  });
  bookmarkPanel.addEventListener('click', (e) => e.stopPropagation());

  // Close bookmark panel when clicking outside
  document.addEventListener('click', (e) => {
    if (!bookmarkPanel.contains(e.target) && e.target !== bbBookmarkBtn) {
      closeBookmarkPanel();
    }
  });

  // Also close bookmark panel in hideAll
  const _origHideAll = hideAll;
  // Patch hideAll to also close bookmark panel and modal
  // (we extend rather than replace since hideAll is defined above)
  const _bmHideAllPatch = () => {
    closeBookmarkPanel();
  };
  // Hook into the existing barTimer timeout path by overriding showAll's timer
  // Instead, we listen on the existing barTimer callback indirectly by wrapping hideAll reference.
  // The cleanest approach: patch the function reference used by the timer.
  // Since hideAll is a plain function (not on an object), we shadow it by reassigning.
  // However JS closures already captured it, so we extend via event instead:
  document.addEventListener('_hideAll', () => closeBookmarkPanel());

  // ── ADD BOOKMARK ──
  bmAddBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeBookmarkPanel();
    openModal('Add Bookmark', (body) => {
      const hint = document.createElement('div');
      hint.className = 'bm-modal-hint';
      const pos = getCurrentPosition();
      hint.textContent = `Position: ${bmPositionLabel(pos)}`;
      body.appendChild(hint);

      const input = document.createElement('input');
      input.className = 'bm-modal-input';
      input.type = 'text';
      input.placeholder = 'Bookmark name (leave empty for auto-name)';
      body.appendChild(input);
      setTimeout(() => input.focus(), 50);
    }, (actions) => {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'bm-btn bm-btn-secondary';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', closeModal);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'bm-btn bm-btn-primary';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', () => {
        const input = bmModalBody.querySelector('.bm-modal-input');
        let name = input ? input.value.trim() : '';
        const pos = getCurrentPosition();

        if (!name) {
          // Auto-name: "Bookmark N"
          name = `Bookmark ${bookmarks.length + 1}`;
        }

        const baseName = bmBaseName(name);
        const existingGroup = bookmarks.filter(b => bmBaseName(b.name) === baseName);

        bookmarks.push({ name, start: pos, end: null, id: Date.now() });
        sortBookmarks();

        if (existingGroup.length > 0) {
          // Group now has 2+ members — renumber all
          renumberGroup(baseName);
        }

        persistBookmarks();
        closeModal();
        showToast('Bookmark saved');
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
    });
  });

  // ── CLOSE BOOKMARK ──
  bmCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeBookmarkPanel();
    showCloseBookmarkModal();
  });

  function showCloseBookmarkModal() {
    openModal('Close Bookmark', (body) => {
      const pos = getCurrentPosition();
      const hint = document.createElement('div');
      hint.className = 'bm-modal-hint';
      hint.textContent = `Close at: ${bmPositionLabel(pos)}`;
      hint.style.marginBottom = '8px';
      body.appendChild(hint);

      if (bookmarks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'bm-modal-hint';
        empty.textContent = 'No bookmarks yet.';
        body.appendChild(empty);
        return;
      }

      bookmarks.forEach((bm, idx) => {
        const row = buildBookmarkRow(bm, {
          showActions: false,
          onClick: () => {
            if (bm.end) {
              // Already closed — ask if user wants to update
              closeModal();
              openModal('Update Close Point', (body2) => {
                const msg = document.createElement('div');
                msg.className = 'bm-modal-hint';
                msg.style.color = '#ccc';
                msg.textContent = `"${bm.name}" is already closed. Do you want to update its end point to the current position?`;
                body2.appendChild(msg);
              }, (actions2) => {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'bm-btn bm-btn-secondary';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.addEventListener('click', closeModal);

                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'bm-btn bm-btn-primary';
                confirmBtn.textContent = 'Update';
                confirmBtn.addEventListener('click', () => {
                  applyCloseToBookmark(bm, pos);
                  closeModal();
                });
                actions2.appendChild(cancelBtn);
                actions2.appendChild(confirmBtn);
              });
            } else {
              applyCloseToBookmark(bm, pos);
              closeModal();
            }
          }
        });
        body.appendChild(row);
      });
    }, (actions) => {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'bm-btn bm-btn-secondary';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', closeModal);
      actions.appendChild(cancelBtn);
    });
  }

  function applyCloseToBookmark(bm, endPos) {
    // Enforce: end must be after start. If not, swap.
    if (positionBefore(endPos, bm.start) || positionEqual(endPos, bm.start)) {
      // Swap: new start = endPos, new end = old start
      const oldStart = bm.start;
      bm.start = endPos;
      bm.end   = oldStart;
      sortBookmarks();
      // Re-number group after position changed
      renumberGroup(bmBaseName(bm.name));
    } else {
      bm.end = endPos;
    }
    persistBookmarks();
    showToast('Bookmark closed');
  }

  // ── BOOKMARK LIST ──
  bmListBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeBookmarkPanel();
    showBookmarkListModal();
  });

  function showBookmarkListModal() {
    openModal('Bookmarks', (body) => {
      // End-to-end toggle row
      const toggleRow = document.createElement('div');
      toggleRow.className = 'bm-toggle-row';
      const toggleLabel = document.createElement('span');
      toggleLabel.className = 'bm-toggle-label';
      toggleLabel.textContent = 'End-to-end reading';
      const toggleWrap = document.createElement('label');
      toggleWrap.className = 'settings-toggle';
      const toggleInput = document.createElement('input');
      toggleInput.type = 'checkbox';
      toggleInput.checked = bmEndToEnd;
      toggleInput.addEventListener('change', () => { bmEndToEnd = toggleInput.checked; });
      const toggleSlider = document.createElement('span');
      toggleSlider.className = 'settings-toggle-slider';
      toggleWrap.appendChild(toggleInput);
      toggleWrap.appendChild(toggleSlider);
      toggleRow.appendChild(toggleLabel);
      toggleRow.appendChild(toggleWrap);
      body.appendChild(toggleRow);

      if (bookmarks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'bm-modal-hint';
        empty.textContent = 'No bookmarks yet.';
        body.appendChild(empty);
        return;
      }

      bookmarks.forEach((bm) => {
        const row = buildBookmarkRow(bm, {
          showActions: true,
          onClick: () => {
            closeModal();
            navigateToBookmark(bm);
          },
          onRename: () => showRenameModal(bm),
          onDelete: () => showDeleteModal(bm),
        });
        body.appendChild(row);
      });
    }, (actions) => {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'bm-btn bm-btn-secondary';
      closeBtn.textContent = 'Close';
      closeBtn.addEventListener('click', closeModal);
      actions.appendChild(closeBtn);
    });
  }

  // ── BUILD A BOOKMARK ROW ──
  function buildBookmarkRow(bm, { showActions, onClick, onRename, onDelete }) {
    const row = document.createElement('div');
    row.className = 'bm-row';

    const info = document.createElement('div');
    info.className = 'bm-row-info';

    const name = document.createElement('div');
    name.className = 'bm-row-name';
    name.textContent = bm.name;

    const detail = document.createElement('div');
    detail.className = 'bm-row-detail';
    detail.textContent = bm.end
      ? `${bmPositionLabel(bm.start)} → ${bmPositionLabel(bm.end)}`
      : bmPositionLabel(bm.start);

    info.appendChild(name);
    info.appendChild(detail);

    const tag = document.createElement('span');
    tag.className = `bm-row-tag ${bm.end ? 'bm-tag-closed' : 'bm-tag-open'}`;
    tag.textContent = bm.end ? 'CLOSED' : 'OPEN';

    row.appendChild(info);
    row.appendChild(tag);

    if (showActions) {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'bm-row-actions';

      // Rename button
      const renameBtn = document.createElement('button');
      renameBtn.className = 'bm-icon-btn';
      renameBtn.title = 'Rename';
      renameBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
      renameBtn.addEventListener('click', (e) => { e.stopPropagation(); onRename && onRename(); });

      // Delete button
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'bm-icon-btn danger';
      deleteBtn.title = 'Delete';
      deleteBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
      deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); onDelete && onDelete(); });

      actionsDiv.appendChild(renameBtn);
      actionsDiv.appendChild(deleteBtn);
      row.appendChild(actionsDiv);
    }

    row.addEventListener('click', onClick);
    return row;
  }

  // ── RENAME ──
  function showRenameModal(bm) {
    openModal('Rename Bookmark', (body) => {
      const input = document.createElement('input');
      input.className = 'bm-modal-input';
      input.type = 'text';
      input.value = bm.name;
      body.appendChild(input);
      setTimeout(() => { input.focus(); input.select(); }, 50);
    }, (actions) => {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'bm-btn bm-btn-secondary';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => showBookmarkListModal());

      const saveBtn = document.createElement('button');
      saveBtn.className = 'bm-btn bm-btn-primary';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', () => {
        const input = bmModalBody.querySelector('.bm-modal-input');
        const newName = input ? input.value.trim() : '';
        if (!newName) return;
        const oldBase = bmBaseName(bm.name);
        bm.name = newName;
        const newBase = bmBaseName(newName);
        // Renumber old group (may now have one fewer member)
        renumberGroup(oldBase);
        // Renumber new group if it now has 2+ members
        const newGroup = bookmarks.filter(b => bmBaseName(b.name) === newBase);
        if (newGroup.length > 1) renumberGroup(newBase);
        persistBookmarks();
        showBookmarkListModal();
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
    });
  }

  // ── DELETE ──
  function showDeleteModal(bm) {
    openModal('Delete Bookmark', (body) => {
      const msg = document.createElement('div');
      msg.className = 'bm-modal-hint';
      msg.style.color = '#ccc';
      msg.textContent = `Delete "${bm.name}"? This cannot be undone.`;
      body.appendChild(msg);
    }, (actions) => {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'bm-btn bm-btn-secondary';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => showBookmarkListModal());

      const delBtn = document.createElement('button');
      delBtn.className = 'bm-btn bm-btn-danger';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', () => {
        const base = bmBaseName(bm.name);
        bookmarks = bookmarks.filter(b => b.id !== bm.id);
        renumberGroup(base);
        persistBookmarks();
        showBookmarkListModal();
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(delBtn);
    });
  }

  // ── NAVIGATE TO BOOKMARK ──
  function navigateToBookmark(bm) {
    if (bmEndToEnd && bm.end) {
      bmEndToEndActive = true;
      bmCurrentGroup   = bmBaseName(bm.name);
      bmCurrentGroupIdx = bookmarks
        .filter(b => b.end && bmBaseName(b.name) === bmCurrentGroup)
        .findIndex(b => b.id === bm.id);
    } else {
      bmEndToEndActive = false;
    }
    jumpToPosition(bm.start);
  }

  function jumpToPosition(pos) {
    if (pos.chapterId === chapterId) {
      if (readerSettings.mode === 'single-page') {
        const idx = spManifest.findIndex(e => e.localIdx === pos.pageIdx);
        if (idx !== -1) spGotoIdx(idx);
      } else {
        const entry = manifest.find(e => e.chapterId === pos.chapterId && e.localIdx === pos.pageIdx);
        if (entry) setVirtualY(entry.globalY);
      }
    } else {
      goToChapter(`/manga/${libraryId}/${mangaId}/chapter/${pos.chapterId}?page=${pos.pageIdx}`);
    }
  }

  // ── END-TO-END: check if we've reached the end of the current bookmark ──
  let bmCurrentGroup    = null;
  let bmCurrentGroupIdx = 0;

  function checkEndToEnd() {
    if (!bmEndToEndActive) return;

    const pos = getCurrentPosition();
    // Find the active bookmark in the current group
    const group = bookmarks.filter(b => b.end && bmBaseName(b.name) === bmCurrentGroup);
    const activeBm = group[bmCurrentGroupIdx];
    if (!activeBm || !activeBm.end) return;

    const end = activeBm.end;
    // Check if we've reached or passed the end position
    if (!positionBefore(pos, end) && !positionEqual(pos, end)) return;
    if (positionEqual(pos, end) || (!positionBefore(pos, end))) {
      // Move to next bookmark in chain
      advanceEndToEnd();
    }
  }

  function advanceEndToEnd() {
    // Try next in same group
    const group = bookmarks.filter(b => b.end && bmBaseName(b.name) === bmCurrentGroup);
    if (bmCurrentGroupIdx + 1 < group.length) {
      bmCurrentGroupIdx++;
      jumpToPosition(group[bmCurrentGroupIdx].start);
      return;
    }

    // Group exhausted — find next group by lowest start position
    const doneGroups = new Set();
    // Collect all groups that have been started
    // (current group and all groups whose base name equals bmCurrentGroup or comes before)
    bookmarks
      .filter(b => b.end)
      .forEach(b => {
        const base = bmBaseName(b.name);
        if (base === bmCurrentGroup) doneGroups.add(base);
      });

    // Find all remaining groups (not done), sorted by the position of their first bookmark
    const remaining = [];
    const seen = new Set(doneGroups);
    for (const bm of bookmarks) {
      if (!bm.end) continue;
      const base = bmBaseName(bm.name);
      if (seen.has(base)) continue;
      seen.add(base);
      remaining.push({ base, firstBm: bm });
    }
    // bookmarks are already sorted by position so the first occurrence of each group
    // is the one nearest the start of the manga

    if (remaining.length === 0) {
      bmEndToEndActive = false;
      showToast('Bookmarks ended');
      return;
    }

    // Move to the next group
    const next = remaining[0];
    bmCurrentGroup    = next.base;
    bmCurrentGroupIdx = 0;
    jumpToPosition(next.firstBm.start);
  }

  // ── SINGLE PAGE COMPLETION HOOK ──
  const _origSpForward = spForward;
  spForward = function() {
    if (readerSettings.mode === 'single-page' && spCurrentIdx >= spManifest.length - 1) {
      const lastPageIdx = spManifest.length > 0 ? spManifest[spManifest.length - 1].localIdx : 0;
      fetch(apiUrl('/api/reading/progress'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          library_id:           libraryId,
          manga_id:             mangaId,
          chapter_id:           chapterId,
          page:                 lastPageIdx,
          completed_chapter_id: chapterId,
        }),
      });
    }
    _origSpForward();
  };

  // Hook end-to-end check into page changes
  // scheduleProgressSave (called by setVirtualY) handles long-strip.
  // For single-page: wrap spGotoIdx.
  const _origSpGotoIdxE2E = spGotoIdx;
  spGotoIdx = function(idx) {
    _origSpGotoIdxE2E(idx);
    if (bmEndToEndActive) checkEndToEnd();
  };


  // Load bookmarks on startup
  await loadBookmarks();

})();
</script>
