<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/static/api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ theme_css | safe }}
  <title>Reader — KINSHO</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: color-mix(in srgb, var(--color-secondary, #1a1a1a) 70%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .topbar.visible { opacity: 1; pointer-events: all; }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }

    .topbar-title {
      flex: 1;
      font-family: 'Segoe UI', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── KINSHO BLE SCROLLER (Android app only) ── */
    .topbar-iconbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      transition: background 0.2s;
    }
    .topbar-iconbtn:hover { background: rgba(255,255,255,0.1); }

    .scroller-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      border: 1.5px solid rgba(0,0,0,0.4);
    }
    .scroller-dot.scanning  { background: #e0a030; }
    .scroller-dot.connected { background: #4caf50; }
    .scroller-dot.error     { background: #e94560; }

    .scroller-panel {
      position: fixed;
      top: 64px;
      right: 20px;
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
    }
    .scroller-panel.open { display: flex; }
    .scroller-panel-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 0.03em;
      padding: 0 4px;
    }
    .scroller-status {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      color: #999;
      padding: 0 4px;
    }
    .scroller-status.scanning  { color: #e0a030; }
    .scroller-status.connected { color: #4caf50; }
    .scroller-status.error     { color: #e94560; }

    /*
     * ── READER (CONVEYOR BELT) ──
     * Native scroll on a bounded window of materialized pages.
     * #reader scrolls normally; page slots are real flowed elements with
     * heights from dims.json. The window of materialized slots is frozen
     * during scroll and recentered (via DOM swap + scrollTop correction)
     * only when scrolling stops.
     */
    #reader {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: #000;
      /* Without this, the browser's own default scroll-anchoring can apply
         a second, independent scrollTop correction on top of the conveyor's
         manual one whenever slots are added/removed above the fold --
         two uncoordinated corrections for the same DOM mutation is what
         produced the "position resets to top of image" / progress-bar
         flash bugs during ordinary mouse-wheel scrolling. */
      overflow-anchor: none;
    }
    #reader::-webkit-scrollbar { display: none; }

    #reader-inner {
      /* Zoom (applyStripWidth) resizes THIS element, not #reader -- #reader
         itself stays permanently full-bleed so the black letterbox area at
         zoomed-out widths is still part of #reader's own scrollable/
         draggable bounds, not empty space outside it (the bug 6 fix). */
      width: 100%;
      margin: 0 auto;
    }

    .reader-spacer {
      width: 100%;
      /* height set in JS by _syncSpacers(); flanks the materialized slot
         pool so #reader's real scrollHeight always equals the true
         full-manifest height (cursorY), never just the materialized
         window's own content height. */
    }

    .page-slot {
      width: 100%;
      background: #000;
      /* height set per-entry in JS from dims.json; normal block flow */
    }

    .page-slot img {
      display: block;
      width: 100%;
      height: 100%;
      /* object-fit: fill keeps the image at exactly the precomputed ratio */
      object-fit: fill;
    }

    /* ── PROGRESS BAR ── */
    .frag-progress {
      position: fixed;
      top: 0;
      height: 100vh;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      width: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, width 0.2s ease;
      box-sizing: border-box;
      background: rgba(0,0,0,0.45);
      border-radius: 3px;
    }
    .frag-progress.left  { left: 0; }
    .frag-progress.right { right: 0; }
    .frag-progress.visible {
      opacity: 1;
      pointer-events: all;
    }
    .frag-progress.visible:hover {
      width: 18px;
      opacity: 1 !important;
    }

    .frag-seg {
      width: 100%;
      border-radius: 2px;
      background: rgba(255,255,255,0.35);
      transition: background 0.2s;
      flex-shrink: 0;
      flex-grow: 1;
      cursor: pointer;
      position: relative;
    }
    .frag-seg.active {
      background: var(--theme-primary, #e94560);
    }
    .frag-seg:hover {
      background: var(--theme-primary, #e94560);
      filter: brightness(1.3);
    }

    .frag-tooltip {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9px;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 200;
    }
    .frag-tooltip.pinned {
      opacity: 1;
    }

    /* ── BOTTOM BAR ── */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      width: 100%;
    }
    .bottombar.visible { opacity: 1; pointer-events: all; }
    /* ── BOTTOM CONTAINER (slider + bar grouped) ── */
    #bottom-container {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100vw - 48px);
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }

    /* row helper — always defined */
    .bb-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .bb-row-nav     { justify-content: center; }
    .bb-row-actions { justify-content: center; }

    /* ── BOTTOM BAR: 2-ROW LAYOUT ON MOBILE ── */
    @media (max-width: 540px) {
      #bottom-container {
        bottom: 12px;
      }
      .bottombar {
        flex-direction: column;
        gap: 6px;
        padding: 10px 14px;
        align-items: stretch;
      }
      .bb-divider    { display: none; }
      .bb-chap-btn   { max-width: 150px; }
      .bb-zoom-range { width: 100px; }

      .settings-panel {
        bottom: 115px;
      }
    }

    /* prev / next chapter buttons */
    .bb-chapbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .bb-chapbtn:hover { background: rgba(255,255,255,0.1); }
    .bb-chapbtn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* chapter dropdown */
    .bb-chap-dropdown {
      position: relative;
    }
    .bb-chap-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 5px 10px;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .bb-chap-btn:hover,
    .bb-chap-btn.open { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); }
    .bb-chap-btn svg { flex-shrink: 0; opacity: 0.6; }

    .bb-chap-menu {
      position: absolute;
      bottom: calc(100% + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      min-width: 260px;
      max-width: 340px;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
      z-index: 300;
      padding: 4px 0;
      display: none;
    }
    .bb-chap-menu.open { display: block; }

    .bb-chap-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      gap: 10px;
    }
    .bb-chap-menu-item:hover { background: rgba(255,255,255,0.07); }
    .bb-chap-menu-item.active {
      color: var(--theme-primary, #e94560);
      background: rgba(255,255,255,0.04);
    }
    .bb-chap-menu-item .bb-chap-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bb-chap-menu-item .bb-chap-num {
      font-size: 0.68rem;
      color: #555;
      flex-shrink: 0;
    }
    .bb-chap-menu-item.active .bb-chap-num { color: var(--theme-primary, #e94560); opacity: 0.7; }

    /* divider between chapter nav and action controls */
    .bb-divider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    /* icon buttons (stretch, settings) */
    .bb-iconbtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      color: #aaa;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .bb-iconbtn:hover { background: rgba(255,255,255,0.1); color: #f0f0f0; }

    /* zoom / range slider */
    .bb-zoom {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .bb-zoom-range {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      cursor: pointer;
    }
    .bb-zoom-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      cursor: pointer;
    }
    .bb-zoom-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      border: none;
      cursor: pointer;
    }
    .bb-zoom-value {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #888;
      min-width: 36px;
      text-align: right;
    }

    /* active state for stretch / iconbtn toggles */
    .bb-iconbtn.active {
      color: var(--theme-primary, #e94560);
    }

    /* ── SETTINGS PANEL ── */
    .settings-panel {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px 18px;
      min-width: 260px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .settings-panel.open { display: flex; }

    .settings-section-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 4px;
    }

    /* reading mode selector */
    .settings-mode-btns {
      display: flex;
      gap: 8px;
    }
    .settings-mode-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 8px 10px;
      color: #aaa;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .settings-mode-btn:hover { background: rgba(255,255,255,0.09); }
    .settings-mode-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--theme-primary, #e94560);
      color: #f0f0f0;
    }
    .settings-mode-btn svg { opacity: 0.7; }
    .settings-mode-btn.active svg { opacity: 1; }

    /* toggle row (padding switch) */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .settings-row-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      color: #ccc;
    }
    .settings-toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .settings-toggle input { opacity: 0; width: 0; height: 0; }
    .settings-toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .settings-toggle-slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f0f0f0;
      transition: transform 0.2s;
    }
    .settings-toggle input:checked + .settings-toggle-slider {
      background: var(--theme-primary, #e94560);
    }
    .settings-toggle input:checked + .settings-toggle-slider::before {
      transform: translateX(16px);
    }

    /* direction buttons for single page */
    .settings-dir-btns {
      display: flex;
      gap: 8px;
    }
    .settings-dir-btn {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 7px 10px;
      color: #aaa;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .settings-dir-btn:hover { background: rgba(255,255,255,0.09); }
    .settings-dir-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--theme-primary, #e94560);
      color: #f0f0f0;
    }

    /* ── SINGLE PAGE MODE ── */
    #singlePageView {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1;
      overflow: hidden;
      align-items: center;
      justify-content: center;
    }
    #singlePageView.active { display: flex; }

    #singlePageView img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      position: absolute;
    }
    /* invisible click zones */
    .sp-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 30%;
      z-index: 2;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .sp-zone-left  { left: 0; }
    .sp-zone-right { right: 0; }
    .sp-zone-center {
      left: 30%;
      width: 40%;
      cursor: default;
    }

    /* strip padding between images */
    #reader.padded .page-slot {
      /* padding handled via JS gap on globalY */
    }

    /* ── BOOKMARK PANEL ── */
    .bookmark-panel {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 200px;
    }
    .bookmark-panel.open { display: flex; }

    .bm-panel-btn {
      background: none;
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      color: #ccc;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .bm-panel-btn:hover { background: rgba(255,255,255,0.08); color: #f0f0f0; }

    /* ── BOOKMARK MODAL ── */
    .bm-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bm-modal {
      background: rgba(18,18,18,0.98);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      min-width: 320px;
      max-width: 480px;
      width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bm-modal-title {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 0.04em;
    }
    .bm-modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .bm-modal-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 9px 12px;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .bm-modal-input:focus { border-color: var(--theme-primary, #e94560); }
    .bm-modal-hint {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: #666;
    }
    .bm-modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .bm-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .bm-btn-primary {
      background: var(--theme-primary, #e94560);
      color: #fff;
    }
    .bm-btn-primary:hover { filter: brightness(1.15); }
    .bm-btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #ccc;
    }
    .bm-btn-secondary:hover { background: rgba(255,255,255,0.14); color: #f0f0f0; }
    .bm-btn-danger {
      background: rgba(220,50,50,0.15);
      color: #e06060;
    }
    .bm-btn-danger:hover { background: rgba(220,50,50,0.28); }

    /* Bookmark list rows */
    .bm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .bm-row:hover { background: rgba(255,255,255,0.09); }
    .bm-row-info { flex: 1; min-width: 0; }
    .bm-row-name {

    .bm-icon-btn.danger:hover { background: rgba(220,50,50,0.2); color: #e06060; }

    /* end-to-end toggle row */

      display: flex;

      font-size: 0.78rem;
      color: #aaa;
    }

    /* message toast */
    .bm-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: rgba(18,18,18,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      color: #f0f0f0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .bm-toast.show { opacity: 1; }

    /* ── LAST PAGE POPUP ── */
    .last-page-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 600;
      background: rgba(18,18,18,0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px 28px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: #f0f0f0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    .last-page-popup.show { opacity: 1; }

    /* ── READING-MODE CURSOR HIDING ──
       While the UI chrome is hidden, the whole screen hides the mouse
       cursor — pure CSS on the body, no overlay elements. (The previous
       .sidebar-zone overlays needed pointer-events:all for cursor:none to
       apply, which also made them swallow wheel events — scrolling was
       dead inside them.) Left-clicking anywhere shows the UI again via
       the existing document click handler, which drops this class and
       restores the cursor. */
    body.cursor-hidden, body.cursor-hidden * { cursor: none !important; }

    /* ── PRELOAD RADIUS SLIDER ── */
    .settings-preload {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .settings-preload-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.82rem;
      color: #ccc;
      white-space: nowrap;
    }
    .settings-preload-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-preload-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      cursor: pointer;
    }
    .settings-preload-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      cursor: pointer;
    }
    .settings-preload-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--theme-primary, #e94560);
      border: none;
      cursor: pointer;
    }
    .settings-preload-value {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #888;
      min-width: 42px;
      text-align: right;
    }

    /* ── PAGE SLIDER + THUMB STRIP ── */
    .page-slider-wrap {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 6px 12px;
      width: 100%;
    }
    .page-slider-wrap.visible {
      opacity: 1;
      pointer-events: all;
    }
    /* Thumb strip */
    .thumb-strip {
      display: none;
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 174px; /* 150px thumb + 4px gap + label + 8px padding */
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    .thumb-strip.active { display: block; }
    .thumb-strip:active  { cursor: grabbing; }

    /* inner track that slides */
    .thumb-track {
      position: absolute;
      top: 8px;
      left: 0;
      height: 162px;
      will-change: transform;
    }
    .thumb-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
      width: 100px;
    }
    .thumb-cell-img-wrap {
      width: 100px;
      height: 150px;
      background: rgba(0,0,0,0.55);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-cell-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .thumb-cell-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.62rem;
      color: #aaa;
      text-align: center;
    }
    /* Slider row */
    .page-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .page-slider-input {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.45);
      outline: none;
      cursor: pointer;
    }
    .page-slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--theme-primary, #e94560);
      box-shadow: 0 0 0 2px #000, 0 0 6px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .page-slider-input::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--theme-primary, #e94560);
      box-shadow: 0 0 0 2px #000, 0 0 6px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .page-slider-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      color: #888;
      min-width: 56px;
      text-align: right;
      white-space: nowrap;
    }

    /* ── PDF QUALITY SLIDER ── */
    .settings-pdf-quality {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-pdf-quality-track {
      position: relative;
      height: 4px;
      border-radius: 2px;

    .settings-pdf-quality-fill {

      border-radius: 2px;
      background: var(--theme-primary, #e94560);
      transition: width 0.15s;
    }
    .settings-pdf-quality-input {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: transparent;
      outline: none;
      cursor: pointer;
      margin: 0;

    .settings-pdf-quality-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--theme-primary, #e94560);

<script>
(async () => {

  // Replace the current history entry so chapter-to-chapter navigation
  // doesn't stack: pressing back always returns to the manga detail page.
  history.replaceState(null, '', window.location.href);

  // The manga list page remembers its scroll position AND its fully
  // rendered content (see static/app.js's MANGA_LIST_SCROLL_KEY and
  // kinsho_tab_cache_* / tabCacheStorageKey) across a normal "click into a
  // manga, hit back" round trip -- but only until a chapter is actually
  // opened. Once real reading has started, a snapshot from before isn't
  // meaningful to instantly resume into anymore, even after navigating
  // all the way back through browser history later. Same literal key
  // strings as app.js -- this is a separate page load/script context,
  // nothing to import from. Walks all of sessionStorage rather than one
  // fixed key since the tab cache is one entry per library, and the
  // manga being read could belong to any of them.
  try {
    sessionStorage.removeItem('kinsho_manga_list_scroll');
    for (let i = sessionStorage.length - 1; i >= 0; i--) {
      const k = sessionStorage.key(i);
      if (k && k.startsWith('kinsho_tab_cache_')) sessionStorage.removeItem(k);
    }
  } catch (e) {}

  // ── URL PARAMS ──
  const parts     = window.location.pathname.split('/');
  const libraryId = parts[2];
  const mangaId   = parts[3];
  const isVolume  = parts[4] === 'volume';
  const chapterId = parts[5];
  const startPage = parseInt(new URLSearchParams(window.location.search).get('page') || '0', 10);

  const reader      = document.getElementById('reader');
  // Content lives in here, not directly in #reader -- #reader itself is the
  // one scroll-mechanics element (scrollTop/scrollHeight/clientHeight, all
  // scroll/scrollend/touch listeners) and stays permanently full-bleed;
  // readerInner is what applyStripWidth's zoom resizes (see bug 6 fix).
  const readerInner = document.getElementById('reader-inner');
  const topbar  = document.getElementById('topbar');
  const titleEl = document.getElementById('topbarTitle');
  const backBtn = document.getElementById('backBtn');

  // ── CONVEYOR BELT CONFIG ──
  // Number of manga pages materialized as real DOM slots at any time.
  // This is the buffer the user can natively scroll within before a
  // recenter is needed — keep generous so a single flick can't outrun it.
  const SLOT_COUNT = 80;

  // ── FULLSCREEN ──
  function enterFullscreen() {
    const el = document.documentElement;
    if      (el.requestFullscreen)       el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
  }
  function exitFullscreen() {
    if      (document.exitFullscreen)       document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
  }

  // ── TOP BAR ──
  let barTimer = null;
  function showBar() { showAll(); } // kept for compat

  function hideAll() {
    topbar.classList.remove('visible');
    fragProgress.classList.remove('visible');
    document.getElementById('bottombar').classList.remove('visible');
    leftTooltip.classList.remove('pinned');
    leftHoveredIdx = null;
    barVisible = false;
    const sp = document.getElementById('settingsPanel');
    if (sp) {
      sp.classList.remove('open');
      const btn = document.getElementById('bbSettingsBtn');
      if (btn) btn.classList.remove('active');
    }
    if (typeof syncSliderVisibility === 'function') syncSliderVisibility();
    document.body.classList.add('cursor-hidden');
  }

  function showAll() {
    topbar.classList.add('visible');
    fragProgress.classList.add('visible');
    document.getElementById('bottombar').classList.add('visible');
    barVisible = true;
    document.body.classList.remove('cursor-hidden');
    if (typeof syncSliderVisibility === 'function') syncSliderVisibility();
    clearTimeout(barTimer);
    barTimer = setTimeout(() => {
      if (stripVisible) return; // don't hide while thumb strip is active
      if (topbar.matches(':hover') || fragProgress.matches(':hover') || document.getElementById('bottombar').matches(':hover')) return;
      hideAll();
    }, 3000);
    // updateProgressBar() was skipped while barVisible was false (see its
    // own comment) — barVisible is now true above, so this call rebuilds
    // whatever went stale (frag segments, chapter label, page slider) and
    // internally calls updatePinnedTooltips() itself once it's done.
    if (typeof updateProgressBar === 'function') updateProgressBar();
  }

  let barVisible     = false;
  let leftHoveredIdx = null;
  document.addEventListener('click', e => {
    if (touchMoved) { touchMoved = false; return; } // was a drag, not a tap
    if (backBtn.contains(e.target)) return;
    if (fragProgress.contains(e.target)) return;
    if (document.getElementById('bottombar').contains(e.target)) return;
    if (barVisible) {
      clearTimeout(barTimer);
      hideAll();
    } else {
      showAll();
    }
  });

  backBtn.addEventListener('click', () => {
    exitFullscreen();
    window.location.href = `/manga/${libraryId}/${mangaId}`;
  });

  // ── FETCH HELPERS ──
  async function apiFetch(path) {
    const r = await fetch(path);
    return r.json();
  }

  // Navigate to a chapter by replacing history so back always returns to the manga detail page.
  function goToChapter(url) {
    window.location.replace(url);
  }

  // ── BOOT: fetch everything needed for geometry in one round-trip burst ──
  enterFullscreen();

  const [manga, dims, chapterList, adminData] = await Promise.all([
    apiFetch(`/api/manga/${libraryId}/${mangaId}`),
    apiFetch(`/api/manga/${libraryId}/${mangaId}/dims`),
    apiFetch(`/api/manga/${libraryId}/${mangaId}/${isVolume ? 'volumes' : 'chapters'}`).then(d => isVolume ? (d.volumes || []) : (d.chapters || [])),
    apiFetch(`/api/admin/status`),
  ]);

  titleEl.textContent = manga.name || manga.title || 'Manga';

  // ── READING SESSION TRACKING ──
  const _readingMangaName = manga.name || manga.title || 'Unknown';
  fetch(apiUrl('/api/reading/session/start'), {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ manga_name: _readingMangaName, library_id: String(libraryId) }),
  }).catch(() => {});

  let _tickSent = false;
  const _tickInterval = setInterval(() => {
    fetch(apiUrl('/api/reading/session/tick'), { method: 'POST' }).catch(() => {});
  }, 60000);

  function _sendFinalTick() {
    if (_tickSent) return;
    _tickSent = true;
    clearInterval(_tickInterval);
    navigator.sendBeacon('/api/reading/session/tick');
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') _sendFinalTick();
  });
  window.addEventListener('beforeunload', _sendFinalTick);

  // ── BUILD MANIFEST ──
  // manifest[i] = {
  //   chapterId, localIdx,   — identity
  //   globalY, scaledH,      — geometry (pixels, at current viewport width)
  //   url: null,             — populated lazily when chapter URLs are fetched
  //   el: null,              — <img> element reference
  // }
  //
  // chapterStart[chapterId] = first manifest index for that chapter
  //
  // All geometry is derived from dims.json which the server already has —
  // zero extra network requests needed to position anything.

  const viewW        = window.innerWidth;
  const manifest     = [];
  const chapterStart = {};
  let   cursorY      = 0;

  // Gap in px between pages when padding is enabled (applied during rebuild)
  const PAGE_GAP = 16;

  function buildManifest(usePadding, effectiveW) {
    const w = effectiveW ?? viewW;
    manifest.length = 0;
    Object.keys(chapterStart).forEach(k => delete chapterStart[k]);
    cursorY = 0;
    for (const ch of chapterList) {
      const cid    = ch.id;
      const chDims = isVolume ? dims.volumes?.[cid] : dims.chapters?.[cid];
      if (!chDims || !chDims.pages?.length) continue;
      chapterStart[cid] = manifest.length;
      for (let i = 0; i < chDims.pages.length; i++) {
        const { w: iw, h: ih } = chDims.pages[i];
        const scaledH = Math.round((w / iw) * ih);
        manifest.push({
          chapterId: cid,
          localIdx:  i,
          globalY:   cursorY,
          scaledH,
          url:    null,
          el:     null,
          loaded: false,
        });
        cursorY += scaledH + (usePadding ? PAGE_GAP : 0);
      }
    }
  }

  // Update globalY positions and scaledH in the existing manifest entries (preserves el refs and loaded state)
  function recomputeGeometry(usePadding, effectiveW) {
    const w = effectiveW ?? viewW;
    let y = 0;
    Object.keys(chapterStart).forEach(k => delete chapterStart[k]);
    for (let i = 0; i < manifest.length; i++) {
      const entry = manifest[i];
      if (i === 0 || manifest[i - 1].chapterId !== entry.chapterId) {
        chapterStart[entry.chapterId] = i;
      }
      const chDims = isVolume ? dims.volumes?.[entry.chapterId] : dims.chapters?.[entry.chapterId];
      if (chDims?.pages?.[entry.localIdx]) {
        const { w: iw, h: ih } = chDims.pages[entry.localIdx];
        entry.scaledH = Math.round((w / iw) * ih);
      }
      entry.globalY = y;
      y += entry.scaledH + (usePadding ? PAGE_GAP : 0);
    }
    cursorY = y;
  }

  // ── READER SETTINGS (loaded from admin, keyed by library tab) ──
  const readerSettings = Object.assign(
    { mode: 'long-strip', padding: false, direction: 'ltr', stripWidth: 100, pdfScale: 1 },
    (adminData.reader_settings_by_tab || {})[libraryId] || {}
  );

  async function saveReaderSettings() {
    await fetch(apiUrl('/api/settings/reader'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...readerSettings, library_id: libraryId }),
    });
  }

  function applyPreloadRadius(r) {
    readerSettings.preloadRadius = r;
    TIER1_RADIUS = r;
    TIER2_RADIUS = r * 2;
    document.getElementById('settingsPreloadValue').textContent = `±${r}`;
    document.getElementById('settingsPreloadRange').value = r;
  }

  // Build manifest with current padding setting
  buildManifest(readerSettings.padding);

  // ── CONVEYOR WINDOW STATE ──
  // slotPool[k] corresponds to manifest[windowLo + k] and is always a DOM
  // child of #reader positioned between topSpacer and bottomSpacer (NOT
  // necessarily the (k+1)-th child overall -- the two spacers are permanent
  // fixtures that never get cleared by a rebuild). The window is
  // materialized/shifted by _rebuildConveyorWindow / _shiftConveyorWindow
  // below.
  const slotPool = [];
  let windowLo = 0;
  let windowHi = -1;

  // Map from manifest index → slot pool index (-1 = not materialized)
  const assignedSlot = new Int32Array(manifest.length).fill(-1);

  // ── FULL-HEIGHT SPACERS ──
  // #reader's native scrollHeight must always equal the TRUE full-manifest
  // height (cursorY), never just the sum of the ~SLOT_COUNT materialized
  // slots -- otherwise a long continuous scroll can hit a genuine native
  // scrollTop ceiling well before the real end of the chapter (the "scroll
  // stops after ~40 pages" bug). topSpacer/bottomSpacer are permanent
  // fixtures flanking the slot pool that make up the difference: their
  // combined height plus the materialized slots' heights always equals
  // cursorY exactly, so reader.scrollTop is always numerically identical to
  // virtualY (see syncScrollPosition below) -- no offset arithmetic needed.
  const topSpacer = document.createElement('div');
  const bottomSpacer = document.createElement('div');
  topSpacer.className = bottomSpacer.className = 'reader-spacer';
  readerInner.appendChild(topSpacer);
  readerInner.appendChild(bottomSpacer);

  function _syncSpacers() {
    if (manifest.length === 0) {
      topSpacer.style.height = '0px';
      bottomSpacer.style.height = '0px';
      return;
    }
    topSpacer.style.height = manifest[windowLo].globalY + 'px';
    const windowEndY = manifest[windowHi].globalY + manifest[windowHi].scaledH;
    bottomSpacer.style.height = Math.max(0, cursorY - windowEndY) + 'px';
  }

  // ── VIRTUAL SCROLL STATE ──
  // virtualY is the only source of truth for scroll position.
  // No window.scrollY, no window.scrollTo, no browser scroll events.
  let virtualY = 0;
  const viewH  = window.innerHeight;

  // ── URL CACHE ──
  // Fetch chapter page URL lists on demand; cache the Promise so concurrent
  // calls for the same chapter share one network request.
  const urlCache = {}; // chapterId -> Promise<string[]>

  function sourceIsPdf() {
    const firstCh = chapterList[0];
    if (!firstCh) return false;
    const chDims = isVolume ? dims.volumes?.[firstCh.id] : dims.chapters?.[firstCh.id];
    return chDims?.source === 'pdf';
  }
  const isPdf = sourceIsPdf();

  const PDF_SCALES = [1.0, 1.5, 2.0];
  function pdfScaleParam() {
    return `?scale=${PDF_SCALES[readerSettings.pdfScale ?? 1]}`;
  }

  function ensureChapterUrls(cid) {
    if (urlCache[cid]) return urlCache[cid];

    const chDims = isVolume ? dims.volumes?.[cid] : dims.chapters?.[cid];
    const source = chDims?.source;
    const base   = `/api/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${cid}/page`;

    // Archive / PDF / EPUB: URLs are sequential integers, build without network fetch.
    if (source === 'archive' || source === 'pdf' || source === 'epub') {
      const count  = chDims.page_count ?? chDims.pages?.length;
      if (count != null) {
        const suffix = source === 'pdf' ? pdfScaleParam() : '';
        const urls   = Array.from({ length: count }, (_, i) => `${base}/${i}${suffix}`);
        urlCache[cid] = Promise.resolve(urls);
        return urlCache[cid];
      }
    }

    // Loose: filenames stored in dims, build without network fetch.
    if (source === 'loose' && Array.isArray(chDims?.filenames)) {
      const urls = chDims.filenames.map(fname => `${base}/${fname}`);
      urlCache[cid] = Promise.resolve(urls);
      return urlCache[cid];
    }

    // Fallback: old dims.json without page_count/filenames — fetch from server.
    const suffix = isPdf ? pdfScaleParam() : '';
    urlCache[cid] = apiFetch(
      `/api/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${cid}/pages${suffix}`
    ).then(d => d.pages || []);
    return urlCache[cid];
  }

  // Prime the opening chapter URL fetch immediately so it's in-flight (or done)
  // by the time the jump block's .then() fires — eliminates the blank-first-page delay.
  ensureChapterUrls(chapterId);

  // ── THREE-TIER LOADER ──
  let TIER1_RADIUS = readerSettings.preloadRadius ?? 7;
  let TIER2_RADIUS = TIER1_RADIUS * 2;

  // Declared here (not down with the rest of the single-page-mode _sp* state)
  // because loadEntryTier1 below reads it synchronously the moment it's first
  // called -- which happens during the initial tier-1 preload, long before
  // script execution reaches the single-page-mode section further down. Left
  // declared there too as the TDZ meant every tier-1 load threw a
  // ReferenceError, which in turn aborted the rest of the top-level script
  // (including the tap-to-toggle-UI listener's own state setup further down),
  // breaking the show/hide-UI tap in every reading mode.
  let _spAnimFrame = 0;

  function sourceIsCompressed() {
    const firstCh = chapterList[0];
    if (!firstCh) return false;
    const chDims = isVolume ? dims.volumes?.[firstCh.id] : dims.chapters?.[firstCh.id];
    if (!chDims) return false;
    const src = chDims.source;
    return src === 'archive' || src === 'pdf' || src === 'epub';
  }
  const isCompressed = sourceIsCompressed();

  function thumbUrl(entry) {
    return `/api/manga/${libraryId}/${mangaId}/thumb/${entry.chapterId}/${entry.localIdx}`;
  }

  function pdfScaleParam() {
    const scales = [1.0, 1.5, 2.0];
    return `?scale=${scales[readerSettings.pdfScale ?? 1]}`;
  }

  // Assign a URL to a manifest entry (populates entry.url, sets img src via slot if assigned)
  function loadEntry(entry, retriesLeft = 2) {
    if (entry.loaded) return;
    if (entry.url) {
      _applyUrlToSlot(entry, retriesLeft);
      return;
    }
    ensureChapterUrls(entry.chapterId).then(urls => {
      entry.url = urls[entry.localIdx] || '';
      _applyUrlToSlot(entry, retriesLeft);
    });
  }

  // entry.loaded is only set once the browser confirms the image actually
  // finished loading (onload), not the moment .src is assigned -- previously
  // set unconditionally right there, so a stalled/dropped request (more
  // likely during fast scrolling, which fires many concurrent slot loads at
  // once and can exceed the browser's per-origin connection cap) left that
  // page permanently stuck at whatever partial state it reached: every
  // loader early-returns on entry.loaded, so nothing ever retried it. The
  // only "fix" was the accidental side effect of a manual page jump's
  // _rebuildConveyorWindow resetting loaded=false for the whole window.
  // onerror now retries a couple of times (short flat delay, not exponential
  // -- default retriesLeft=2 already bounds this to 3 attempts total) before
  // giving up; if retries are exhausted, entry.loaded simply stays false so
  // a later pass (scrolling back over it, a fresh conveyor rebuild) can
  // still pick it up naturally instead of being marked done-but-broken.
  function _applyUrlToSlot(entry, retriesLeft = 2) {
    if (!entry.url) return;
    const globalIdx = manifest.indexOf(entry);
    const si = assignedSlot[globalIdx];
    if (si === -1) return;
    const imgEl = slotPool[si].img;
    imgEl.onload = () => { entry.loaded = true; };
    imgEl.onerror = () => {
      if (retriesLeft > 0) {
        setTimeout(() => _applyUrlToSlot(entry, retriesLeft - 1), 500);
      }
    };
    imgEl.src = entry.url;
  }

  // Tier 1: full-res + forced decode, then paint into slot
  function loadEntryTier1(entry, signal, retriesLeft = 2) {
    if (entry.loaded) return;
    // Captured now (synchronously, when this load is scheduled) rather than
    // read fresh inside _upgradeSpImage below -- a slow tier1 prefetch
    // (queued during a fast-reading burst, or just a slower link) can
    // resolve well after the user has since flipped past it again in
    // single-page mode. Cancelling a *pending* prefetch
    // (_spSchedulePrefetch's own AbortController) only stops requests not
    // yet dispatched, never one already in flight, so
    // spManifest[spCurrentIdx] === entry alone wasn't enough to guard
    // against this -- it only checks WHICH page is current, not WHETHER a
    // newer flip has happened since this specific load was scheduled, so a
    // stale load could still win the moment the user's own reading pace
    // organically caught back up to that same page index (needing several
    // back-and-forth flips to "fix" -- each one only cancels the *next*
    // pending prefetch, not whatever earlier ones are already in flight).
    const scheduledSpFrame = _spAnimFrame;
    const apply = (url) => {
      if (!url || signal?.aborted) return;
      entry.url = url;
      const _upgradeSpImage = () => {
        // spImage is a swappable reference — always read it at call time, not at definition time.
        if (readerSettings.mode === 'single-page'
            && spManifest[spCurrentIdx] === entry
            && _spAnimFrame === scheduledSpFrame) {
          spImage.src = url;
        }
      };
      // entry.loaded is only set once success is confirmed -- see
      // _applyUrlToSlot's comment above for the full reasoning (same
      // underlying bug, same fix shape). onFail retries a couple of times
      // before giving up and leaving entry.loaded false for a later pass.
      const globalIdx = manifest.indexOf(entry);
      const si = assignedSlot[globalIdx];
      const onSuccess = () => {
        if (signal?.aborted) return;
        entry.loaded = true;
        _upgradeSpImage();
      };
      const onFail = () => {
        if (signal?.aborted || retriesLeft <= 0) return;
        setTimeout(() => loadEntryTier1(entry, signal, retriesLeft - 1), 500);
      };
      if (isCompressed) {
        const img = new Image();
        img.src = url;
        img.decode().then(() => {
          if (si !== -1) slotPool[si].img.src = url;
          onSuccess();
        }).catch(onFail);
      } else if (si !== -1) {
        const imgEl = slotPool[si].img;
        imgEl.onload = onSuccess;
        imgEl.onerror = onFail;
        imgEl.src = url;
      } else {
        // No slot currently assigned -- nothing to paint into yet, but
        // still worth confirming the fetch actually succeeds: a resolved
        // detached Image() lands in the browser's own HTTP cache, so
        // whenever this entry does get a slot later it paints instantly.
        const probe = new Image();
        probe.onload = onSuccess;
        probe.onerror = onFail;
        probe.src = url;
      }
    };
    if (entry.url) { apply(entry.url); return; }
    ensureChapterUrls(entry.chapterId).then(urls => apply(urls[entry.localIdx] || ''));
  }

  // Tier 2: full-res prefetch only — no slot assignment
  function prefetchEntryTier2(entry, signal) {
    if (entry.loaded || entry.url) return;
    ensureChapterUrls(entry.chapterId).then(urls => {
      if (signal?.aborted) return;
      const url = urls[entry.localIdx] || '';
      if (!url) return;
      entry.url = url;
      const img = new Image();
      img.src = url;
    });
  }

  // Tier 3: thumbnail into slot (full-res will overwrite when promoted)
  function loadEntryTier3(entry) {
    if (entry.loaded) return;
    const globalIdx = manifest.indexOf(entry);
    const si = assignedSlot[globalIdx];
    if (si === -1) return;
    if (!slotPool[si].img.dataset.thumbSet) {
      slotPool[si].img.dataset.thumbSet = '1';
      slotPool[si].img.src = thumbUrl(entry);
    }
  }

  function prefetchAroundIndex(centerGlobalIdx, signal, direction = 0) {
    // In single-page mode with a known direction, use asymmetric radii:
    // forward gets the full velocity-scaled radius, backward gets a small fixed buffer.
    // In long-strip mode or direction=0, stay symmetric (original behaviour).
    const SP_BACK_RADIUS_T1 = 2;  // tier-1 pages to keep behind in SP mode
    const SP_BACK_RADIUS_T2 = 4;  // tier-2 pages to keep behind in SP mode

    let fwdT1, backT1, fwdT2, backT2;
    if (direction !== 0) {
      const fwd  = direction > 0 ? 1 : -1;
      fwdT1  = fwd > 0 ? TIER1_RADIUS : SP_BACK_RADIUS_T1;
      backT1 = fwd > 0 ? SP_BACK_RADIUS_T1 : TIER1_RADIUS;
      fwdT2  = fwd > 0 ? TIER2_RADIUS : SP_BACK_RADIUS_T2;
      backT2 = fwd > 0 ? SP_BACK_RADIUS_T2 : TIER2_RADIUS;
    } else {
      fwdT1 = backT1 = TIER1_RADIUS;
      fwdT2 = backT2 = TIER2_RADIUS;
    }

    const lo1 = Math.max(0, centerGlobalIdx - backT1);
    const hi1 = Math.min(manifest.length - 1, centerGlobalIdx + fwdT1);
    const lo2 = Math.max(0, centerGlobalIdx - backT2);
    const hi2 = Math.min(manifest.length - 1, centerGlobalIdx + fwdT2);

    for (let i = lo1; i <= hi1; i++) { if (signal?.aborted) return; loadEntryTier1(manifest[i], signal); }
    for (let i = lo2; i < lo1;  i++) { if (signal?.aborted) return; prefetchEntryTier2(manifest[i], signal); }
    for (let i = hi1 + 1; i <= hi2; i++) { if (signal?.aborted) return; prefetchEntryTier2(manifest[i], signal); }
    for (let i = Math.max(0, lo2 - 18); i < lo2; i++) { if (signal?.aborted) return; loadEntryTier3(manifest[i]); }
    for (let i = hi2 + 1; i <= Math.min(manifest.length - 1, hi2 + 18); i++) { if (signal?.aborted) return; loadEntryTier3(manifest[i]); }
  }

  // ── BINARY SEARCH: first manifest index whose bottom edge > y ──
  function firstIndexAfter(y) {
    let lo = 0, hi = manifest.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      const m   = manifest[mid];
      if (m.globalY + m.scaledH <= y) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  // ── CURRENT-POSITION TRACKING Y ──
  // Long-strip "current page"/"current chapter" tracking uses the viewport
  // MIDPOINT (virtualY + half a viewport), not the bottom edge -- correct
  // everywhere except at the true end of the manifest: virtualY is clamped
  // there (see setVirtualY/momentumLoop), so the midpoint can never reach
  // past cursorY - viewH/2, permanently short of the true last page/chapter
  // by up to half a viewport. Any trailing page shorter than that half-
  // viewport gap can never be marked "current" no matter how far the user
  // scrolls, once scrolling further is physically impossible -- the
  // segmented-progress-bar undercount bug. Clamping to the true cursorY
  // only at the true max scroll (not switching every call site to
  // bottom-edge tracking everywhere) fixes exactly that one case without
  // changing "current page" semantics anywhere else -- a bottom-edge switch
  // would flip pages earlier throughout and make chapter-boundary detection
  // MORE sensitive to any transient bad scrollTop, risking the progress-bar
  // flash/teleport bug rather than helping it.
  function currentTrackingY() {
    return (virtualY >= cursorY - viewH - 1) ? cursorY : (virtualY + viewH * 0.5);
  }

  // ── BUILD A SLOT ──
  function _makeSlotEl() {
    const el  = document.createElement('div');
    el.className = 'page-slot';
    const img = document.createElement('img');
    img.style.display   = 'block';
    img.style.width     = '100%';
    img.style.height    = '100%';
    img.style.objectFit = 'fill';
    el.appendChild(img);
    return { el, img };
  }

  // ── FULL REBUILD: clears the conveyor and materializes a new window of
  // up to SLOT_COUNT entries centered on newWindowLo, then sets scrollTop
  // so targetGlobalY lands at the same point in the viewport. ──
  // Removes only the materialized slot-pool children, leaving topSpacer/
  // bottomSpacer in place as permanent fixtures -- reader.replaceChildren()
  // would also wipe the spacers, which must never happen.
  function _clearSlotPool() {
    for (const { el } of slotPool) el.remove();
    slotPool.length = 0;
  }

  function _rebuildConveyorWindow(newWindowLo, targetGlobalY) {
    for (let i = windowLo; i <= windowHi; i++) {
      manifest[i].loaded = false;
      assignedSlot[i] = -1;
    }
    _clearSlotPool();

    if (manifest.length === 0) { windowLo = 0; windowHi = -1; _syncSpacers(); return; }

    const count = Math.min(SLOT_COUNT, manifest.length);
    windowLo = Math.max(0, Math.min(newWindowLo, manifest.length - count));
    windowHi = windowLo + count - 1;

    const frag = document.createDocumentFragment();
    for (let i = windowLo; i <= windowHi; i++) {
      const { el, img } = _makeSlotEl();
      el.style.height = manifest[i].scaledH + 'px';
      frag.appendChild(el);
      slotPool.push({ el, img });
      assignedSlot[i] = i - windowLo;
    }
    readerInner.insertBefore(frag, bottomSpacer);

    // topSpacer must be sized BEFORE reader.scrollTop is set below, since
    // its height is what makes targetGlobalY and scrollTop numerically
    // equal (see the FULL-HEIGHT SPACERS comment above).
    _syncSpacers();
    reader.scrollTop = targetGlobalY;

    // Load the slot images CENTER-OUT from the page actually at the
    // viewport top — not in windowLo→windowHi DOM order. All ~SLOT_COUNT
    // images share the browser's handful of connections per origin, so
    // request order effectively IS priority order: DOM-order loading
    // queued the visible page behind up to half the window of off-screen
    // full-res pages, which is exactly the blank-first-page-until-you-
    // scroll symptom on a cold server. fetchPriority nudges supporting
    // browsers the same way (harmless no-op elsewhere).
    const centerIdx = Math.max(windowLo, Math.min(windowHi, firstIndexAfter(targetGlobalY)));

    // How many pages ahead/behind center get 'high' fetchPriority, in
    // viewport-relative terms rather than a tiny fixed count. A fixed ±2
    // (the old value) is far too narrow relative to SLOT_COUNT=80: every
    // other page in the ~80-slot window competes on equal 'low' footing
    // with no ordering guarantee between them, so a page just outside that
    // ±2 band -- still well within the first screenful or two the user
    // will actually read within seconds of opening the chapter -- could
    // finish loading well after a page much further away, purely by
    // network race. This only shows up on the very first materialization
    // (all ~80 requests fire at once); ordinary scrolling only ever adds a
    // couple of new pages per shift, so this never mattered there -- a real
    // reported bug, confirmed to appear only right after opening a chapter.
    // Biased forward (more pages ahead than behind) since long-strip
    // reading is essentially always downward, even before any actual scroll
    // has happened to establish a direction.
    const avgPageH = manifest[centerIdx]?.scaledH || viewH;
    // Floors of 12/4 are deliberately generous rather than purely
    // viewport-derived -- long-strip "cuts" vary wildly in height across
    // different manga/webtoons, and the reported bug specifically involved
    // pages several past the visible screenful (up to ~9) still racing on
    // equal footing with the rest of the window; a floor directly sized to
    // comfortably cover that, with the viewport-based term as a secondary
    // boost for unusually short pages, is more robust than trusting the
    // page-height assumption alone.
    const HIGH_PRI_AHEAD  = Math.max(12, Math.ceil((viewH * 3) / avgPageH));
    const HIGH_PRI_BEHIND = Math.max(4, Math.ceil(viewH / avgPageH));

    for (let d = 0; d <= windowHi - windowLo; d++) {
      for (const i of (d === 0 ? [centerIdx] : [centerIdx + d, centerIdx - d])) {
        if (i < windowLo || i > windowHi) continue;
        const si = assignedSlot[i];
        if (si !== -1) {
          const rel = i - centerIdx;
          slotPool[si].img.fetchPriority = (rel >= -HIGH_PRI_BEHIND && rel <= HIGH_PRI_AHEAD) ? 'high' : 'low';
        }
        loadEntry(manifest[i]);
      }
    }
    prefetchAroundIndex(centerIdx);
  }

  // ── INCREMENTAL SHIFT: moves the window by `delta` entries by dropping
  // slots off one end and adding them on the other. Never touches
  // reader.scrollTop directly -- _syncSpacers() at the end keeps the
  // spacers' heights consistent with the new window, which is what keeps
  // the visible content from moving (see FULL-HEIGHT SPACERS above). ──
  function _shiftConveyorWindow(delta) {
    if (delta > 0) {
      const frag = document.createDocumentFragment();
      for (let k = 0; k < delta; k++) {
        const oldIdx = windowLo + k;
        manifest[oldIdx].loaded = false;
        assignedSlot[oldIdx] = -1;
        slotPool[k].el.remove();

        const newIdx = windowHi + 1 + k;
        const { el } = _makeSlotEl();
        el.style.height = manifest[newIdx].scaledH + 'px';
        frag.appendChild(el);
        loadEntry(manifest[newIdx]);
      }
      readerInner.insertBefore(frag, bottomSpacer);
      windowLo += delta;
      windowHi += delta;
    } else {
      const n = -delta;
      const frag = document.createDocumentFragment();
      for (let k = n - 1; k >= 0; k--) {
        const newIdx = windowLo - 1 - k;
        const { el } = _makeSlotEl();
        el.style.height = manifest[newIdx].scaledH + 'px';
        frag.appendChild(el);
        loadEntry(manifest[newIdx]);
      }
      readerInner.insertBefore(frag, topSpacer.nextSibling);
      for (let k = 0; k < n; k++) {
        const oldIdx = windowHi - k;
        manifest[oldIdx].loaded = false;
        assignedSlot[oldIdx] = -1;
        slotPool[slotPool.length - 1 - k].el.remove();
      }
      windowLo -= n;
      windowHi -= n;
    }

    // Rebuild slotPool by walking the DOM strictly between the two spacers
    // -- robust regardless of how many slots were added/removed above,
    // and never mistakes a spacer for a slot the way indexing
    // reader.children directly would now that spacers are permanent
    // siblings of the slot pool.
    slotPool.length = 0;
    let node = topSpacer.nextSibling;
    let k = 0;
    while (node && node !== bottomSpacer) {
      slotPool.push({ el: node, img: node.querySelector('img') });
      assignedSlot[windowLo + k] = k;
      node = node.nextSibling;
      k++;
    }
    _syncSpacers();
    prefetchAroundIndex(Math.floor((windowLo + windowHi) / 2));
  }

  // ── RECENTER: called on scroll-stop. Re-centers the materialized window
  // on the entry at the top of the viewport, as close as edges allow. ──
  function recenterConveyor() {
    if (manifest.length === 0) return;
    const currentIdx = Math.min(manifest.length - 1, firstIndexAfter(virtualY));
    const count  = Math.min(SLOT_COUNT, manifest.length);
    const target = Math.max(0, Math.min(currentIdx - Math.floor(count / 2), manifest.length - count));
    const delta  = target - windowLo;
    if (delta === 0) return;
    if (Math.abs(delta) >= count) {
      _rebuildConveyorWindow(target, virtualY);
    } else {
      _shiftConveyorWindow(delta);
    }
  }

  // updateProgressBar()/scheduleProgressSave() each do several full-manifest
  // linear scans (getCurrentGlobalPageIdx, checkChapterCompletion, the
  // active-chapter/active-page lookups inside updateProgressBar itself) plus
  // DOM queries — the UI they drive (progress bar, chapter label, page
  // slider) doesn't need per-frame precision, but syncScrollPosition used to
  // run them on every single native 'scroll' event unthrottled. Continuous
  // BLE-scroller-driven scrolling writes reader.scrollTop every rAF frame
  // (~60Hz), and that cost was enough to occasionally blow the frame budget
  // — the resulting dropped/delayed frames read as scroll choppiness that
  // got WORSE the faster the scroller was going (a bigger catch-up jump per
  // dropped frame at higher px/sec), which is why it looked like an
  // acceleration-curve problem but wasn't one (2026-07-08). Throttled to
  // ~12Hz with a trailing call so the final position after scrolling stops
  // is never more than one throttle window stale.
  const SCROLL_BOOKKEEPING_THROTTLE_MS = 80;
  let _scrollBookkeepingLastRun = 0;
  let _scrollBookkeepingTimer   = null;
  function runScrollBookkeeping() {
    _scrollBookkeepingLastRun = performance.now();
    _scrollBookkeepingTimer = null;
    updateProgressBar();
    scheduleProgressSave();
  }
  function throttledScrollBookkeeping() {
    const elapsed = performance.now() - _scrollBookkeepingLastRun;
    if (elapsed >= SCROLL_BOOKKEEPING_THROTTLE_MS) {
      runScrollBookkeeping();
    } else if (!_scrollBookkeepingTimer) {
      _scrollBookkeepingTimer = setTimeout(runScrollBookkeeping, SCROLL_BOOKKEEPING_THROTTLE_MS - elapsed);
    }
  }

  // ── SYNC: lightweight, called on every native scroll event. ──
  // How close (in manifest entries) the current position may get to either
  // edge of the materialized window before syncScrollPosition proactively
  // recenters mid-gesture, rather than waiting for scrollend/settle. Keeps
  // a long continuous scroll (fast flick, held wheel, BLE scroller) from
  // ever outrunning the window and hitting #reader's real DOM edge -- the
  // "scroll stops after ~40 pages" bug. Safe to call recenterConveyor here
  // now that _shiftConveyorWindow never writes reader.scrollTop directly
  // (see its own comment) -- it can no longer fight native scroll momentum
  // the way the old scrollTop-compensating version could.
  const EDGE_MARGIN = Math.floor(SLOT_COUNT / 4);

  function syncScrollPosition() {
    if (manifest.length === 0) return;
    virtualY = reader.scrollTop;
    throttledScrollBookkeeping();
    // True end-of-manifest bound (matches momentumLoop's own check below) --
    // NOT reader.scrollHeight, which is now always the full cursorY thanks
    // to the spacers and would make this fire at the wrong position anyway.
    if (currentChapIdx >= chapterList.length - 1 && virtualY >= cursorY - viewH - 1) {
      showLastPagePopup();
      // checkChapterCompletion() only ever fires on a chapter-boundary crossing
      // (visibleChapterId changing), which never happens for the manga's last
      // chapter — there's no next chapter to scroll into, so it would otherwise
      // never get marked completed. This is that missing case: reaching the true
      // end of the whole manifest completes the last chapter directly. Guarded
      // so it only posts once per page load, not on every scroll tick spent
      // sitting at the bottom.
      if (!finalChapterCompletionSaved) {
        finalChapterCompletionSaved = true;
        saveReadingProgress(chapterList[chapterList.length - 1].id);
      }
    }
    const idxAtTop = firstIndexAfter(virtualY);
    if (idxAtTop - windowLo < EDGE_MARGIN || windowHi - idxAtTop < EDGE_MARGIN) {
      recenterConveyor();
    }
  }

  // ── NATIVE SCROLL WIRING ──
  // recenterConveyor is now safe to call at any time, including mid-gesture
  // (see EDGE_MARGIN above and _shiftConveyorWindow's own comment) -- it no
  // longer writes reader.scrollTop directly except via _rebuildConveyorWindow's
  // "big jump" branch, which EDGE_MARGIN's small, frequent recenters keep
  // this code path from reaching in ordinary continuous scrolling. scrollend
  // (or the settle-poll fallback below, for browsers without it) still runs
  // recenterConveyor too, as a final correction once scrolling fully stops --
  // harmless to call redundantly, since recenterConveyor no-ops if the
  // window's already correctly centered.
  const supportsScrollEnd = 'onscrollend' in window;

  reader.addEventListener('scroll', () => {
    syncScrollPosition();
    if (!supportsScrollEnd) scheduleSettledCheck();
  }, { passive: true });

  if (supportsScrollEnd) {
    reader.addEventListener('scrollend', recenterConveyor, { passive: true });
  }

  let _settledRaf   = null;
  let _settledLast  = 0;
  let _settledTicks = 0;
  function scheduleSettledCheck() {
    _settledTicks = 0;
    if (_settledRaf) return;
    _settledLast = reader.scrollTop;
    _settledRaf  = requestAnimationFrame(_settledTick);
  }
  function _settledTick() {
    const cur = reader.scrollTop;
    if (cur === _settledLast) {
      _settledTicks++;
      if (_settledTicks >= 2) { _settledRaf = null; recenterConveyor(); return; }
    } else {
      _settledTicks = 0;
      _settledLast  = cur;
    }
    _settledRaf = requestAnimationFrame(_settledTick);
  }

  // ── SET VIRTUAL Y (programmatic jumps: bookmarks, slider, mode switch) ──
  function setVirtualY(newY) {
    const maxY = Math.max(0, cursorY - viewH);
    virtualY = Math.max(0, Math.min(newY, maxY));
    if (manifest.length === 0) return;
    const currentIdx = Math.min(manifest.length - 1, firstIndexAfter(virtualY));
    const count  = Math.min(SLOT_COUNT, manifest.length);
    const target = Math.max(0, Math.min(currentIdx - Math.floor(count / 2), manifest.length - count));
    _rebuildConveyorWindow(target, virtualY);
    updateProgressBar();
    scheduleProgressSave();
  }

  // ── applyManifestToSlots: called after geometry changes (padding/width).
  // Clears the conveyor; the caller's subsequent setVirtualY rebuilds it. ──
  function applyManifestToSlots() {
    for (let i = windowLo; i <= windowHi; i++) {
      manifest[i].loaded = false;
      assignedSlot[i] = -1;
    }
    _clearSlotPool();
    windowLo = 0;
    windowHi = -1;
  }

  // ── JUMP TO OPENING CHAPTER ──
  // globalY is computed from dims.json synchronously — materialize the
  // conveyor window centered on it before first paint.
  const startIdx = chapterStart[chapterId];
  let startGlobalIdx = 0;
  if (startIdx !== undefined) {
    const targetIdx = startPage > 0 ? Math.min(startIdx + startPage, manifest.length - 1) : startIdx;
    startGlobalIdx = targetIdx;
    virtualY = manifest[targetIdx].globalY;
  }

  if (manifest.length > 0) {
    const count  = Math.min(SLOT_COUNT, manifest.length);
    const target = Math.max(0, Math.min(startGlobalIdx - Math.floor(count / 2), manifest.length - count));
    _rebuildConveyorWindow(target, virtualY);
  }

  // Prime the URL cache for the opening chapter, then let the tier system
  // load only the pages around the starting position.
  ensureChapterUrls(chapterId).then(() => {
    prefetchAroundIndex(startGlobalIdx);
  });

  // ── MOMENTUM SCROLL ──
  let velocity = 0;
  let rafId    = null;

  function momentumLoop() {
    if (Math.abs(velocity) < 2.5) {
      velocity = 0;
      rafId    = null;
      return;
    }
    velocity *= 0.982;
    const atEnd = virtualY >= cursorY - viewH - 1;
    if (velocity > 0 && currentChapIdx >= chapterList.length - 1 && atEnd) {
      velocity = 0;
      rafId    = null;
      showLastPagePopup();
      return;
    }
    reader.scrollTop += velocity;
    rafId = requestAnimationFrame(momentumLoop);
  }

  // ── NATIVE BLE BRIDGE (Android APK only) ──
  window.injectScroll = function(delta) {
    const sensitivity = Math.abs(delta) < 20 ? 4.0 : 0.6;
    velocity += delta * sensitivity;
    if (!rafId) rafId = requestAnimationFrame(momentumLoop);
  };

  // ── WHEEL INPUT (PC) ──
  // Long-strip: native wheel scrolling on #reader (overflow-y: auto) handles
  // this with no JS involvement. This listener now only intercepts wheel
  // events in single-page mode, where wheel ticks flip pages.
  let spWheelAccum  = 0;
  let spWheelTimer  = null;
  const SP_WHEEL_THRESHOLD = 60;

  window.addEventListener('wheel', e => {
    if (readerSettings.mode !== 'single-page') return;
    e.preventDefault();
    let raw = e.deltaY;
    if (e.deltaMode === 1) raw *= 32;
    if (e.deltaMode === 2) raw *= window.innerHeight;

    spWheelAccum += raw;
    if (Math.abs(spWheelAccum) >= SP_WHEEL_THRESHOLD) {
      const dir = spWheelAccum > 0 ? 1 : -1;
      spWheelAccum = 0;
      clearTimeout(spWheelTimer);
      spWheelTimer = setTimeout(() => { spWheelAccum = 0; }, 300);
      if (dir > 0) spNext(); else spPrev();
    }
  }, { passive: false });

  // ── TOUCH INPUT (tablet / phone) ──
  // Long-strip: native touch scrolling on #reader (overflow-y: auto) handles
  // drag, momentum and rubber-banding directly. These listeners now only
  // track touchMoved, so the document click handler can tell a tap (toggle
  // UI bars) apart from a scroll-drag.
  let touchStartY   = 0;
  let touchMoved    = false;
  const TOUCH_TAP_THRESHOLD = 8;

  reader.addEventListener('touchstart', e => {
    if (readerSettings.mode === 'single-page') return;
    velocity = 0;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    touchStartY = e.touches[0].clientY;
    touchMoved  = false;
  }, { passive: true });

  reader.addEventListener('touchmove', e => {
    if (readerSettings.mode === 'single-page') return;
    const y = e.touches[0].clientY;
    if (Math.abs(y - touchStartY) > TOUCH_TAP_THRESHOLD) touchMoved = true;
  }, { passive: true });

  reader.addEventListener('touchend', e => {
    if (readerSettings.mode === 'single-page') return;
    if (!touchMoved) return;
    e.preventDefault();
  }, { passive: false });

  // ── FRAGMENT PROGRESS BAR ──
  const fragProgress = document.getElementById('fragProgress');

  // Read theme primary color from CSS variable (set by app.js via loadTheme)
  const themeColor = getComputedStyle(document.documentElement)
                       .getPropertyValue('--color-primary').trim() || '#e94560';
  document.documentElement.style.setProperty('--theme-primary', themeColor);

  const leftTooltip = document.getElementById('leftTooltip');

  // Tracks which chapter the left bar is currently built for
  let fragProgressChapterId = chapterId;
  let chapterManifest = manifest.filter(e => e.chapterId === chapterId);
  let totalPages      = chapterManifest.length;

  function rebuildFragProgress(forChapterId) {
    fragProgressChapterId = forChapterId;
    chapterManifest = manifest.filter(e => e.chapterId === forChapterId);
    totalPages      = chapterManifest.length;

    fragProgress.querySelectorAll('.frag-seg').forEach(s => s.remove());

    for (let i = 0; i < totalPages; i++) {
      const seg = document.createElement('div');
      seg.className = 'frag-seg';

      seg.addEventListener('mouseenter', () => {
        leftHoveredIdx = i;
        leftTooltip.textContent = `${i + 1} / ${totalPages}`;
        const r = seg.getBoundingClientRect();
        leftTooltip.style.left      = (r.right + 14) + 'px';
        leftTooltip.style.top       = (r.top + r.height / 2) + 'px';
        leftTooltip.style.transform = 'translateY(-50%)';
        leftTooltip.classList.add('pinned');
      });
      seg.addEventListener('mouseleave', () => {
        leftHoveredIdx = null;
        leftTooltip.classList.remove('pinned');
      });
      seg.addEventListener('click', (e) => {
        e.stopPropagation();
        const target = chapterManifest[i];
        if (!target) return;
        if (readerSettings.mode === 'single-page') {
          const spIdx = spManifest.indexOf(target);
          if (spIdx !== -1) spGotoIdx(spIdx);
          else goToChapter(`/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${forChapterId}`);
        } else {
          setVirtualY(target.globalY);
          const globalIdx = manifest.indexOf(target);
          if (globalIdx !== -1) prefetchAroundIndex(globalIdx);
        }
      });

      fragProgress.appendChild(seg);
    }
  }

  // Initial build for the opening chapter
  rebuildFragProgress(chapterId);

  // ── GLOBAL PAGE SLIDER ──
  // Flat ordered list of all pages across all chapters in reading order
  const globalManifest = manifest; // already in order

  const pageSliderWrap  = document.getElementById('pageSliderWrap');
  const pageSliderInput = document.getElementById('pageSliderInput');
  const pageSliderLabel = document.getElementById('pageSliderLabel');
  const thumbStrip      = document.getElementById('thumbStrip');

  pageSliderInput.max   = Math.max(0, globalManifest.length - 1);
  pageSliderInput.value = 0;
  pageSliderLabel.textContent = `1 / ${globalManifest.length}`;

  let sliderDragging    = false;
  let stripVisible      = false;

  // Returns the current global page index based on scroll/single-page position
  function getCurrentGlobalPageIdx() {
    if (readerSettings.mode === 'single-page') {
      const entry = spManifest[spCurrentIdx];
      return entry ? manifest.indexOf(entry) : 0;
    }
    const midY = currentTrackingY();
    let idx = 0;
    for (let i = 0; i < manifest.length; i++) {
      if (manifest[i].globalY <= midY) idx = i;
      else break;
    }
    return idx;
  }

  // Navigate reader to a global manifest index
  function navigateToGlobalIdx(idx) {
    const entry = globalManifest[idx];
    if (!entry) return;
    if (readerSettings.mode === 'single-page') {
      if (entry.chapterId === chapterId) {
        const spIdx = spManifest.indexOf(entry);
        if (spIdx !== -1) { spGotoIdx(spIdx); return; }
      }
      goToChapter(
        `/manga/${libraryId}/${mangaId}/${isVolume ? 'volume' : 'chapter'}/${entry.chapterId}?page=${entry.localIdx}`
      );
    } else {
      setVirtualY(entry.globalY);
      prefetchAroundIndex(idx);
    }
    updateProgressBar();
  }

  // ── SLIDER VISIBILITY ──
  function syncSliderVisibility() {
    if (barVisible) {
      const globalIdx = getCurrentGlobalPageIdx();
      pageSliderInput.value = globalIdx;
      pageSliderLabel.textContent = `${globalIdx + 1} / ${globalManifest.length}`;
      pageSliderWrap.classList.add('visible');
    } else {
      pageSliderWrap.classList.remove('visible');
      hideThumbStrip();
    }
  }

  // ── SLIDER INPUT EVENTS ──
  pageSliderInput.addEventListener('mousedown', () => { sliderDragging = true; });
  pageSliderInput.addEventListener('touchstart', () => { sliderDragging = true; }, { passive: true });

  pageSliderInput.addEventListener('input', () => {
    const idx = Number(pageSliderInput.value);
    pageSliderLabel.textContent = `${idx + 1} / ${globalManifest.length}`;
    if (!stripVisible) showThumbStrip(idx);
    else buildThumbStrip(idx);
    clearTimeout(barTimer);
  });

  pageSliderInput.addEventListener('mouseup', (e) => {
    sliderDragging = false;
    if (stripVisible) {
      e.stopPropagation();
      clearTimeout(barTimer);
    }
  });

  pageSliderInput.addEventListener('click', (e) => {
    if (stripVisible) e.stopPropagation();
  });

  pageSliderInput.addEventListener('touchend', () => {
    sliderDragging = false;
    if (stripVisible) clearTimeout(barTimer);
  }, { passive: true });

  pageSliderWrap.addEventListener('click', (e) => {
    if (e.target === pageSliderWrap) {
      hideThumbStrip();
      clearTimeout(barTimer);
      barTimer = setTimeout(() => hideAll(), 3000);
      return;
    }
    if (stripVisible) e.stopPropagation();
  });

  const thumbTrack   = document.getElementById('thumbTrack');
  const THUMB_W      = 100; // px, matches CSS
  const THUMB_GAP    = 6;   // px, matches CSS
  const THUMB_STEP   = THUMB_W + THUMB_GAP; // px per thumb cell
  const THUMB_BUFFER = 5;   // cells to render outside visible edges

  let stripAbortCtrl  = null;
  let stripCenterIdx  = 0;   // global manifest index at the center of the visible window
  let _trackOffset    = 0;   // current translateX of the track (negative = scrolled right)
  let _renderedLo     = 0;   // lowest global index currently in the DOM
  let _renderedHi     = -1;  // highest global index currently in the DOM
  let _cellMap        = {};  // gi → DOM cell element

  // ── VELOCITY TRACKING ──
  let _sliderLastIdx  = 0;
  let _sliderLastTime = 0;
  let _sliderVelocity = 0;
  const VELOCITY_THRESHOLD = 12;
  const THUMB_DEBOUNCE_MS  = 100;
  let _thumbDebounceTimer  = null;

  function _measureSliderVelocity(newIdx) {
    const now = performance.now();
    const dt  = (now - _sliderLastTime) / 1000;
    if (dt > 0 && dt < 1.0) {
      const instantV = Math.abs(newIdx - _sliderLastIdx) / dt;
      _sliderVelocity = _sliderVelocity * 0.6 + instantV * 0.4;
    } else {
      _sliderVelocity = 0;
    }
    _sliderLastIdx  = newIdx;
    _sliderLastTime = now;
  }

  function _cancelThumbLoading() {
    if (stripAbortCtrl) { stripAbortCtrl.abort(); stripAbortCtrl = null; }
    clearTimeout(_thumbDebounceTimer);
    _thumbDebounceTimer = null;
  }

  // ── TRACK POSITION ──
  // trackOffset for a given center global index:
  // we want the center thumb to be at the middle of the strip window.
  function _stripW() {
    // getBoundingClientRect returns 0 before first paint (display:none → block transition)
    // Use the slider wrap width as a reliable proxy since they share the same width.
    const r = pageSliderWrap.getBoundingClientRect().width;
    return r > 0 ? r : window.innerWidth - 40;
  }

  function _offsetForIdx(gi) {
    const centerPx = gi * THUMB_STEP;
    const targetX  = _stripW() / 2 - THUMB_W / 2;
    return targetX - centerPx;
  }

  function _clampOffset(offset) {
    const maxOff = _offsetForIdx(0);
    const minOff = _offsetForIdx(globalManifest.length - 1);
    return Math.max(minOff, Math.min(maxOff, offset));
  }

  function _idxAtOffset(offset) {
    const centerPx = _stripW() / 2 - offset;
