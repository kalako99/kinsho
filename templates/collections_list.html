<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ theme_css | safe }}
  <title>Collections — KINSHO</title>
  <script src="/static/api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-background);
      color: var(--color-text);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: var(--color-secondary);
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--color-text);
      transition: background 0.2s;
    }
    .settings-btn:hover { background: #2a2a2a; }
    .settings-btn svg { display: block; }

    .category-page-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--color-primary);
      margin-left: 14px;
    }

    .new-collection-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--color-primary);
      border-radius: 20px;
      color: var(--color-primary);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .new-collection-btn:hover { background: var(--color-primary); color: #fff; }

    /* ── GRID SECTION ── */
    .grid-section { padding: 12px 20px; }
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(100px, 13vw, 160px), 1fr));
      gap: 16px 12px;
    }

    /* ── THUMBNAIL CARD (same as manga list) ── */
    .manga-thumb {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .manga-thumb:hover { transform: translateY(-4px); }
    .manga-thumb .cover {
      width: 100%;
      height: calc(clamp(100px, 13vw, 160px) * 3 / 2);
      background: var(--color-secondary);
      border-radius: 11px;
      border: 1px solid #333;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .manga-thumb .cover img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 11px;
      display: block;
    }
    .manga-thumb .cover span {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.7rem;
    }
    .manga-thumb .cover .shared-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: auto;
      height: auto;
      display: inline-block;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 6px;
      pointer-events: none;
    }
    .manga-thumb .card-body { padding: 5px 2px 0; }
    .manga-thumb .thumb-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .manga-thumb .thumb-sub {
      font-size: 0.65rem;
      color: #888;
    }

    .state-msg {
      text-align: center;
      padding: 48px 20px;
      color: #555;
      font-size: 0.85rem;
    }

    /* ── NEW COLLECTION POPUP ── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popup {
      background: var(--color-secondary, #1a1a1a);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      width: 340px;
      max-width: 90vw;
    }
    .popup-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--color-text, #f0f0f0);
    }
    .popup input[type="text"] {
      width: 100%;
      background: var(--color-background, #0f0f0f);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--color-text, #f0f0f0);
      font-size: 0.85rem;
      font-family: 'Segoe UI', sans-serif;
      outline: none;
      margin-bottom: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .popup input[type="text"]:focus { border-color: var(--color-primary, #e94560); }
    .popup-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .popup-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: filter 0.2s;
    }
    .popup-btn.primary {
      background: var(--color-primary, #e94560);
      color: #fff;
    }
    .popup-btn.primary:hover { filter: brightness(0.85); }
    .popup-btn.primary:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }
    .popup-btn.soft {
      background: rgba(255,255,255,0.07);
      color: var(--color-text, #f0f0f0);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .popup-btn.soft:hover { background: rgba(255,255,255,0.13); }

    /* ── BACKGROUND LAYER ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bg-layer.blurred { filter: blur(8px); transform: scale(1.05); }
    .bg-overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,0.35); }
    #app { position: relative; z-index: 0; }
  </style>
</head>
<body>

{% raw %}
<div id="app">
    <div class="bg-layer" :class="{ blurred: bgIsRaster }" :style="bgLayerStyle"></div>
    <div class="bg-overlay" v-if="bgLayerStyle"></div>

  <div class="topbar">
    <button class="settings-btn" @click="goBack">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>

    <span class="category-page-title">Collections</span>

    <button class="new-collection-btn" @click="showCreatePopup = true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Collection
    </button>
  </div>

  <div class="grid-section">
    <div v-if="loading" class="state-msg">Loading…</div>
    <div v-else-if="collections.length === 0" class="state-msg">No collections yet. Create one to get started.</div>
    <div class="manga-grid" v-else>
      <div class="manga-thumb" v-for="c in collections" :key="c.id" @click="openCollection(c.id)">
        <div class="cover">
          <img v-if="c.cover_url" :src="c.cover_url" :alt="c.name">
          <span v-else>No Cover</span>
          <span v-if="c.shared" class="shared-badge">SHARED</span>
        </div>
        <div class="card-body">
          <div class="thumb-title">{{ c.name }}</div>
          <div class="thumb-sub">{{ c.member_count }} series</div>
        </div>
      </div>
    </div>
  </div>

  <!-- NEW COLLECTION POPUP -->
  <div class="popup-overlay" v-if="showCreatePopup" @mousedown="onOverlayMouseDown" @click="onOverlayClick($event, () => showCreatePopup = false)">
    <div class="popup">
      <div class="popup-title">New Collection</div>
      <input type="text" v-model="newCollectionName" placeholder="Collection name…" @keyup.enter="createCollection" ref="newNameRef"/>
      <div class="popup-actions">
        <button class="popup-btn soft" @click="showCreatePopup = false">Cancel</button>
        <button class="popup-btn primary" @click="createCollection" :disabled="!newCollectionName.trim()">Create</button>
      </div>
    </div>
  </div>

</div>
{% endraw %}

<script src="/static/collections_list.js"></script>
</body>
</html>
