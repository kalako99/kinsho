services:
  kinsho:
    image: ghcr.io/kalako99/kinsho:latest
    container_name: kinsho
    restart: unless-stopped
    # Run as your own user so files Kinsho creates aren't owned by root.
    # Find yours with `id -u` and `id -g`; the data folder must belong to it.
    user: "1000:1000"
    ports:
      # Open Kinsho at http://<your-server>:8088. Change the left number for another port.
      - "8088:8000"
    volumes:
      # Kinsho's own data (users, progress, covers). Keep it on a backed-up drive.
      - ./kinsho-data:/data
      # Your manga/comics. Add one line per drive or folder you want to use.
      # Kept writable (no :ro): auto-extract, volume renaming and "Save metadata
      # to ComicInfo.xml" write here. Add :ro only if you use none of them.
      - /path/to/your/manga:/manga
